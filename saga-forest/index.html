<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script>/* 주소창에서 파일 이름을 지운다 — /xxx/index.html → /xxx/ */
try{if(location.protocol!=='file:'&&/\/index\.html$/.test(location.pathname))history.replaceState(null,'',location.pathname.replace(/index\.html$/,'')+location.search+location.hash);}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#7ec8e8">
<title>사가의숲 — 모으고 나눈다</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="사가의숲">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>

<!-- 마을 (전체화면) -->
<canvas id="map"></canvas>
<div id="vignette"></div>

<!-- 상단: 프로필 · 재화 · 도구 -->
<div id="top">
  <div class="glass profile" id="profile"></div>
  <div class="tools">
    <button class="icon-btn" id="btn-auto" title="자동 마을살이 (대신 모으고 나눠 준다)">🤖</button>
    <button class="icon-btn" id="btn-do" title="손을 쓴다 (Space)">✋</button>
    <button class="icon-btn" id="btn-sneak" title="살금살금 (Shift) — 벌레가 달아나지 않습니다">🐾</button>
    <button class="icon-btn txt" id="btn-prop" title="캐릭터 등신 (4등신/2등신/8등신)">4등</button>
    <button class="icon-btn" id="btn-style" title="그림 양식 (전통 / 그림책 / 만화)">📗</button>
    <button class="icon-btn" id="btn-help" title="도움말">❔</button>
    <button class="icon-btn" id="btn-reset" title="처음부터">↺</button>
  </div>
  <div class="glass wallet" id="wallet"></div>
</div>

<!-- 자동 상태 -->
<div id="autobar"></div>

<!-- 하단 중앙: 손이 닿는 것 -->
<div id="focusbar"></div>

<!-- 우하단: 액션 독 -->
<nav id="dock">
  <button data-sheet="bag"><span>🎒</span><small>가방</small></button>
  <button data-sheet="folks"><span>🏡</span><small>주민</small></button>
  <button data-sheet="home"><span>🏠</span><small>집</small></button>
  <button data-sheet="mail"><span>📮</span><small>편지</small></button>
  <!-- 공사 — 개토패를 사기 전에는 숨어 있다 (ui.js 의 syncDock) -->
  <button data-sheet="build" style="display:none"><span>🪧</span><small>공사</small></button>
  <button data-sheet="dex"><span>📖</span><small>도감</small></button>
  <button data-sheet="log"><span>📜</span><small>기록</small></button>
</nav>

<!-- 슬라이드 시트 -->
<div id="scrim"></div>
<aside id="sheet">
  <div class="sheet-head">
    <div class="grip"></div>
    <h3 id="sheet-title">가방</h3>
    <button class="icon-btn sm" id="sheet-close">✕</button>
  </div>
  <div id="sheet-body"></div>
</aside>

<div id="encounter"></div><div id="detail"></div>
<div id="toast"></div>

<script src="js/data.js"></script>
<script src="js/data-village.js"></script>
<script src="js/sprite.js"></script>
<script src="js/core.js"></script>
<script src="js/account.js"></script>
<script src="js/hero.js"></script>
<script src="js/village.js"></script>
<script src="js/bug.js"></script>
<script src="js/home.js"></script>
<script src="js/mail.js"></script>
<script src="js/museum.js"></script>
<script src="js/town.js"></script>
<script src="js/folk.js"></script>
<script src="js/turnip.js"></script>
<script src="js/wear.js"></script>
<script src="js/terrain.js"></script>
<script src="js/village-view.js"></script>
<script src="js/net.js"></script>
<script src="js/ai.js"></script>
<script src="js/auto.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
<script>
/* 서비스 워커 — https · localhost 에서만 등록된다.
   파일을 늘리거나 고쳤으면 sw.js 의 VERSION 도 같이 올릴 것. */
(function () {
  if (!('serviceWorker' in navigator)) { return; }
  var h = location.hostname;
  var secure = location.protocol === 'https:' || h === 'localhost' || h === '127.0.0.1';
  if (!secure) { return; }
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js')['catch'](function (e) {
      console.warn('서비스 워커 등록 실패', e);
    });
  });
})();
</script>
</body>
</html>
