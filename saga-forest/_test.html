<!-- three.js 는 씨앗을 잠그기 전에 싣는다 — 라이브러리 자체 내부의 Math.random()
     (UUID 생성 따위)가 게임 난수열에 끼어들지 않게. 게임 스크립트는 전부
     아래 씨앗 고정 다음에 실린다 -->
<script src="js/vendor/three.iife.js"></script>
<script>
window.DG_NO_DRAW = true; window.DG_NO_ACCOUNT = true; window.DG_NO_LOOP = true;
/* 어드민의 균형 손잡이를 읽지 않는다 — 손잡이를 잡아 둔 기기에서
   판정이 흔들리면 안 된다 (씨앗을 고정한 것과 같은 이유다) */
window.DG_NO_TUNE = true;

/* 무작위 고정 — 진단이 굴릴 때마다 달라지면 판정이 흔들린다.
   게임 스크립트보다 **먼저** 갈아 둬야 부트에서 쓰는 난수까지 잡힌다.
   (실제 플레이는 그대로다 — 이 파일 안에서만 바꾼다)
   mulberry32: 짧고 분포가 고르며 같은 씨앗이면 같은 수열이 나온다. */
(function (seed) {
  var s = seed >>> 0;
  Math.random = function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  window.DG_SEED = seed;
})(20260824);
</script>

<script>
(function () {
  var out = [], errors = [];
  window.addEventListener('error', function (e) { errors.push(e.message); });

  function t(name, fn) {
    try {
      var r = fn();
      out.push((r ? '<span class="pass">PASS</span> ' : '<span class="fail">FAIL</span> ') +
        name + (typeof r === 'string' ? ' — ' + r : ''));
      return !!r;
    } catch (e) {
      out.push('<span class="fail">FAIL</span> ' + name + ' — 예외: ' + e.message);
      return false;
    }
  }

  setTimeout(function () {
    var C = DG.core, V = DG.village, VD = DG.villageData, AU = DG.auto;

    t('다른 게임의 모듈은 실려 있지 않다', function () {
      var gone = ['world', 'encounter', 'dungeon', 'item'];
      var leaked = gone.filter(function (k) { return !!DG[k]; });
      return leaked.length === 0 && '지도·조우·던전·장비 없음';
    });

    t('데이터는 그대로 물려받았다', function () {
      return DG.data.heroes.length === 70 &&
        ('인물 ' + DG.data.heroes.length);
    });

    /* ── 3D 에셋 창고 (PLAN 40절 PHASE 1~2 — 자리를 파고 GLB 를 채웠다) ── */

    t('THREE 가 실려 있다', function () {
      return typeof THREE === 'object' && typeof THREE.GLTFLoader === 'function' &&
        'THREE + GLTFLoader';
    });

    t('asset3d 표는 임의 키로도 순수 함수로 검사할 수 있다 (렌더러 없이)', function () {
      var A3 = DG.asset3d;
      var before = Object.keys(A3.REG()).length;
      A3.clear();
      var r = A3.lookup('scratch', { id: 'pine' }) === null &&
        A3.register('scratch', 'x.glb') && A3.lookup('scratch').url === 'x.glb' &&
        A3.register('scratch:pine', 'y.glb') &&
        A3.lookup('scratch', { id: 'pine' }).key === 'scratch:pine';
      A3.restore();
      return r && Object.keys(A3.REG()).length === before &&
        '빈 표 → null · 넓은 키 → 좁은 키 우선 · restore 로 원상복구';
    });

    t('asset3d 기본 표에 PLAN 8·16절 어휘가 다 채워져 있다', function () {
      var A3 = DG.asset3d;
      var need = ['tree:common', 'tree:common:autumn', 'tree:common:snow', 'tree:dead',
        'tree:pine', 'tree:birch', 'bush', 'rock', 'rock:moss', 'grass', 'flower', 'plant',
        'mushroom', 'stump', 'log', 'bench', 'fence', 'cart', 'campfire', 'tent', 'lantern',
        'well', 'bridge', 'animal:an_deer', 'animal:an_wolf', 'animal:an_fox', 'hero'];
      var reg = A3.REG(), missing = need.filter(function (k) { return !reg[k]; });
      return missing.length === 0 && (need.length + '개 키 다 참 · 등록 ' + Object.keys(reg).length + '개');
    });

    t('나무 키는 계절별로 갈라지고, ref.id 로 좁은 키를 먼저 찾는다', function () {
      var A3 = DG.asset3d;
      var spring = A3.lookup('tree:common', {});
      var autumn = A3.lookup('tree:common:autumn', {});
      var dead = A3.lookup('tree', { id: 'dead' });   // 'tree:dead' 를 좁은 키로 먼저 찾는다
      return spring.key === 'tree:common' && autumn.key === 'tree:common:autumn' &&
        spring.url !== autumn.url && dead.key === 'tree:dead' &&
        '봄여름 ≠ 가을 · tree + id:dead → tree:dead';
    });

    t('같은 사람은 늘 같은 몸을 입는다 (hero 조합 해시)', function () {
      var A3 = DG.asset3d;
      var a1 = A3.oneOf(A3.lookup('hero').url, { id: 'h_012' });
      var a2 = A3.oneOf(A3.lookup('hero').url, { id: 'h_012' });
      return a1 === a2 && a1.body && a1.outfit && a1.hair &&
        '같은 id → 같은 조합 (' + a1.key + ')';
    });

    t('heroRecipe — 표에 조합 객체가 있을 때만 몸+옷+머리를 준다', function () {
      var A3 = DG.asset3d;
      var rec = A3.heroRecipe({ id: 'h_012' });
      var ok = rec && rec.body && rec.outfit && rec.hair;
      A3.register('hero', 'flat.glb');           // 문자열 하나로 덮으면
      var flat = A3.heroRecipe({ id: 'h_012' });  // 조합이 아니니 null
      A3.restore();
      return ok && flat === null && '조합 객체 → 몸+옷+머리 · 문자열 하나 → null';
    });

    t('mapClips — 이름이 뒤섞인 클립도 자리(idle·walk·attack…)를 찾아낸다', function () {
      var A3 = DG.asset3d;
      var m = A3.mapClips(['Armature|mixamo.com|Idle_Loop', 'Walk.001', 'Anim_Attack_Slash', 'RunCycle']);
      var empty = A3.mapClips([]);
      return m.idle === 'Armature|mixamo.com|Idle_Loop' && m.walk === 'Walk.001' &&
        m.attack === 'Anim_Attack_Slash' && m.run === 'RunCycle' &&
        empty.idle === undefined && !!empty.alias &&
        '넷 다 제자리 · 빈 목록 → 빈 표';
    });

    t('mapClips — 못 채운 자리는 대타로 메운다 (idle 하나뿐이면 나머지가 다 그걸로)', function () {
      var A3 = DG.asset3d;
      var m = A3.mapClips(['idle']);
      return m.attack === 'idle' && m.alias.attack === 'idle' &&
        m.hit === 'idle' && m.alias.hit === 'idle' &&
        'attack·hit 모두 idle 대타';
    });

    /* ── 3D 마을 화면 (PLAN 40절 PHASE 2 — Player 3D) ─────── */

    t('village-view3d — three 는 실려 있으니 available, init 을 안 불렀으니 active 는 아니다', function () {
      var VV3 = DG.villageView3d;
      return VV3.available() === true && VV3.active() === false &&
        VV3.on() === false && '켜기 전 기본값 그대로';
    });

    t('village-view3d — toggle 은 손잡이를 뒤집지만, init 없이는 여전히 active 가 아니다', function () {
      var VV3 = DG.villageView3d;
      var before = VV3.on();
      var after = VV3.toggle();
      var stillOff = VV3.active();          // init() 을 부른 적이 없으니 ready 가 false
      VV3.toggle();                          // 되돌린다 — 다른 항목에 안 번지게
      return before === false && after === true && stillOff === false &&
        '손잡이는 뒤집힘 · 화면은 init 없이 안 켜짐';
    });

    t('village-view3d — 흩뿌릴 kind 는 전부 asset3d 표에 실제로 있다 (PLAN 9절)', function () {
      var VV3 = DG.villageView3d, A3 = DG.asset3d;
      var map = VV3.scatterKind(), k, missing = [];
      for (k in map) {
        if (Object.prototype.hasOwnProperty.call(map, k) && !A3.REG()[map[k]]) { missing.push(map[k]); }
      }
      var n = Object.keys(map).length;
      return missing.length === 0 && n >= 5 &&
        (n + '개 종류(' + Object.keys(map).join('·') + ') 모두 표에 있음');
    });

    t('village-view3d — init 전에는 세운 것이 없다 (0개)', function () {
      var VV3 = DG.villageView3d;
      return VV3.scatterCount() === 0 && '아직 아무것도 안 지음';
    });

    t('village-view3d — 땅 색은 villageData.TILES 와 완전히 같다 (2D 와 같은 색)', function () {
      var VV3 = DG.villageView3d, VD = DG.villageData;
      var colors = VV3.terrainColors();
      var mismatched = Object.keys(colors).filter(function (k) {
        return colors[k] !== VD.TILES[k].color;
      });
      return mismatched.length === 0 && !colors.floor &&
        Object.keys(colors).length >= 5 &&
        (Object.keys(colors).length + '종(' + Object.keys(colors).join('·') + ') · floor 는 뺌');
    });

    t('village-view3d — init 전에는 색칠한 타일도 0개다', function () {
      var VV3 = DG.villageView3d;
      return VV3.terrainCount('grass') === 0 && VV3.terrainCount('water') === 0 &&
        '아직 아무것도 안 지음';
    });

    /* ── 마을 ─────────────────────────────────────────── */

    t('마을이 만들어졌다 — 땅·사물·주민', function () {
      var raw = V.raw();
      var kinds = {};
      for (var i = 0; i < raw.props.length; i++) { kinds[raw.props[i].kind] = 1; }
      return raw.props.length > 20 && raw.residents.length === 5 &&
        kinds.tree && kinds.rock && kinds.shop && !kinds.school &&
        ('사물 ' + raw.props.length + '개 · 주민 ' + raw.residents.length + '명 · ' +
         Object.keys(kinds).length + '종');
    });

    t('같은 마을은 늘 같은 모습이다 (좌표 해시)', function () {
      var a = V.tileAt(5, 5), b = V.tileAt(5, 5);
      var c = V.tileAt(7, 9), d = V.tileAt(7, 9);
      return a === b && c === d && ('(5,5)=' + a + ' · (7,9)=' + c);
    });

    /* ── PLAN 40절 PHASE 3: 넓은 Forest Map ─────────────────── */

    t('숲 고리 — 마을 안 지형(가로·세로 길)은 그대로다 (회귀 방지)', function () {
      var cx = Math.floor(V.W * 0.5), cy = Math.floor(V.H * 0.5);
      return V.tileAt(cx, 5) === 'path' && V.tileAt(5, cy) === 'path' &&
        ('(' + cx + ',5)=path · (5,' + cy + ')=path 그대로');
    });

    t('숲 고리 — 옛 마을 경계 바로 밖은 이제 물이 아니라 잔디(바이옴 중 하나), 걸을 수 있다', function () {
      var T = V.TILE, tx = V.W, ty = Math.floor(V.H * 0.5);
      var kind = V.tileAt(tx, ty);
      var grassFamily = { grass: 1, grass_meadow: 1, grass_dark: 1, grass_mush: 1, grass_rocky: 1 };
      return !!grassFamily[kind] && V.walkable(tx * T + 20, ty * T + 20) &&
        ('(' + tx + ',' + ty + ')=' + kind + ' · 통행 가능');
    });

    t('숲 고리 — margin 너머는 여전히 세상 끝(물), 무한히는 못 나간다', function () {
      var m = V.forestMargin();
      var far = V.tileAt(V.W + m + 5, Math.floor(V.H * 0.5));
      return far === 'water' && ('margin ' + m + ' 밖 = water');
    });

    t('숲 고리 — buildProps() 가 f 접두 사물을 흩뿌리고, 바이옴 표 밖 kind 는 안 새어나간다', function () {
      V.buildProps();
      var raw = V.raw();
      var allow = { tree: 1, pine: 1, rock: 1, flower: 1,
        deadTree: 1, mossyRock: 1, mushroom: 1, bush: 1, stump: 1, log: 1 };
      var forestCount = 0, bad = null;
      for (var i = 0; i < raw.props.length; i++) {
        var p = raw.props[i];
        if (p.id.charAt(0) !== 'f') { continue; }
        forestCount++;
        if (!allow[p.kind]) { bad = p; break; }
      }
      return forestCount > 0 && !bad &&
        ('숲 사물 ' + forestCount + '개, 전부 바이옴 표 안의 kind');
    });

    t('숲 고리 — 바이옴은 다섯 가지 다 나오고, 좌표가 같으면 늘 같은 바이옴이다', function () {
      var seen = {}, tx, ty, n = 0;
      for (ty = -60; ty < 60; ty += 3) {
        for (tx = -60; tx < 60; tx += 3) { seen[V.biomeAt(tx, ty)] = 1; n++; }
      }
      var a = V.biomeAt(37, -19), b = V.biomeAt(37, -19);
      return Object.keys(seen).length === V.BIOMES.length && a === b &&
        (n + '칸 훑어 바이옴 ' + Object.keys(seen).length + '종 · (37,-19) 재현');
    });

    t('숲 고리 — 나무·바위·꽃은 장식일 뿐 손이 안 닿는다 (채집 대상 아님)', function () {
      V.buildProps();
      var raw = V.raw();
      var f = null, i;
      for (i = 0; i < raw.props.length; i++) {
        if (raw.props[i].id.charAt(0) === 'f' && raw.props[i].kind === 'tree') { f = raw.props[i]; break; }
      }
      if (!f) { return false; }
      raw.player.x = f.x; raw.player.y = f.y;
      var focus = V.focus();
      return (!focus || focus.obj !== f) && '숲 나무는 focus() 에 안 잡힌다';
    });

    t('숲 고리 — 마을 건물 자리는 안 바뀌었다 (중심·건물 위치 회귀 방지)', function () {
      V.buildProps();
      var raw = V.raw();
      var byId = {};
      for (var i = 0; i < raw.props.length; i++) { byId[raw.props[i].id] = raw.props[i]; }
      var cx = Math.floor(V.W * 0.5), cy = Math.floor(V.H * 0.5), T = V.TILE;
      var shop = byId.shop, home = byId.home, museum = byId.museum;
      return shop && home && museum &&
        shop.x === (cx - 3) * T + 20 && shop.y === (cy - 1) * T + 20 &&
        home.x === (cx + 3) * T + 20 && home.y === (cy - 1) * T + 20 &&
        museum.x === (cx - 6) * T + 20 && museum.y === (cy + 1) * T + 20 &&
        '건물 셋 자리 그대로';
    });

    t('물 위로는 걸어갈 수 없다', function () {
      var T = V.TILE, tx, ty, water = null;
      for (ty = 0; ty < V.H && !water; ty++) {
        for (tx = 0; tx < V.W; tx++) {
          if (V.tileAt(tx, ty) === 'water') { water = { tx: tx, ty: ty }; break; }
        }
      }
      if (!water) { return '이 마을엔 물이 없다 (지형 규칙상 있어야 한다)' && false; }
      return !V.walkable(water.tx * T + 20, water.ty * T + 20) &&
        ('(' + water.tx + ',' + water.ty + ') 물 = 통행 불가');
    });

    t('걸으면 사람이 움직인다', function () {
      var raw = V.raw();
      var x0 = raw.player.x, y0 = raw.player.y;
      V.walkTo(x0 + 120, y0);
      for (var i = 0; i < 20; i++) { V.update(0.1); }
      return Math.abs(raw.player.x - x0) > 20 &&
        ('x ' + Math.round(x0) + ' → ' + Math.round(raw.player.x));
    });

    /* ── 채집 ─────────────────────────────────────────── */

    t('채집 — 손이 닿으면 얻고, 그 사물은 오늘 몫을 다한다', function () {
      var raw = V.raw();
      var tree = null, i;
      for (i = 0; i < raw.props.length; i++) {
        if (raw.props[i].kind === 'tree') { tree = raw.props[i]; break; }
      }
      raw.player.x = tree.x; raw.player.y = tree.y;      // 앞에 세운다
      var f = V.focus();
      var r = V.interact();
      var again = V.interact();
      return f && f.obj === tree && r && r.kind === 'gather' &&
        V.spent(tree) && again.kind === 'empty' &&
        (r.text + ' · 두 번째는 ' + again.kind);
    });

    /* ── 낚시 ─────────────────────────────────────────── */

    function findSpot() {
      var raw = V.raw();
      for (var i = 0; i < raw.props.length; i++) {
        if (raw.props[i].kind === 'spot') { return raw.props[i]; }
      }
      return null;
    }
    function standAt(pr) {
      var raw = V.raw();
      raw.player.x = pr.x; raw.player.y = pr.y; raw.player.walking = false;
    }

    t('낚시터는 하루 몫이 없다 — 대신 던지고 기다린다', function () {
      var spot = findSpot();
      if (!spot) { return false; }
      standAt(spot);
      var a = V.interact();
      var fs = V.fishState();
      return a.kind === 'cast' && !V.spent(spot) && fs && fs.state === 'wait' &&
        ('던짐 · ' + a.text);
    });

    t('성급하게 당기면 놓친다', function () {
      var spot = findSpot();
      standAt(spot);
      var before = V.status().bag.length;
      var r = V.interact();                       // 입질 전에 당긴다
      return r.kind === 'miss' && V.fishState() === null &&
        V.status().bag.length === before && ('“' + r.text + '”');
    });

    t('입질에 맞춰 당기면 잡는다', function () {
      var spot = findSpot();

      Math.random = real;
      return { r: out, tree: tree };
    }

    t('꽃 — 곁에 다른 꽃이 있어야 교배로 핀다', function () {

      for (ty = 3; ty < V.H - 3 && !spot; ty++) {

      var keep = s.planted.slice();

      /* 홀로 심은 것 — 교배가 아니다 */
      s.planted = [{ x: spot.tx * T + T * 0.5, y: spot.ty * T + T * 0.5,
                     kind: 'flower', day: s.day - V.PLANT_DAYS, from: 'azalea' }];

      var alone = V.raw().props.filter(function (p) { return p.id === 'pl0'; })[0];

        if (Math.hypot(res[i].x - from[i].x, res[i].y - from[i].y) > 1) { moved++; }
      }
      return far === 0 && moved > 0 &&
        (moved + '/' + res.length + '명이 움직였고 아무도 ' + DG.folk.WANDER + ' 밖으로 안 나갔다');
    });

    t('주민 — 두 사람이 번갈아 말한다', function () {
      DG.folk._reset();
      var res = V.raw().residents;
      var a = res[0], b = res[1];
      var ch = DG.folk._start(a, b);
      var l0 = DG.folk.lineOf(a.id), n0 = DG.folk.lineOf(b.id);
      DG.folk.update(2.5);                             // 한 마디 넘긴다
      var l1 = DG.folk.lineOf(b.id), n1 = DG.folk.lineOf(a.id);
      DG.folk._reset();
      return ch.lines.length >= 3 && l0 && !n0 && l1 && !n1 && l0 !== l1 &&
        ('「' + l0 + '」 → 「' + l1 + '」');
    });

    t('주민 — 대화를 끝까지 들으면 정이 늘고, 자리를 뜨면 안 는다', function () {
      var s = V.state(), raw = V.raw();
      var a = raw.residents[0], b = raw.residents[1];
      var run = function (stay) {
        DG.folk._reset();
        s.overheard = null;
        s.friend[a.id] = 0; s.friend[b.id] = 0;
        DG.folk._start(a, b);
        /* 한 마디가 2.4초, 서너 마디다 — 넉넉히 굴려 대화가 끝나게 한다 */
        for (var k = 0; k < 22; k++) {
          raw.player.x = stay ? a.x : a.x + 4000;
          raw.player.y = a.y;
          DG.folk.update(0.5);
        }
        return V.friendOf(a.id);
      };
      var near = run(true);
      var far = run(false);
      DG.folk._reset();
      raw.player.x = a.x; raw.player.y = a.y;
      return near === 1 && far === 0 &&
        ('곁에서 끝까지 → +' + near + ' · 자리를 뜨면 +' + far);
    });

    /* ── 공사 (terrain.js) ─────────────────────────────
     * 마을은 좌표 해시로 생긴다. 공사는 그 위에 **고친 칸만** 얹는 덮개층이므로,
     * 여기서 못을 박아야 할 것은 둘이다 —
     *   ① 덮개가 tileAt 보다 먼저 읽히는가 (통행·사물까지 따라오는가)
     *   ② 되돌리면 **세이브에서도 지워지는가** (안 그러면 마을이 무거워진다)
     * 뒷 항목이 흔들리지 않게 이 자리는 끝에서 **원래대로 되돌려 놓는다.**
     */

    var TR = DG.terrain;

    /** 그 칸에 사물이나 주민이 서 있나 */
    function tileBusy(tx, ty) {
      var T = V.TILE, raw = V.raw(), i;
      for (i = 0; i < raw.props.length; i++) {
        if (Math.floor(raw.props[i].x / T) === tx &&
            Math.floor(raw.props[i].y / T) === ty) { return true; }
      }
      for (i = 0; i < raw.residents.length; i++) {
        if (Math.floor(raw.residents[i].x / T) === tx &&
            Math.floor(raw.residents[i].y / T) === ty) { return true; }
      }
      return false;
    }

    /** 나란한 빈 풀 칸 둘 — 하나에 서고 하나를 고친다 */
    function findWorkPair() {
      for (var ty = 1; ty < V.H - 1; ty++) {
        for (var tx = 1; tx < V.W - 2; tx++) {
          if (V.tileAt(tx, ty) !== 'grass' || V.tileAt(tx + 1, ty) !== 'grass') { continue; }
          if (tileBusy(tx, ty) || tileBusy(tx + 1, ty)) { continue; }
          return { stand: { tx: tx, ty: ty }, at: { tx: tx + 1, ty: ty } };
        }
      }
      return null;
    }

    var WORK = findWorkPair();
    var keepP = WORK ? { gold: C.save.player.gold, exp: C.save.player.exp,
                         level: C.save.player.level, feat: C.save.player.feat,
                         featTotal: C.save.player.featTotal } : null;
    if (WORK) {
      var T0 = V.TILE, rawW = V.raw();
      rawW.player.x = WORK.stand.tx * T0 + T0 * 0.5;
      rawW.player.y = WORK.stand.ty * T0 + T0 * 0.5;
      rawW.player.walking = false;
      C.save.player.gold = 99999;
    }

    t('공사 — 개토패가 없으면 땅을 못 고친다', function () {
      var s = V.state();
      s.tools.deed = false;
      var no = TR.can(WORK.at.tx, WORK.at.ty, 'path');
      s.tools.deed = true;
      var yes = TR.can(WORK.at.tx, WORK.at.ty, 'path');
      return !no.ok && no.why.indexOf('개토패') >= 0 && yes.ok &&
        ('막힘: ' + no.why + ' → 사면 열린다');
    });

    t('공사 — 흙길을 깔면 그 칸이 흙길이 되고 삯이 빠진다', function () {
      var g0 = C.save.player.gold, cost = TR.costOf('path');
      var r = TR.work(WORK.at.tx, WORK.at.ty, 'path');
      var k = WORK.at.tx + ',' + WORK.at.ty;
      return r.kind === 'build' && V.tileAt(WORK.at.tx, WORK.at.ty) === 'path' &&
        C.save.player.gold === g0 - cost && V.state().terrain[k] === 'path' &&
        TR.worked(WORK.at.tx, WORK.at.ty) &&
        ('(' + k + ') 풀 → 흙길 · 삯 ' + cost);
    });

    t('공사 — 되돌리면 원래 땅으로 돌아가고 세이브에서도 지워진다', function () {
      var k = WORK.at.tx + ',' + WORK.at.ty;
      var was = TR.rawTile(WORK.at.tx, WORK.at.ty);
      var r = TR.work(WORK.at.tx, WORK.at.ty, 'revert');
      var gone = !Object.prototype.hasOwnProperty.call(V.state().terrain, k);
      return r.kind === 'build' && V.tileAt(WORK.at.tx, WORK.at.ty) === was && gone &&
        !TR.worked(WORK.at.tx, WORK.at.ty) &&
        ('덮개를 걷으니 다시 ' + was + ' · 세이브에서도 지워짐');
    });

    t('공사 — 물길은 통행을 막고, 선 자리에는 낼 수 없다', function () {
      var T = V.TILE;
      var self = TR.can(WORK.stand.tx, WORK.stand.ty, 'water');
      var r = TR.work(WORK.at.tx, WORK.at.ty, 'water');
      var blocked = !V.walkable(WORK.at.tx * T + T * 0.5, WORK.at.ty * T + T * 0.5);
      TR.work(WORK.at.tx, WORK.at.ty, 'revert');
      return !self.ok && self.why.indexOf('선 자리') >= 0 &&
        r.kind === 'build' && blocked &&
        ('판 칸은 통행 불가 · 선 자리는 거절: ' + self.why);
    });

    t('공사 — 사물이 선 칸은 고칠 수 없다', function () {
      var T = V.TILE, raw = V.raw();
      raw.props.push({ id: 'blocktest', kind: 'rock',
                       x: WORK.at.tx * T + T * 0.5, y: WORK.at.ty * T + T * 0.5 });
      var no = TR.can(WORK.at.tx, WORK.at.ty, 'path');
      dropProp('blocktest');
      var yes = TR.can(WORK.at.tx, WORK.at.ty, 'path');
      return !no.ok && no.why.indexOf('바위') >= 0 && yes.ok && ('막힘: ' + no.why);
    });

    t('공사 — 손이 닿는 것은 선 칸 둘레 3×3 뿐이다', function () {
      var far = TR.can(WORK.stand.tx + 2, WORK.stand.ty, 'path');
      var sea = TR.can(-1, WORK.stand.ty, 'path');
      var near = TR.around();
      return !far.ok && far.why.indexOf('손이 닿지') >= 0 &&
        !sea.ok && sea.why.indexOf('마을 밖') >= 0 &&
        near.length === 9 && near[4].here === true &&
        ('두 칸 밖 거절 · 마을 밖 거절 · 격자 ' + near.length + '칸');
    });

    t('공사 — 삯이 모자라면 못 한다', function () {
      var g0 = C.save.player.gold;
      C.save.player.gold = 10;
      var no = TR.can(WORK.at.tx, WORK.at.ty, 'sand');
      C.save.player.gold = g0;
      var yes = TR.can(WORK.at.tx, WORK.at.ty, 'sand');
      return !no.ok && no.why.indexOf('삯이 모자') >= 0 && yes.ok && ('막힘: ' + no.why);
    });

    t('공사를 해도 오늘 딴 표시가 다른 사물로 옮겨 가지 않는다', function () {
      /* 사물 id 를 순번으로 지으면 공사로 하나가 생기고 사라질 때 뒤가 전부 밀린다.
         자리로 짓기 때문에 밀리지 않는다 — 이 항목이 그 못이다 */
      var T = V.TILE, s = V.state(), raw = V.raw(), tree = null, i;
      for (i = 0; i < raw.props.length; i++) {
        if (raw.props[i].kind === 'tree') { tree = raw.props[i]; break; }
      }
      var tx = Math.floor(tree.x / T), ty = Math.floor(tree.y / T);
      s.used[tree.id] = s.day;                       // 오늘 몫을 다 냈다고 적어 둔다
      TR.work(WORK.at.tx, WORK.at.ty, 'sand');       // 딴 자리에서 공사 — 사물이 다시 짜인다
      var again = null;
      raw = V.raw();
      for (i = 0; i < raw.props.length; i++) {
        var pr = raw.props[i];
        if (pr.kind === 'tree' && Math.floor(pr.x / T) === tx &&
            Math.floor(pr.y / T) === ty) { again = pr; break; }
      }
      var ok = !!again && again.id === tree.id && V.spent(again);
      TR.work(WORK.at.tx, WORK.at.ty, 'revert');
      return ok && ('id ' + tree.id + ' 그대로 · 오늘 몫도 그대로');
    });

    t('공사 시트 — 격자 아홉 칸과 깔 것 여섯이 그려진다', function () {
      /* 규칙이 아니라 **화면**을 짚는 항목이다. viewBuild 가 터지면 여기서 걸린다 */
      DG.ui.openSheet('build');
      var html = document.getElementById('sheet-body').innerHTML;
      DG.ui.closeSheet();
      var cells = (html.match(/data-act="v-pick"/g) || []).length;
      var picks = (html.match(/data-act="v-build"/g) || []).length;
      return html.indexOf('tgrid') >= 0 && cells === 9 && picks > 0 &&
        ('칸 ' + cells + '개 · 지금 고를 수 있는 것 ' + picks + '가지');
    });

    t('공사 단추는 개토패를 사기 전에는 독에 서지 않는다', function () {
      var s = V.state(), btn = document.querySelector('#dock [data-sheet="build"]');
      s.tools.deed = false;
      DG.ui.renderHud(); DG.ui.openSheet('bag'); DG.ui.closeSheet();
      var hidden = btn.style.display === 'none';
      s.tools.deed = true;
      DG.ui.openSheet('bag'); DG.ui.closeSheet();
      var shown = btn.style.display !== 'none';
      return hidden && shown && '없으면 숨고, 사면 선다';
    });

    t('공사 — 끝나면 마을은 고치기 전 그대로다', function () {
      /* 뒷 항목이 흔들리지 않게 되돌려 놓는다. 덮개가 비면 세이브도 도로 줄어든다 */
      var s = V.state(), left = Object.keys(s.terrain);
      for (var i = 0; i < left.length; i++) {
        var c = left[i].split(',');
        delete s.terrain[left[i]];
        if (c.length !== 2) { continue; }
      }
      V.buildProps(); V.syncPlanted();
      s.tools.deed = false;
      C.save.player.gold = keepP.gold; C.save.player.exp = keepP.exp;
      C.save.player.level = keepP.level; C.save.player.feat = keepP.feat;
      C.save.player.featTotal = keepP.featTotal;
      return TR.count() === 0 && ('고친 칸 ' + TR.count() + ' · 금·공적도 제자리');
    });

    /* ── 가입해서 저장 ─────────────────────────────────── */

    t('세이브는 프로필 아래로 들어간다', function () {
      var A = DG.account;
      return C.SAVE_BASE === 'yeoksa-village/save' &&
        C.SAVE_KEY.indexOf(C.SAVE_BASE + '/') === 0 &&
        A._store === C.SAVE_BASE + '/accounts' &&
        ('기준 ' + C.SAVE_BASE + ' · 지금 ' + C.SAVE_KEY);
    });

    t('가입 — 이름을 넣으면 프로필이 만들어지고 그 키로 갈아탄다', function () {
      var A = DG.account;
      localStorage.removeItem(A._store);
      var acc = A.create('진단이', false);
      var key = A.keyOf(acc.id);
      C.setSaveKey(key);
      C.save.player.gold = 4242;
      C.persist();
      var raw = localStorage.getItem(key);
      localStorage.removeItem(key);
      /* 프로필 id 는 시각 기반이라 실행마다 다르다 — 결과 문구에는 넣지 않는다
         (넣으면 진단 출력이 매번 달라져 "무엇이 바뀌었나" 를 눈으로 못 쫓는다) */
      return acc.name === '진단이' && A.current().id === acc.id &&
        key.indexOf(C.SAVE_BASE + '/') === 0 &&
        raw && JSON.parse(raw).player.gold === 4242 &&
        (acc.name + ' · 키는 ' + C.SAVE_BASE + '/<프로필> 아래');
    });

    t('가입 — 프로필마다 진행이 갈린다', function () {
      var A = DG.account;
      localStorage.removeItem(A._store);
      var a = A.create('갑', false), b = A.create('을', false);
      C.setSaveKey(A.keyOf(a.id));
      C.save.player.gold = 100; C.persist();
      C.setSaveKey(A.keyOf(b.id));
      C.save.player.gold = 999; C.persist();
      var ga = JSON.parse(localStorage.getItem(A.keyOf(a.id))).player.gold;
      var gb = JSON.parse(localStorage.getItem(A.keyOf(b.id))).player.gold;
      localStorage.removeItem(A.keyOf(a.id));
      localStorage.removeItem(A.keyOf(b.id));
      return ga === 100 && gb === 999 && A.list().length === 2 &&
        ('갑 ' + ga + ' · 을 ' + gb + ' (서로 안 섞인다)');
    });

    t('가입 — 옛 세이브를 첫 프로필로 이어받는다', function () {
      var A = DG.account;
      localStorage.removeItem(A._store);
      localStorage.setItem(A._legacy, JSON.stringify({ v: 1, player: { level: 7, gold: 777 } }));
      var acc = A.create('이어받기', true);
      var moved = JSON.parse(localStorage.getItem(A.keyOf(acc.id)));
      localStorage.removeItem(A._legacy);
      localStorage.removeItem(A.keyOf(acc.id));
      return A.hasLegacy() === false && moved && moved.player.gold === 777 &&
        ('Lv.' + moved.player.level + ' · 금 ' + moved.player.gold + ' 이 옮겨졌다');
    });

    t('가입 — 프로필을 지우면 그 세이브도 사라진다', function () {
      var A = DG.account;
      localStorage.removeItem(A._store);
      var a = A.create('지울사람', false);
      C.setSaveKey(A.keyOf(a.id));
      C.persist();
      var had = !!localStorage.getItem(A.keyOf(a.id));
      A.remove(a.id);
      var gone = !localStorage.getItem(A.keyOf(a.id));
      return had && gone && A.list().length === 0 && '프로필·세이브 함께 삭제';
    });

    t('가입 — 진단에서는 가입 화면을 띄우지 않는다', function () {
      /* DG_NO_ACCOUNT 가 켜져 있으면 고정 키로 바로 시작한다 (안 그러면 게임이 안 켜진다) */
      return window.DG_NO_ACCOUNT === true && !document.getElementById('acc-host') &&
        '진단 우회 동작';
    });

    t('진단의 무작위는 씨앗으로 고정된다', function () {
      /* 같은 씨앗이면 같은 수열 — 이 항목이 깨지면 위 항목들의 수치도 흔들린다 */
      return window.DG_SEED === 20260824 &&
        Math.random() >= 0 && Math.random() < 1 &&
        ('씨앗 ' + window.DG_SEED);
    });

    t('런타임 에러 없음', function () {
      return errors.length === 0 || ('에러 ' + errors.length + '건: ' + errors.join(' | ')) === '';
    });

    var failCount = out.filter(function (s) { return s.indexOf('FAIL') >= 0; }).length;
    document.getElementById('report').innerHTML =
      '<h3>사가의숲 자가진단 — ' + (out.length - failCount) + '/' + out.length + ' 통과</h3>' +
      out.join('<br>') +
      (errors.length ? '<br><br><b class="fail">런타임 에러</b><br>' + errors.join('<br>') : '');
    document.title = 'RESULT ' + (out.length - failCount) + '/' + out.length;
    localStorage.removeItem(C.SAVE_KEY);
  }, 500);
})();
</script>
</body>
</html>
