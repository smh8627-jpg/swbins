  #report { padding: 16px; font-family: Consolas, monospace; font-size: 13px; line-height: 1.8;

</aside>

<div id="report">진단 중…</div>

<script>
window.DG_NO_DRAW = true; window.DG_NO_ACCOUNT = true;
/* 어드민의 균형 손잡이를 읽지 않는다 — 손잡이를 잡아 둔 기기에서
   판정이 흔들리면 안 된다 (씨앗을 고정한 것과 같은 이유다) */
window.DG_NO_TUNE = true;

/* 무작위 고정 — 진단이 굴릴 때마다 달라지면 판정이 흔들린다.
   게임 스크립트보다 **먼저** 갈아 둬야 부트에서 쓰는 난수까지 잡힌다.
   (실제 플레이는 그대로다 — 이 파일 안에서만 바꾼다)
   mulberry32: 짧고 분포가 고르며 같은 씨앗이면 같은 수열이 나온다. */
(function (seed) {
  var s = seed >>> 0;
  Math.random = function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  window.DG_SEED = seed;
})(20260824);
</script>

<script src="js/data-enemy.js"></script>

<script src="js/side-view.js"></script>
<script src="js/gear.js"></script>
<script src="js/job.js"></script>
<script src="js/quest.js"></script>
<script src="js/sfx.js"></script>
<script src="js/net.js"></script>

<script>
(function () {
  var out = [], errors = [];
  window.addEventListener('error', function (e) { errors.push(e.message); });

  function t(name, fn) {
    try {
      var r = fn();
      out.push((r ? '<span class="pass">PASS</span> ' : '<span class="fail">FAIL</span> ') +
        name + (typeof r === 'string' ? ' — ' + r : ''));
      return !!r;
    } catch (e) {
      out.push('<span class="fail">FAIL</span> ' + name + ' — 예외: ' + e.message);
      return false;
    }
  }

  setTimeout(function () {
    var C = DG.core, S = DG.side, SD = DG.sideData, AU = DG.auto;

    t('다른 게임의 모듈은 실려 있지 않다', function () {
      var gone = ['world', 'encounter', 'dungeon', 'village', 'item'];
      var leaked = gone.filter(function (k) { return !!DG[k]; });
      return leaked.length === 0 && '지도·조우·던전·마을·장비 없음';
    });

    t('데이터는 그대로 물려받았다', function () {
      return DG.data.heroes.length === 70 &&
        DG.enemyData.enemies.length > 5 &&
        ('인물 ' + DG.data.heroes.length +          ' · 적 ' + DG.enemyData.enemies.length);
    });

    t('시작하면 싸울 몸(앞에 세운 인물)이 있다', function () {
      return core_party_ok() && ('앞에 ' + DG.data.find(C.save.party[0]).name);
    });
    function core_party_ok() { return C.save.party.length === 1; }

    /* ── 사냥터 ───────────────────────────────────────── */

    t('사냥터는 레벨로 열린다', function () {
      C.save.player.level = 1;
      var a = S.unlocked('field'), b = S.unlocked('forest');
      C.save.player.level = 6;
      var c = S.unlocked('forest');
      C.save.player.level = 1;
      return a && !b && c && '들판 열림 · 숲은 Lv.5 부터';
    });

    t('못 열린 사냥터에는 들어가지 못한다', function () {
      var ok = S.enter('cave');
      return ok === false && !S.active() && '거절됨';
    });

    t('진입 — 발판·적·체력이 준비된다 (보스가 있으면 한 마리 더)', function () {
      var ok = S.enter('field');
      var st = S.status();
      var want = st.stage.spawn + (st.boss ? 1 : 0);
      return ok && st.active && st.hpMax > 0 && st.enemies === want &&
        st.stage.plats.length >= 3 &&
        ('체력 ' + st.hpMax + ' · 적 ' + st.enemies + ' · 발판 ' + st.stage.plats.length +
         (st.boss ? ' · 보스 ' + st.boss.name : ''));
    });

    t('중력 — 발판에서 떨어지면 바닥에 선다', function () {
      var run = S.raw(), p = run.player;
      p.y = 100; p.vy = 0; p.onGround = false;
      for (var i = 0; i < 60; i++) { S.update(0.05); }
      return p.onGround && Math.abs((p.y + S.P_H) - run.stage.floor) < 2 &&
        ('바닥 y=' + Math.round(p.y + S.P_H));
    });

    t('점프 — 땅에서만 뛴다', function () {
      var run = S.raw(), p = run.player;
      p.onGround = true;
      var a = S.jump();
      var b = S.jump();          // 공중에서는 안 된다
      return a === true && b === false && ('속도 ' + Math.round(p.vy));
    });

    t('발판은 위에서만 밟힌다', function () {
      var run = S.raw(), p = run.player;
      var pl = run.stage.plats[0];
      p.x = pl[0] + 20;
      p.y = pl[1] - S.P_H - 30; p.vy = 200; p.onGround = false;
      for (var i = 0; i < 12; i++) { S.update(0.03); }
      var landed = p.onGround && Math.abs((p.y + S.P_H) - pl[1]) < 3;
      /* 아래에서 위로 지날 때는 통과해야 한다 */
      p.y = pl[1] + 40; p.vy = -400; p.onGround = false;
      var before = p.y;
      for (i = 0; i < 6; i++) { S.update(0.03); }
      var passed = p.y < before;
      return landed && passed && '착지 O · 아래에서 통과 O';
    });

    /* ── 줄과 문 (원작의 세로 이동) ─────────────────────
       항목은 **자기가 쓸 상태를 스스로 만들고 남긴 것은 스스로 치운다.**
       줄을 타는 동안 적에게 맞아 죽으면 판이 끝나 뒤 항목이 줄줄이 넘어진다 —
       그래서 무적(invuln)을 걸어 두고 끝에서 되돌린다. */

    function calm(run) {                     // 판정에 상관없는 축은 붙들어 둔다
      run.hp = run.hpMax;
      run.player.invuln = 999;
    }
    function restInput() {
      S.setInput('up', false); S.setInput('down', false);
      S.setInput('left', false); S.setInput('right', false);
      S.setInput('jump', false);
    }

    t('사냥터마다 줄과 문이 놓여 있다', function () {
      var bad = [], rn = [], gn = [];
      for (var i = 0; i < SD.STAGES.length; i++) {
        var s = SD.STAGES[i];
        rn.push((s.ropes || []).length);
        gn.push((s.portals || []).length);
        if (!s.ropes || s.ropes.length < s.plats.length) { bad.push(s.key + ' 줄'); }
        if (!s.portals || !s.portals.length) { bad.push(s.key + ' 문'); }
      }
      return bad.length === 0 && ('줄 ' + rn.join('·') + ' · 문 ' + gn.join('·'));
    });

    t('↑ — 줄을 잡고 오르면 발판 위에 올라선다', function () {
      var run = S.raw(), p = run.player, stg = run.stage;
      var r = stg.ropes[0];
      calm(run);
      p.climb = null; p.x = r[0] - S.P_W / 2; p.y = stg.floor - S.P_H;
      p.vy = 0; p.onGround = true;
      S.setInput('up', true);
      var grabbed = !!p.climb;
      for (var i = 0; i < 200 && p.climb; i++) { S.update(0.03); }
      restInput();
      var landed = p.onGround && Math.abs((p.y + S.P_H) - r[1]) < 2;
      p.invuln = 0;
      return grabbed && landed && ('바닥 ' + stg.floor + ' → 발판 ' + r[1]);
    });

    t('줄에 매달린 동안은 중력도 좌우 이동도 없다', function () {
      var run = S.raw(), p = run.player, stg = run.stage;
      var r = stg.ropes[0];
      calm(run);
      p.climb = null; p.x = r[0] - S.P_W / 2; p.y = stg.floor - S.P_H - 60;
      p.vy = 0; p.onGround = false;
      S.setInput('up', true);
      var y0 = p.y, x0 = p.x;
      S.setInput('up', false);               // 잡기만 하고 손은 멈춘다
      var held = !!p.climb;
      S.setInput('left', true);
      for (var i = 0; i < 20; i++) { S.update(0.03); }
      restInput();
      var still = Math.abs(p.y - y0) < 0.5 && Math.abs(p.x - x0) < 0.5;
      var out = '매달림 ' + (held ? 'O' : 'X') + ' · 20프레임 뒤 제자리 ' + (still ? 'O' : 'X');
      p.climb = null; p.invuln = 0;
      return held && still && out;
    });

    t('줄 위에서 점프하면 손을 떼고 튄다', function () {
      var run = S.raw(), p = run.player, stg = run.stage;
      var r = stg.ropes[0];
      calm(run);
      p.climb = null; p.x = r[0] - S.P_W / 2; p.y = stg.floor - S.P_H - 60;
      p.vy = 0; p.onGround = false;
      S.setInput('up', true); S.setInput('up', false);
      var held = !!p.climb;
      S.setInput('left', true);                 // 방향키와 함께 눌러야 그쪽으로 튄다
      S.jump();
      var freed = !p.climb && p.vy < 0 && p.facing === -1;
      var vy = Math.round(p.vy);
      /* 방향키 없이 누르면 그 자리에서 손만 뗀다 — 원작도 그렇다 */
      S.setInput('left', false);
      p.y = stg.floor - S.P_H - 60; p.vy = 0; p.onGround = false;
      S.setInput('up', true); S.setInput('up', false);
      var held2 = !!p.climb;
      S.jump();
      var dropped = !p.climb && p.vy >= 0;
      restInput();
      p.climb = null; p.vy = 0; p.invuln = 0;
      return held && freed && held2 && dropped &&
        ('← 와 함께면 속도 ' + vy + ' · 방향키 없이면 그대로 떨어짐');
    });

    t('↓ + 점프 — 밟고 선 발판을 빠져나간다 (바닥에서는 안 된다)', function () {
      var run = S.raw(), p = run.player, stg = run.stage;
      var pl = stg.plats[0];
      calm(run);
      p.climb = null; p.x = pl[0] + 40; p.y = pl[1] - S.P_H;
      p.vy = 0; p.onGround = true;
      S.setInput('down', true);
      S.setInput('jump', true);
      for (var i = 0; i < 14; i++) { S.update(0.03); }
      var fellThrough = p.y + S.P_H > pl[1] + 10;
      /* 바닥에서는 빠져나갈 곳이 없다 */
      p.y = stg.floor - S.P_H; p.vy = 0; p.onGround = true;
      var atFloor = S.dropThrough() === false;
      restInput();
      p.invuln = 0;
      return fellThrough && atFloor &&
        ('발판 ' + pl[1] + ' → 발밑 ' + Math.round(p.y + S.P_H) + ' · 바닥에서는 거절');
    });

    t('문 — ↑ 로 옆 사냥터로 넘어가고 몸과 벌이는 이어진다', function () {
      var run = S.raw(), p = run.player;
      var lv0 = C.save.player.level;
      C.save.player.level = 6;                  // 숲이 열린다
      calm(run);
      run.gold = 777; run.kills = 5; run.hp = Math.round(run.hpMax * 0.6);
      var hp0 = run.hp, from = run.stage.key;
      var gate = run.stage.portals[0];
      p.climb = null; p.x = gate[0] - S.P_W / 2; p.y = run.stage.floor - S.P_H;
      p.vy = 0; p.onGround = true;
      S.setInput('up', true);
      restInput();
      var moved = S.raw().stage.key === 'forest';
      var kept = S.raw().gold === 777 && S.raw().kills === 5 && S.raw().hp === hp0;
      var placed = S.raw().player.x < 300;      // 오른쪽 문으로 나갔으니 왼쪽에서 나온다
      S.travel('field');                        // 되돌린다 (숲에도 들판으로 가는 문이 있다)
      C.save.player.level = lv0;
      S.raw().player.invuln = 0;
      return moved && kept && placed &&
        (from + ' → 오림 숲 · 금 777·5마리·체력 ' + hp0 + ' 그대로');
    });

    t('못 열린 사냥터의 문은 거절한다', function () {
      var lv0 = C.save.player.level;
      C.save.player.level = 1;
      var run = S.raw();
      var before = run.stage.key;
      var ok = S.travel('cave');
      C.save.player.level = lv0;
      return ok === false && S.raw().stage.key === before && '굴혈 거절됨';
    });

    t('공격 — 앞에 있는 적만 맞는다', function () {
      var run = S.raw(), p = run.player;
      var e = run.enemies[0];
      e.x = p.x + 40; e.y = p.y; e.hp = e.hpMax = 9999;
      p.facing = 1;
      run.player.cds = [0, 0, 0, 0];
      var hit = S.castSkill(0);
      var damaged = e.hp < 9999;
      /* 뒤로 돌면 안 맞는다 */
      e.hp = 9999; p.facing = -1; run.player.cds = [0, 0, 0, 0];
      S.castSkill(0);
      var behind = e.hp === 9999;
      return hit && damaged && behind && '앞 O · 뒤 X';
    });

    t('스킬은 기력을 쓰고 쿨다운이 걸린다', function () {
      var run = S.raw();
      run.mp = 100;
      run.player.cds = [0, 0, 0, 0];
      var cast = S.castSkill(1);
      var st = S.status();
      return cast && !S.castSkill(1) && st.mp < 100 && st.skills[1].cd > 0 &&
        ('기력 ' + st.mp + ' · 쿨 ' + st.skills[1].cd.toFixed(1) + 's');
    });

    t('잡으면 경험치·금이 들어오고 다음 적이 나온다', function () {
      var run = S.raw();
      var n0 = run.enemies.length, g0 = run.gold, xp0 = C.save.player.exp;
      var e = run.enemies[0];
      var p = run.player;
      e.x = p.x + 40; e.y = p.y; e.hp = 1;
      p.facing = 1; run.player.cds = [0, 0, 0, 0];
      S.castSkill(0);
      return run.kills >= 1 && run.gold > g0 && run.enemies.length === n0 &&
        (C.save.player.exp !== xp0 || C.save.player.level > 1) &&
        ('잡음 ' + run.kills + ' · 금 ' + run.gold + ' · 적 수 유지 ' + run.enemies.length);
    });

    t('탕약 — 체력을 채우고 개수가 줄어든다', function () {
      var run = S.raw(), s = S.state();
      run.hp = Math.round(run.hpMax * 0.3);
      s.potions = 2;
      var ok = S.drink();
      return ok && s.potions === 1 && run.hp > run.hpMax * 0.3 &&
        ('체력 ' + run.hp + '/' + run.hpMax + ' · 남은 탕약 ' + s.potions);
    });

    t('맞으면 체력이 줄고 잠깐 무적이 된다', function () {
      var run = S.raw(), p = run.player;
      var e = run.enemies[0];
      e.x = p.x; e.y = p.y; e.cd = 0; e.dmg = 5;
      var hp0 = run.hp;
      S.update(0.03);
      var hurt = run.hp < hp0;
      var hp1 = run.hp;
      e.cd = 0;
      S.update(0.03);                    // 무적 동안에는 더 안 깎인다
      return hurt && run.hp === hp1 && ('체력 ' + hp0 + ' → ' + hp1 + ' (무적 유지)');
    });

    /* ── 멀리서 쏘는 적 ─────────────────────────────────── */

    t('쏘는 적은 든 무기로 갈린다 (적 데이터에 칸을 만들지 않는다)', function () {
      var ed = DG.enemyData, shooters = [], melee = 0, i;
      for (i = 0; i < ed.enemies.length; i++) {
        if (SD.rangedOf(ed.enemies[i])) { shooters.push(ed.enemies[i].name); } else { melee++; }
      }
      var bossShooters = 0;
      for (i = 0; i < ed.bosses.length; i++) { if (SD.rangedOf(ed.bosses[i])) { bossShooters++; } }
      /* 던전 게임과 나눠 든 파일이라 ranged 같은 칸이 새로 생기면 안 된다 */
      var clean = !('ranged' in ed.enemies[0]);
      return shooters.length >= 3 && melee > shooters.length && bossShooters === 0 && clean &&
        ('쏘는 적 ' + shooters.length + '(' + shooters[0] + ' 등) · 붙는 적 ' + melee +
         ' · 적 데이터는 그대로');
    });

    t('쏘는 적은 사거리에서 멈춰 화살을 날린다', function () {
      var run = S.raw(), p = run.player, stg = run.stage;
      var e = run.enemies[0];
      var old = { ref: e.ref, ranged: e.ranged, x: e.x, y: e.y, shotCd: e.shotCd, dir: e.dir };
      var bow = null, i;
      for (i = 0; i < DG.enemyData.enemies.length; i++) {
        if (SD.rangedOf(DG.enemyData.enemies[i])) { bow = DG.enemyData.enemies[i]; break; }
      }
      e.ref = bow; e.ranged = SD.rangedOf(bow); e.shotCd = 0.05;
      calm(run);                                 // 화살에 맞아 죽지 않게
      p.climb = null; p.x = 400; p.y = stg.floor - S.P_H; p.vy = 0; p.onGround = true;
      e.x = p.x + 240; e.y = stg.floor - e.h;
      run.eshots = [];
      var x0 = e.x, shot = false;
      for (i = 0; i < 20; i++) {
        S.update(0.03);
        if (run.eshots.length) { shot = true; }
      }
      var held = Math.abs(e.x - x0) < 8;          // 사거리 안이면 다가오지 않는다
      var out = '쏨 ' + (shot ? 'O' : 'X') + ' · 제자리 ' + (held ? 'O' : 'X') +
        ' (' + bow.name + ')';
      run.eshots = [];
      e.ref = old.ref; e.ranged = old.ranged; e.x = old.x; e.y = old.y;
      e.shotCd = old.shotCd; e.dir = old.dir;

    t('가입 — 프로필마다 진행이 갈린다', function () {
      var A = DG.account;
      localStorage.removeItem(A._store);
      var a = A.create('갑', false), b = A.create('을', false);
      C.setSaveKey(A.keyOf(a.id));
      C.save.player.gold = 100; C.persist();
      C.setSaveKey(A.keyOf(b.id));
      C.save.player.gold = 999; C.persist();
      var ga = JSON.parse(localStorage.getItem(A.keyOf(a.id))).player.gold;
      var gb = JSON.parse(localStorage.getItem(A.keyOf(b.id))).player.gold;
      localStorage.removeItem(A.keyOf(a.id));
      localStorage.removeItem(A.keyOf(b.id));
      return ga === 100 && gb === 999 && A.list().length === 2 &&
        ('갑 ' + ga + ' · 을 ' + gb + ' (서로 안 섞인다)');
    });

    t('가입 — 옛 세이브를 첫 프로필로 이어받는다', function () {
      var A = DG.account;
      localStorage.removeItem(A._store);
      localStorage.setItem(A._legacy, JSON.stringify({ v: 1, player: { level: 7, gold: 777 } }));
      var acc = A.create('이어받기', true);
      var moved = JSON.parse(localStorage.getItem(A.keyOf(acc.id)));
      localStorage.removeItem(A._legacy);
      localStorage.removeItem(A.keyOf(acc.id));
      return A.hasLegacy() === false && moved && moved.player.gold === 777 &&
        ('Lv.' + moved.player.level + ' · 금 ' + moved.player.gold + ' 이 옮겨졌다');
    });

    t('가입 — 프로필을 지우면 그 세이브도 사라진다', function () {
      var A = DG.account;
      localStorage.removeItem(A._store);
      var a = A.create('지울사람', false);
      C.setSaveKey(A.keyOf(a.id));
      C.persist();
      var had = !!localStorage.getItem(A.keyOf(a.id));
      A.remove(a.id);
      var gone = !localStorage.getItem(A.keyOf(a.id));
      return had && gone && A.list().length === 0 && '프로필·세이브 함께 삭제';
    });

    t('가입 — 진단에서는 가입 화면을 띄우지 않는다', function () {
      /* DG_NO_ACCOUNT 가 켜져 있으면 고정 키로 바로 시작한다 (안 그러면 게임이 안 켜진다) */
      return window.DG_NO_ACCOUNT === true && !document.getElementById('acc-host') &&
        '진단 우회 동작';
    });

    /* ── 3차 전직 (2026-08-26) ──────────────────────────── */

    t('갈래 넷이 저마다 3차까지 이어진다', function () {
      /* 갈래를 늘리지 않고 **한 단 더 높였다** — 넷을 다섯으로 늘리면 인물 능력치와
         무기가 따라가야 한다. from 사슬이 한 군데라도 끊기면 그 갈래가 막힌다. */
      var ends = JD.JOBS.filter(function (j) { return j.tier === 3; });
      var ok = ends.length === 4;
      ends.forEach(function (j) {
        var chain = [], k = j;
        while (k) { chain.unshift(k.key); k = k.from ? JD.job(k.from) : null; }
        if (chain.length !== 4 || chain[0] !== 'none') { ok = false; }
      });
      return ok && (ends.map(function (j) { return j.name; }).join(' · '));
    });

    t('3차는 Lv.45 이고 아랫자리 무예 8 을 요구한다', function () {
      /* 자리가 높을수록 문턱이 무거워진다 — 2차는 5, 3차는 8. */
      unlearn();
      C.save.player.level = 44;
      J.join('warrior');
      var i;
      for (i = 0; i < 5; i++) { J.raise('w_cut'); }  // 2차의 문턱은 5
      J.join('general');
      var tooLow = J.canJoin('marshal');             // 레벨이 모자란다
      C.save.player.level = 46;
      var noSkill = J.canJoin('marshal');            // 무예가 모자란다
      for (i = 0; i < 8; i++) { J.raise('g_smash'); }
      var okNow = J.canJoin('marshal');
      var joined = J.join('marshal');
      var out = 'Lv.44 "' + tooLow + '" · 무예 0 "' + noSkill + '" · 8 익힌 뒤 ' + (joined ? '오름' : '못 오름');
      unlearn();
      return !!tooLow && !!noSkill && okNow === null && joined &&
        noSkill.indexOf('8') >= 0 && out;
    });

    t('3차 무예는 앞 단계를 밟아야 열린다', function () {
      unlearn();
      C.save.player.level = 60;
      J.join('warrior');
      var i;
      for (i = 0; i < 5; i++) { J.raise('w_cut'); }
      J.join('general');
      for (i = 0; i < 8; i++) { J.raise('g_smash'); }
      J.join('marshal');
      var locked = J.canRaise('n_heaven');            // 패왕격 8 이라 이미 열려 있다
      var lockedToo = J.canRaise('n_banner');         // 철벽 0 — 아직 못 연다
      for (i = 0; i < 5; i++) { J.raise('w_iron'); }
      for (i = 0; i < 5; i++) { J.raise('g_wall'); }
      var openNow = J.canRaise('n_banner');
      var out = '패왕격 8 → 천붕격 ' + (locked ? '잠김' : '열림') +
        ' · 철벽 0 → 대장기 ' + (lockedToo ? '잠김' : '열림') +
        ' · 철벽 5 → ' + (openNow ? '잠김' : '열림');
      unlearn();
      return locked === null && !!lockedToo && openNow === null && out;
    });

    t('조작 띠는 윗자리 무예부터 놓는다', function () {
      /* 3차까지 열리면 한 갈래의 무예가 열둘이다. 표 순서대로 아래에서부터 채우면
         **새로 얻은 무예가 영영 자리를 못 잡는다** — 1차 넷이 앞을 다 먹는다. */
      unlearn();
      C.save.player.level = 60;
      J.join('warrior');
      var i, k;
      for (i = 0; i < 5; i++) { J.raise('w_cut'); }
      J.join('general');
      for (i = 0; i < 8; i++) { J.raise('g_smash'); }
      J.join('marshal');
      ['w_whirl', 'w_rush', 'w_iron', 'g_roar', 'g_wall'].forEach(function (key) {
        for (k = 0; k < 5; k++) { J.raise(key); }
      });
      ['n_heaven', 'n_quake', 'n_charge', 'n_banner'].forEach(function (key) { J.raise(key); });
      var bar = J.bar();
      var tiers = bar.map(function (sk) { return JD.job(sk.job).tier; });
      var top = tiers.filter(function (n) { return n === 3; }).length;
      var out = '띠 ' + bar.length + '칸 · 3차 ' + top + '개 (' +
        bar.map(function (sk) { return sk.name; }).join(' ') + ')';
      unlearn();
      return bar.length === 8 && top === 4 && tiers[0] === 3 && out;
    });

    t('무예 마흔여덟은 side.js 가 아는 효과 아홉만 쓴다', function () {
      /* 데이터는 **무엇을 할지만** 적고 어떻게 하는지는 side.js 에만 있다.
         새 효과를 만들면 그 규칙을 두 곳에 적게 된다 — 3차를 넣으며 하나도 안 늘렸다. */
      var KNOWN = ['melee', 'aoe', 'bolt', 'arrow', 'volley', 'dash', 'rain', 'buff', 'heal'];
      var bad = JD.SKILLS.filter(function (sk) { return KNOWN.indexOf(sk.effect) < 0; });
      return JD.SKILLS.length === 48 && bad.length === 0 &&
        ('무예 ' + JD.SKILLS.length + ' · 효과 ' + KNOWN.length + ' · 모르는 것 0');
    });

    t('3차 무예도 실제로 적을 친다', function () {
      unlearn();
      if (S.active()) { S.leave(); }
      C.save.player.level = 60;
      J.join('warrior');
      var i;
      for (i = 0; i < 5; i++) { J.raise('w_cut'); }
      J.join('general');
      for (i = 0; i < 8; i++) { J.raise('g_smash'); }
      J.join('marshal');
      for (i = 0; i < 3; i++) { J.raise('n_heaven'); }
      S.enter('field');
      var run = S.raw(), p = run.player;
      calm(run);
      p.x = 200; p.y = run.stage.floor - S.P_H; p.onGround = true; p.facing = 1;
      run.enemies = [{ ref: { name: '허수아비', kind: 'human', look: {} },
                       x: p.x + 40, y: p.y, w: 34, h: 34,
                       hp: 99999, hpMax: 99999, dmg: 0, dir: -1, homeY: p.y + 34,
                       spd: 0, phase: 0, hurt: 0, cd: 99 }];
      run.mp = run.mpMax = 999;
      var bar = J.bar();
      var at = -1;
      for (i = 0; i < bar.length; i++) { if (bar[i].key === 'n_heaven') { at = i; } }
      var before = run.enemies[0].hp;
      if (at >= 0) { S.castSkill(at); }
      var dealt = before - run.enemies[0].hp;
      S.leave();
      unlearn();
      return at >= 0 && dealt > 0 && ('천붕격 ' + at + '번 자리 · 피해 ' + dealt);
    });

    /* ── 소리 ───────────────────────────────────────────── */

    t('소리는 요청을 다 적는다 — 꺼져 있어도 남는다', function () {
      /* 판정 층과 소리 층을 가른 것이다(side.js 의 fx 와 같다).
         그래야 이 진단이 "이때 이 소리를 냈어야 한다" 를 검사할 수 있다 —
         진단은 아무것도 누르지 않으므로 브라우저가 소리를 늘 잠가 둔다. */
      var X = DG.sfx;
      X._clear();
      var rang = X.play('levelup');
      return X.ready() === false && rang === false &&
        X._tail(3).join(',') === 'levelup' && '잠긴 채로도 적힌다';
    });

    t('없는 소리를 불러도 부르는 쪽이 안 죽는다', function () {
      var X = DG.sfx;
      X._clear();
      var r = X.play('그런소리없음');
      return r === false && X._tail(2).join(',') === '그런소리없음' && '조용히 흘린다';
    });

    t('적을 잡으면 타격과 죽음이 소리로 남는다', function () {
      var X = DG.sfx;
      C.save.job = 'none';                          // 연참(0번 자리)이 놓이게
      S.enter('field');
      var run = S.raw();
      var p0 = run.player;
      run.enemies.length = 0;
      /* 코앞에 한 대면 죽는 적을 하나 세운다 — 소리 둘이 이 순서로 나야 한다 */
      run.enemies.push({ ref: { name: '허수아비', kind: 'human', look: {} },
                         x: p0.x + 30, y: p0.y, w: 34, h: 34,
                         hp: 1, hpMax: 1, dmg: 1, dir: -1, homeY: p0.y + 34,
                         spd: 0, phase: 0, hurt: 0, cd: 0 });
      p0.facing = 1;
      X._clear();
      S.castSkill(0);
      var tail = X._tail(8).join(',');
      S.leave();
      return tail.indexOf('hit') >= 0 && tail.indexOf('kill') >= 0 && tail;
    });

    t('무예는 스물여덟이지만 소리는 넷으로 묶인다', function () {
      /* 하나씩 두면 서로 구별되지 않는다. 귀가 가리는 것은 넷뿐이다 —
         가까이 벤다 · 멀리 쏜다 · 몸을 두른다 · 낫는다. */
      var X = DG.sfx;
      var got = {};
      ['melee', 'aoe', 'dash', 'bolt', 'arrow', 'volley', 'rain', 'buff', 'heal']
        .forEach(function (eff) { got[X.skillCue(eff)] = true; });
      var keys = Object.keys(got).sort().join(',');
      return keys === 'buff,heal,shot,skill' && keys;
    });

    t('주문서는 성패가 서로 다른 소리를 낸다', function () {
      /* 원작에서 화면을 보기 전에 소리로 성패를 안다 — 이 판이 소리를 들인 까닭의 절반이다 */
      var X = DG.sfx;
      C.reset();
      C.save.player.level = 20;
      var it = G.make('sword1');
      G.state().inv.push(it);
      G.equip(it.uid);
      G.addScroll('atk100', 1);
      X._clear();
      G.apply(it.uid, 'atk100');                    // 100% — 반드시 붙는다
      var okTail = X._tail(4).join(',');
      G.addScroll('atk10', 1);
      var tries = 0, noTail = '';
      while (tries < 60 && noTail.indexOf('scrollno') < 0) {
        G.addScroll('atk10', 1);
        it.left = 5;                                // 업횟을 도로 채워 계속 굴린다
        X._clear();
        G.apply(it.uid, 'atk10');
        noTail = X._tail(4).join(',');
        tries++;
      }
      return okTail.indexOf('scrollok') >= 0 && noTail.indexOf('scrollno') >= 0 &&
        ('성공 ' + okTail + ' · 실패 ' + noTail);
    });

    t('소리를 끄면 요청은 남되 아무것도 울지 않는다', function () {
      var X = DG.sfx;
      var had = X.enabled();
      X.setEnabled(false);
      X._clear();
      var rang = X.play('gold');
      var seen = X._tail(2).join(',');
      X.setEnabled(had);
      return rang === false && seen === 'gold' && C.save.settings.sound === had &&
        ('꺼짐 → 적힘(' + seen + ') · 울지 않음');
    });

    /* ── 어드민 손잡이 ──────────────────────────────────── */

    t('자가진단은 어드민 손잡이를 읽지도 쓰지도 않는다', function () {
      /* 손잡이를 잡아 둔 기기에서 판정이 흔들리면 안 된다 — 씨앗을 고정한 것과 같은 이유다.
         이 항목이 그 못이다 (`DG_NO_TUNE`). */
      var had = null;
      try { had = localStorage.getItem(C.TUNE_KEY); } catch (e) { /* 무시 */ }
      localStorage.setItem(C.TUNE_KEY, JSON.stringify({ 'side.jump': 9999 }));
      var seen = C.tuned('side.jump', 760);          // 저장된 것을 안 읽는다
      C.setTune('_probe', 7);                        // 메모리엔 들지만
      var wrote = {};
      try { wrote = JSON.parse(localStorage.getItem(C.TUNE_KEY) || '{}'); } catch (e) { /* 무시 */ }
      C.setTune('_probe', null);
      if (had === null) { localStorage.removeItem(C.TUNE_KEY); }
      else { localStorage.setItem(C.TUNE_KEY, had); }
      return window.DG_NO_TUNE === true && seen === 760 && wrote._probe === undefined &&
        ('읽지 않음(' + seen + ') · 남기지 않음');
    });

    t('손잡이를 잡으면 그 값이 나오고, 놓으면 기본값으로 돌아온다', function () {
      var a = C.tuned('side.jump', 760);
      C.setTune('side.jump', 1200);
      var b = C.tuned('side.jump', 760);
      C.setTune('side.jump', null);
      var c = C.tuned('side.jump', 760);
      return a === 760 && b === 1200 && c === 760 && (a + ' → ' + b + ' → ' + c);
    });

    t('손잡이는 세이브와 다른 칸에 산다', function () {
      /* 세이브에 섞으면 프로필마다 규칙이 달라지고, 세이브를 넘길 때 규칙까지 따라간다.
         규칙은 "이 기기의 사정" 이지 진행이 아니다. */
      return C.TUNE_KEY === 'yeoksa-side/tune' && C.POKE_KEY === 'yeoksa-side/admin/poke' &&
        C.TUNE_KEY !== C.SAVE_KEY && C.SAVE_KEY.indexOf('yeoksa-side/save') === 0 &&
        (C.TUNE_KEY + ' · ' + C.POKE_KEY);
    });

    t('규칙이 잡히지 않은 손잡이는 코드의 기본값으로 돈다', function () {
      /* 규칙 값은 모듈이 **켜질 때 한 번** 손잡이를 읽는다. 진단은 손잡이를 안 읽으므로
         여기서 보이는 수는 늘 코드의 기본값이어야 한다 — 이 못이 풀리면 위 수치들이
         잡아 둔 손잡이에 따라 흔들린다. */
      return S.GRAV === 1900 && S.SPEED === 270 && S.CLIMB === 168 && DG.gear.BAG === 24 &&
        ('중력 ' + S.GRAV + ' · 달리기 ' + S.SPEED + ' · 줄 ' + S.CLIMB + ' · 가방 ' + DG.gear.BAG);
    });

    t('진단의 무작위는 씨앗으로 고정된다', function () {
      /* 같은 씨앗이면 같은 수열 — 이 항목이 깨지면 위 항목들의 수치도 흔들린다 */
      return window.DG_SEED === 20260824 &&
        Math.random() >= 0 && Math.random() < 1 &&
        ('씨앗 ' + window.DG_SEED);
    });

    t('런타임 에러 없음', function () {
      return errors.length === 0 || ('에러 ' + errors.length + '건: ' + errors.join(' | ')) === '';
    });

    var failCount = out.filter(function (s) { return s.indexOf('FAIL') >= 0; }).length;
    document.getElementById('report').innerHTML =
      '<h3>사가GO 사냥터 자가진단 — ' + (out.length - failCount) + '/' + out.length + ' 통과</h3>' +
      out.join('<br>') +
      (errors.length ? '<br><br><b class="fail">런타임 에러</b><br>' + errors.join('<br>') : '');
    document.title = 'RESULT ' + (out.length - failCount) + '/' + out.length;
    localStorage.removeItem(C.SAVE_KEY);
  }, 500);
})();
</script>
</body>
</html>
