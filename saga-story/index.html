<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script>/* 주소창에서 파일 이름을 지운다 — /xxx/index.html → /xxx/ */
try{if(location.protocol!=='file:'&&/\/index\.html$/.test(location.pathname))history.replaceState(null,'',location.pathname.replace(/index\.html$/,'')+location.search+location.hash);}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#3b5570">
<title>사가스토리 — 뛰고 썬다</title>
<link rel="stylesheet" href="css/style.css">
<!-- 원작풍 외피 — 이 한 줄을 빼면 예전 모습으로 돌아온다 (css/maple.css 머리말 참조) -->
<link rel="stylesheet" href="css/maple.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="사가스토리">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>

<!-- 본영 배경 — #stage 캔버스보다 먼저 그려 둔다. 쉬는 중(camp 안내)에는 캔버스가
     투명하게 비워져 이 배경이 비친다. 반드시 #stage 보다 앞줄에 있어야 한다 —
     뒤로 가면 z-index 가 같은 #stage 를 오히려 덮어 사냥 중 화면이 안 보인다 -->
<div id="camp-bg"></div>

<!-- 사냥터 (전체화면) — 3D 바탕(stage3d) 위에 2D 조작·오버레이(stage)가 겹친다 -->
<canvas id="stage3d"></canvas>
<canvas id="stage"></canvas>
<div id="vignette"></div>

<!-- 상단: 프로필 · 재화 · 도구 -->
<div id="top">
  <div class="glass profile" id="profile"></div>
  <div class="tools">
    <button class="icon-btn" id="btn-map" title="오버월드 전체 지도 (M)">🗺️</button>
    <button class="icon-btn" id="btn-auto" title="자동 사냥 (대신 뛰고 벤다)">🤖</button>
    <button class="icon-btn txt" id="btn-prop" title="캐릭터 등신 (4등신/2등신/8등신)">4등</button>
    <button class="icon-btn" id="btn-style" title="그림 양식 (전통 / 그림책 / 만화)">📗</button>
    <button class="icon-btn" id="btn-3d" title="3D 바탕 (실험)">🧊</button>
    <button class="icon-btn" id="btn-sound" title="소리 (첫 눌림에서 깨어납니다)">🔊</button>
    <button class="icon-btn" id="btn-help" title="도움말">❔</button>
    <a class="icon-btn" id="btn-admin" href="_admin.html" target="_blank" rel="noopener" title="어드민 (QA · 손잡이)">🛠️</a>
    <button class="icon-btn" id="btn-reset" title="처음부터">↺</button>
  </div>
  <div class="glass wallet" id="wallet"></div>
</div>

<!-- 자동 상태 -->
<div id="autobar"></div>

<!-- 가운데: 쉬는 중(사냥터 고르기) — 평소엔 곧장 사냥터로 들어가 안 뜬다.
     동행이 없을 때만(도감에서 인물을 고르라는 안내) 나온다 -->
<div id="camp"></div>

<!-- 아래: 사냥 중 조작 띠 -->
<div id="hud"></div>

<!-- 손가락 조작판 — 손가락뿐인 기기(hover:none · pointer:coarse)에서만 css 로 보인다.
     화면 전체를 숨은 넷으로 나눠 짚던 것 대신, 사가고 UI처럼 실제로 보이는 유리(glass)
     단추를 준다. 왼쪽 좌우 이동 · 오른쪽 위(점프·오르기·문)·아래(내려가기·앉기) -->
<div id="touchpad">
  <div class="pad-side pad-l">
    <button class="pad-btn" data-dir="left" aria-label="왼쪽으로 뛴다">◀</button>
    <button class="pad-btn" data-dir="right" aria-label="오른쪽으로 뛴다">▶</button>
  </div>
  <div class="pad-side pad-r">
    <button class="pad-btn" data-dir="up" aria-label="점프 · 오르기 · 문">▲</button>
    <button class="pad-btn" data-dir="down" aria-label="내려가기 · 앉기">▼</button>
  </div>
</div>

<!-- 우하단: 액션 독 — 사냥터·가방만 붙박이, 나머지는 "더보기" 뒤로 접는다
     (전투 중 화면을 덜 가리려는 자리다. 사가블로·사가국지와 같은 결) -->
<nav id="dock">
  <div id="dock-more">
    <button data-sheet="job"><span>🥋</span><small>무예</small></button>
    <button data-sheet="shop"><span>🏪</span><small>저자</small></button>
    <button data-sheet="dex"><span>📖</span><small>도감</small></button>
    <button data-sheet="log"><span>📜</span><small>기록</small></button>
  </div>
  <button data-sheet="field"><span>🏃</span><small>사냥터</small></button>
  <button data-sheet="bag"><span>🎒</span><small>가방</small></button>
  <button id="dock-more-btn"><span>⋯</span><small>더보기</small></button>
</nav>

<!-- 슬라이드 시트 -->
<div id="scrim"></div>
<aside id="sheet">
  <div class="sheet-head">
    <div class="grip"></div>
    <h3 id="sheet-title">사냥터</h3>
    <button class="icon-btn sm" id="sheet-close">✕</button>
  </div>
  <div id="sheet-body"></div>
</aside>

<div id="encounter"></div><div id="detail"></div><div id="owmap"></div>
<div id="toast"></div>
<script src="js/data.js"></script>
<script src="js/data-enemy.js"></script>
<script src="js/data-side.js"></script>
<script src="js/data-gear.js"></script>
<script src="js/data-job.js"></script>
<script src="js/data-quest.js"></script>
<script src="js/sprite.js"></script>
<script src="js/core.js"></script>
<script src="js/account.js"></script>
<script src="js/hero.js"></script>
<script src="js/side.js"></script>
<script src="js/side-view.js"></script>
<script src="js/vendor/three.iife.js"></script>
<script src="js/asset3d.js"></script>
<script src="js/portrait3d.js"></script>
<script src="js/side-view3d.js"></script>
<script src="js/gear.js"></script>
<script src="js/job.js"></script>
<script src="js/quest.js"></script>
<script src="js/sfx.js"></script>
<script src="js/net.js"></script>
<script src="js/ai.js"></script>
<script src="js/auto.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
<script>
/* 서비스 워커 — https · localhost 에서만 등록된다.
   파일을 늘리거나 고쳤으면 sw.js 의 VERSION 도 같이 올릴 것. */
(function () {
  if (!('serviceWorker' in navigator)) { return; }
  var h = location.hostname;
  var secure = location.protocol === 'https:' || h === 'localhost' || h === '127.0.0.1';
  if (!secure) { return; }
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js')['catch'](function (e) {
      console.warn('서비스 워커 등록 실패', e);
    });
  });
})();
</script>
</body>
</html>
