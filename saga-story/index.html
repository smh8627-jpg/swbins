<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#3b5570">
<title>사가스토리 — 뛰고 썬다</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="사가스토리">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>

<!-- 사냥터 (전체화면) -->
<canvas id="stage"></canvas>
<div id="vignette"></div>

<!-- 상단: 프로필 · 재화 · 도구 -->
<div id="top">
  <div class="glass profile" id="profile"></div>
  <div class="tools">
    <button class="icon-btn" id="btn-auto" title="자동 사냥 (대신 뛰고 벤다)">🤖</button>
    <button class="icon-btn txt" id="btn-prop" title="캐릭터 등신 (4등신/2등신/8등신)">4등</button>
    <button class="icon-btn" id="btn-style" title="그림 양식 (전통 / 그림책 / 만화)">📗</button>
    <button class="icon-btn" id="btn-help" title="도움말">❔</button>
    <button class="icon-btn" id="btn-reset" title="처음부터">↺</button>
  </div>
  <div class="glass wallet" id="wallet"></div>
</div>

<!-- 자동 상태 -->
<div id="autobar"></div>

<!-- 가운데: 쉬는 중(사냥터 고르기) -->
<div id="camp"></div>

<!-- 아래: 사냥 중 조작 띠 -->
<div id="hud"></div>

<!-- 우하단: 액션 독 -->
<nav id="dock">
  <button data-sheet="field"><span>🏃</span><small>사냥터</small></button>
  <button data-sheet="bag"><span>🎒</span><small>가방</small></button>
  <button data-sheet="job"><span>🥋</span><small>무예</small></button>
  <button data-sheet="shop"><span>🏪</span><small>저자</small></button>
  <button data-sheet="dex"><span>📖</span><small>도감</small></button>
  <button data-sheet="log"><span>📜</span><small>기록</small></button>
</nav>

<!-- 슬라이드 시트 -->
<div id="scrim"></div>
<aside id="sheet">
  <div class="sheet-head">
    <div class="grip"></div>
    <h3 id="sheet-title">사냥터</h3>
    <button class="icon-btn sm" id="sheet-close">✕</button>
  </div>
  <div id="sheet-body"></div>
</aside>

<div id="encounter"></div><div id="detail"></div>
<div id="toast"></div>

<script src="js/data.js"></script>
<script src="js/data-enemy.js"></script>
<script src="js/data-side.js"></script>
<script src="js/data-gear.js"></script>
<script src="js/data-job.js"></script>
<script src="js/data-quest.js"></script>
<script src="js/sprite.js"></script>
<script src="js/core.js"></script>
<script src="js/account.js"></script>
<script src="js/hero.js"></script>
<script src="js/side.js"></script>
<script src="js/side-view.js"></script>
<script src="js/gear.js"></script>
<script src="js/job.js"></script>
<script src="js/quest.js"></script>
<script src="js/net.js"></script>
<script src="js/ai.js"></script>
<script src="js/auto.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
<script>
/* 서비스 워커 — https · localhost 에서만 등록된다.
   파일을 늘리거나 고쳤으면 sw.js 의 VERSION 도 같이 올릴 것. */
(function () {
  if (!('serviceWorker' in navigator)) { return; }
  var h = location.hostname;
  var secure = location.protocol === 'https:' || h === 'localhost' || h === '127.0.0.1';
  if (!secure) { return; }
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js')['catch'](function (e) {
      console.warn('서비스 워커 등록 실패', e);
    });
  });
})();
</script>
</body>
</html>
