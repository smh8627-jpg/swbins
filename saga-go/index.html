try{if(location.protocol!=='file:'&&/\/index\.html$/.test(location.pathname))history.replaceState(null,'',location.pathname.replace(/index\.html$/,'')+location.search+location.hash);}catch(e){}</script>

<!-- 상단: 프로필 · 재화 · 도구 -->
<div id="top">
  <div class="glass profile" id="profile"></div>
  <div class="tools">
    <button class="icon-btn" id="btn-auto" title="자동 순행 (AI가 대신 걷고 만난다)"><span data-icon="bot">🤖</span></button>
    <button class="icon-btn" id="btn-geo" title="실제 위치로 전환"><span data-icon="satellite-dish">📡</span></button>
    <!-- 좁은 화면에서만 접힌다. 넓은 화면에서는 서랍이 `display:contents` 로
         풀려 아래 단추들이 이 줄에 그대로 늘어선다 — 단추를 옮기지 않으므로
         이벤트도 손잡이도 건드릴 것이 없다 -->
    <div class="tools-drawer" id="tools-drawer">
      <button class="icon-btn" id="btn-map" title="지도 스타일 바꾸기"><span data-icon="map">🗺️</span></button>
      <button class="icon-btn" id="btn-owmap" title="전체 지도 (M) — 지금까지 밟은 곳을 한눈에"><span data-icon="compass">🧭</span></button>
      <button class="icon-btn txt" id="btn-tilt" title="2D / 2.5D / 3D 전환">2.5D</button>
      <button class="icon-btn" id="btn-3inch" title="3인치 모드 — 화면을 멀리서 봅니다"><span data-icon="scan">🔍</span></button>
      <button class="icon-btn txt" id="btn-prop" title="캐릭터 등신 (4등신/2등신/8등신)">4등</button>
      <button class="icon-btn" id="btn-style" title="그림 양식 (전통 삽화 / 일본 만화)"><span data-icon="palette">🖌️</span></button>
      <button class="icon-btn" id="btn-help" title="도움말"><span data-icon="circle-question-mark">❔</span></button>
      <a class="icon-btn" id="btn-admin" href="_admin.html" target="_blank" rel="noopener" title="어드민 (QA · 손잡이)">🛠️</a>
      <button class="icon-btn" id="btn-reset" title="처음부터"><span data-icon="rotate-ccw">↺</span></button>
    </div>
    <button class="icon-btn" id="btn-more" title="도구 더 보기" aria-expanded="false"><span data-icon="ellipsis">⋯</span></button>
  </div>
  <div class="glass wallet" id="wallet"></div>
</div>

<script>
/* 서비스 워커 — 오프라인 모드의 캐시.
   https 나 localhost 에서만 등록된다(브라우저 규칙). 사내 http 주소로 열면
   홈 화면 추가는 되지만 이 캐시는 붙지 않는다 — 그때도 게임 자체는 그대로 돈다. */
(function () {
  if (!('serviceWorker' in navigator)) { return; }
  var h = location.hostname;
  var secure = location.protocol === 'https:' || h === 'localhost' || h === '127.0.0.1';
  if (!secure) { return; }
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js')['catch'](function (e) {
      console.warn('서비스 워커 등록 실패', e);
    });
  });
})();
</script>
