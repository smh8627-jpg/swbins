<script>
window.DG_NO_DRAW = true; window.DG_NO_ACCOUNT = true; window.DG_NO_TUNE = true;

/* 무작위 고정 — 진단이 굴릴 때마다 달라지면 판정이 흔들린다.
   게임 스크립트보다 **먼저** 갈아 둬야 부트에서 쓰는 난수까지 잡힌다.
   (실제 플레이는 그대로다 — 이 파일 안에서만 바꾼다)
   mulberry32: 짧고 분포가 고르며 같은 씨앗이면 같은 수열이 나온다. */
(function (seed) {
  var s = seed >>> 0;
  Math.random = function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  window.DG_SEED = seed;
})(20260824);
</script>

<script>
/* 자가진단 — 헤드리스에서 게임 로직이 실제로 도는지 확인한다.
   브라우저로 직접 열어도 되고, 아래 명령으로 자동 확인해도 된다.
     chrome --headless=new --virtual-time-budget=25000 --dump-dom http://127.0.0.1:8791/_test.html
*/
(function () {
  var out = [], errors = [];
  window.addEventListener('error', function (e) { errors.push(e.message); });

  function t(name, fn) {
    try {
      var r = fn();
      out.push((r ? '<span class="pass">PASS</span> ' : '<span class="fail">FAIL</span> ') + name + (typeof r === 'string' ? ' — ' + r : ''));
      return !!r;
    } catch (e) {
      out.push('<span class="fail">FAIL</span> ' + name + ' — 예외: ' + e.message);
      return false;
    }
  }

  setTimeout(function () {
    /* 천후는 세 시간마다 바뀐다 — 진단이 돌리는 시각에 끌려다니지 않도록 하나로 고정한다.
       (씨앗을 고정한 것과 같은 이유다. 게임 코드는 그대로 두고 여기서만 갈아 끼운다) */
    DG.weather.force('clear');
    /* 적도(賊徒)도 같은 이유로 붙들어 둔다 — 칸마다 역참의 두 할이 점거되므로,
       하필 그 칸에 진단을 돌리면 보급 항목이 통째로 깨진다(토벌에서 밟은 함정).
       적도 자신을 재는 아래 항목들만 그 자리에서 잠깐 풀었다 다시 묶는다. */
    DG.rogue.force(false);

    var C = DG.core, W = DG.world, D = DG.data;
    var HR = DG.hero, NT = DG.net, AI = DG.ai;
    localStorage.removeItem(C.SAVE_KEY);   // 깨끗한 상태로 판정

    /* ── 본편 뼈대 ─────────────────────────────────────── */

    t('데이터 적재', function () {
      return D.heroes.length + '명 인물 / ' + D.pets.length + '종 펫';
    });

    t('중복 id 없음', function () {
      var seen = {}, dup = [];
      D.heroes.concat(D.pets).forEach(function (e) { if (seen[e.id]) { dup.push(e.id); } seen[e.id] = 1; });
      return dup.length ? false : '고유 id ' + Object.keys(seen).length + '개';
    });

    t('이 게임에 실린 것만 실려 있다 (포켓몬고식)', function () {
      /* 던전·장비는 saga-dungeon, 문답은 saga-quiz 로 갈라져 나갔다.
         경영(영지·건설)은 saga-quiz 가 맡는다. 여기는 걷기·조우·도감만. */
      var here = ['world', 'encounter', 'auto', 'hero', 'sprite'];
      var gone = ['dungeon', 'dungeonView', 'item', 'itemData', 'enemyData', 'quiz', 'quizData',
                  'battle', 'prestige', 'idle', 'territory', 'build'];
      var missing = here.filter(function (k) { return !DG[k]; });
      var leaked = gone.filter(function (k) { return !!DG[k]; });
      return missing.length === 0 && leaked.length === 0 &&
        ('실린 것 ' + here.length + '개 · 없는 것 ' + gone.length + '개');
    });

    t('경영은 완전히 제거됐다 (세이브·효과·구역 이름)', function () {
      var fresh = !C.save.territory && !C.save.build;          // 기본 세이브에 골격이 없다
      var noRegionCount = typeof C.regionCount === 'undefined'; // core 의 영지 집계도 없다
      var name = W.regionName('3,4');                          // 구역 이름은 world 가 자체 보유
      var stable = name === W.regionName('3,4') && name.length > 0;
      var eff = C.effect();                                    // 건설 효과 키가 남아 있지 않다
      var noProd = !eff['gold/min'] && !eff['fame/min'];
      return fresh && noRegionCount && stable && noProd &&
        ('세이브·집계·건설효과 없음 · 구역 이름 "' + name + '" 유지');
    });

    t('스폰 생성', function () {
      W.update(0.016);
      return W.spawns.length > 0 && W.spawns.length + '개 배치';
    });

    t('지형 결정성(같은 좌표=같은 지형)', function () {
      return W.terrainAt(3, 7) === W.terrainAt(3, 7) && W.terrainAt(3, 7);
    });

    /* ── 조우 (등용 · 포획) ────────────────────────────── */

    t('등용 성공 → 도감·동행·공적·동행 경험치·금', function () {
      C.save.items.scroll = 9; C.save.player.fame = 999;
      var gold0 = C.save.player.gold;
      // 먼저 한 명을 동행에 앉혀 두고, 새 인물을 등용하면 경험치가 흐르는지 본다
      var senior = D.heroes[5];
      C.save.dex.heroes[senior.id] = { count: 1, firstAt: Date.now() };
      C.save.heroes[senior.id] = { lv: 1, exp: 0, rank: 0 };
      C.save.party = [senior.id];
      var hero = D.heroes[0];
      var sp = { uid: 99991, kind: 'hero', ref: hero, x: 0, y: 0, bornAt: Date.now() };
      W.spawns.push(sp);
      DG.encounter.open(sp);
      for (var i = 0; i < 4; i++) {
        var btn = document.querySelector('[data-appeal="' + hero.trait + '"]');
        if (!btn) { break; }
        btn.click();
      }
      DG.encounter.close();
      var g = HR.info(senior.id);
      var goldGain = C.save.player.gold - gold0;
      return !!C.save.dex.heroes[hero.id] && C.save.party.indexOf(hero.id) >= 0 &&
        C.save.player.featTotal > 0 && (g.exp > 0 || g.lv > 1) &&
        goldGain === hero.rarity * 15 &&
        ('공적 누적 ' + C.save.player.featTotal + ' · 동행 경험치 ' + g.exp + ' · 금 +' + goldGain);
    });

    t('포획 시도 → 사료 소모·종료 (성공 시 명성·금)', function () {
      C.save.items.feed = 5;
      var fame0 = C.save.player.fame, gold0 = C.save.player.gold;
      var pets0 = Object.keys(C.save.dex.pets).length;
      var pet = D.pets[D.pets.length - 1];
      var sp = { uid: 99992, kind: 'pet', ref: pet, x: 0, y: 0, bornAt: Date.now() };
      W.spawns.push(sp);
      DG.encounter.open(sp);
      var before = C.save.items.feed;
      document.querySelector('[data-act="throw"]').click();
      var after = C.save.items.feed;
      var caught = Object.keys(C.save.dex.pets).length > pets0;
      DG.encounter.close();
      var fameOk = caught ? C.save.player.fame > fame0 : true;
      var goldGain = C.save.player.gold - gold0;
      var goldOk = caught ? goldGain === pet.rarity * 10 : goldGain === 0;
      return after === before - 1 && fameOk && goldOk &&
        ('사료 ' + before + '→' + after + (caught ? ' · 포획 성공(명성·금 +' + goldGain + ')' : ' · 놓침'));
    });

    /* ── 걷기 보급 ─────────────────────────────────────── */

    t('걷기 보급 — 250m 마다 사료·명성·금, 500m 마다 등용서', function () {
      var p = C.save.player;
      p.distance = 1000; p.supplyMark = 1000; p.supplyCount = 0;
      var feed0 = C.save.items.feed, scroll0 = C.save.items.scroll, fame0 = p.fame, gold0 = p.gold;
      p.distance += DG.game.SUPPLY_STEP * 2;         // 500m 걸었다
      DG.game.tickSupply();
      return C.save.items.feed === feed0 + 2 && C.save.items.scroll === scroll0 + 1 &&
        p.fame === fame0 + 20 && p.gold === gold0 + 16 && p.supplyMark === p.distance &&
        ('🍖 +2 · 📜 +1 · 🎖️ +20 · 🪙 +16');
    });

    t('보급 기준점은 거리보다 앞서지 않는다 (리셋 보호)', function () {
      var p = C.save.player;
      p.supplyMark = p.distance + 9999;
      DG.game.tickSupply();
      return p.supplyMark <= p.distance && '기준점 보정 확인';
    });

    /* ── 역참(驛站) — 원작의 포켓스탑 ─────────────────── */

    t('역참 자리는 늘 같다 (좌표 해시)', function () {
      var a = DG.world.stationsIn(3, -2), b = DG.world.stationsIn(3, -2);
      var ok = a.length === 2 && a.length === b.length;
      for (var i = 0; ok && i < a.length; i++) {
        ok = a[i].key === b[i].key && a[i].x === b[i].x && a[i].y === b[i].y;
      }
      return ok && ('구역당 ' + a.length + '곳 · 두 번 물어도 같은 자리');
    });

    t('역참이 구역 한쪽에 몰리지 않는다 (hash2 0~0.5 함정)', function () {
      /* 이 판의 core.hash2 는 0~0.5 만 돌려준다. 그대로 쓰면 역참이 구역의
         왼쪽 위 사분면에만 선다 — world.js 가 두 배로 펴서 쓰는지 여기서 못박는다. */
      var R = DG.world.REGION_SIZE, maxU = 0, maxV = 0;
      for (var rx = -6; rx <= 6; rx++) {
        for (var ry = -6; ry <= 6; ry++) {
          var list = DG.world.stationsIn(rx, ry);
          for (var i = 0; i < list.length; i++) {
            var u = list[i].x / R - rx, v = list[i].y / R - ry;
            if (u > maxU) { maxU = u; }
            if (v > maxV) { maxV = v; }
          }
        }
      }
      return maxU > 0.6 && maxV > 0.6 &&
        ('구역 안 최대 위치 ' + maxU.toFixed(2) + ' · ' + maxV.toFixed(2) + ' (0.6 넘어야 정상)');
    });

    t('역참에 들르면 등용서·사료·금·경험치를 받는다', function () {
      C.save.stations = {};
      var st = DG.world.stationsIn(0, 0)[0];
      var s0 = C.save.items.scroll, f0 = C.save.items.feed, g0 = C.save.player.gold;
      var visits0 = C.save.player.stationVisits || 0;
      var r = DG.station.visit(st);
      return r.ok &&
        C.save.items.scroll === s0 + r.reward.scroll &&
        C.save.items.feed === f0 + r.reward.feed &&
        C.save.player.gold === g0 + r.reward.gold &&
        C.save.player.stationVisits === visits0 + 1 &&
        ('📜 +' + r.reward.scroll + ' · 🍖 +' + r.reward.feed + ' · 🪙 +' + r.reward.gold);
    });

    t('한 번 들른 역참은 쉬는 중 — 다시 줘도 아무것도 안 준다', function () {
      var st = DG.world.stationsIn(0, 0)[0];
      var s0 = C.save.items.scroll, g0 = C.save.player.gold;
      var r = DG.station.visit(st);
      var stt = DG.station.stateOf(st.key);
      return !r.ok && r.reason === 'cooldown' && !stt.ready &&
        C.save.items.scroll === s0 && C.save.player.gold === g0 &&
        ('남은 시간 ' + DG.station.leftLabel(stt.left));
    });

    t('쉬는 시간이 지나면 다시 찬다', function () {
      var st = DG.world.stationsIn(0, 0)[0];
      C.save.stations[st.key] = Date.now() - DG.station.COOLDOWN - 1000;
      var ready = DG.station.stateOf(st.key).ready;
      var r = DG.station.visit(st);
      return ready && r.ok && ('다시 참 · 📜 +' + r.reward.scroll);
    });

    t('다 쉰 역참 기록은 세이브에서 지워진다 (키가 무한히 쌓이지 않게)', function () {
      var st = DG.world.stationsIn(5, 5)[0];
      C.save.stations[st.key] = Date.now() - DG.station.COOLDOWN - 1000;
      DG.station.stateOf(st.key);
      return C.save.stations[st.key] === undefined && '만료 항목 정리 확인';
    });

    t('자동 순행이 채워진 역참으로 걸어가 들른다', function () {
      C.save.stations = {};
      DG.auto.state().on = true; DG.auto.state().stop = true;
      /* 밑천을 비워 대상을 못 고르게 하면 역참이 목표가 된다 */
      C.save.items.scroll = 0; C.save.items.feed = 0;
      var st = DG.world.stationsNear()[0];
      C.save.player.pos.x = st.x; C.save.player.pos.y = st.y;   // 사거리 안에 세운다
      var s0 = C.save.items.scroll;
      for (var i = 0; i < 12; i++) { DG.auto._tickMap(0.5); }
      DG.auto.state().on = false;
      /* 뒤처리 — 자동이 걸어 둔 목표를 지운다.
         남겨 두면 뒤에 오는 걷기 항목이 "멈춰 있는데 계속 걷는" 상태로 깨진다. */
      DG.world.walkTo(C.save.player.pos.x, C.save.player.pos.y);
      DG.world.update(0.05);
      return C.save.items.scroll > s0 &&
        ('자동이 들러 등용서 ' + s0 + '→' + C.save.items.scroll);
    });

    /* ── 적도(賊徒) — 원작의 로켓단 ─────────────────────
       살피는 내내 **칸의 첫머리**에서 본다. 머무는 시간을 칸 첫머리부터 재므로,
       그냥 Date.now() 로 보면 진단이 **돌린 시각**에 끌려다닌다(토벌에서 밟은 함정). */

    t('적도 — 진단은 기본으로 붙들어 둔다 (force)', function () {
      var stn = DG.world.stationsIn(0, 0)[0];
      return DG.rogue.occupied(stn) === false && '어느 칸에 돌려도 점거 없음';
    });

    t('적도 — 같은 역참·같은 칸이면 늘 같은 판이다 (해시)', function () {
      DG.rogue.force(null);
      C.save.rogue = null;
      var stn = DG.world.stationsIn(0, 0)[0];
      var found = null, i;
      /* 어느 칸에서는 반드시 든다 — 칸의 첫머리만 훑는다 */
      for (i = 0; i < 80 && !found; i++) { found = DG.rogue.at(stn, i * DG.rogue.SLOT_MS); }
      if (!found) { return false; }
      var again = DG.rogue.at(stn, (i - 1) * DG.rogue.SLOT_MS);
      return again && again.key === found.key && again.boss.id === found.boss.id &&
        again.dark.id === found.dark.id && again.hp === found.hp &&
        (found.rank.name + ' ' + found.boss.name + ' · 암영 ' + found.dark.name);
    });

    t('적도 — 머물 시간이 지나면 스스로 물러간다', function () {
      var stn = DG.world.stationsIn(0, 0)[0];
      var slot = null, i;
      for (i = 0; i < 80 && slot === null; i++) {
        if (DG.rogue.at(stn, i * DG.rogue.SLOT_MS)) { slot = i; }
      }
      if (slot === null) { return false; }
      var head = slot * DG.rogue.SLOT_MS;
      var during = !!DG.rogue.at(stn, head + DG.rogue.STAY_MS - 1000);
      var after = !!DG.rogue.at(stn, head + DG.rogue.STAY_MS + 1000);
      return during && !after && (DG.rogue.STAY_MS / 60000 + '분까지 있고 그 뒤엔 없다');
    });

    t('적도 — 점거된 역참은 보급을 주지 않는다', function () {
      /* 시계를 돌릴 수 없으니 **지금 칸**에 점거된 역참을 찾아 본다.
         지금 칸이 비어 있으면 그 사실만 확인하고 넘어간다(규칙상 있을 수 있다). */
      C.save.stations = {};
      var all = DG.world.stationsIn(0, 0)
        .concat(DG.world.stationsIn(1, 0), DG.world.stationsIn(0, 1),
                DG.world.stationsIn(2, 3), DG.world.stationsIn(-2, 4));
      var held = null, i;
      for (i = 0; i < all.length; i++) { if (DG.rogue.occupied(all[i])) { held = all[i]; break; } }

    /**
     * 적장이 든 시간 칸을 찾는다.
     * **칸의 첫머리부터** 봐야 한다 — 적장은 칸이 열리고 45분만 머무는데,
     * `Date.now() + i*SLOT` 으로 훑으면 '지금이 몇 분인지'가 그대로 따라와서
     * 45분이 지난 시각에 진단을 돌리면 한 칸도 못 찾는다(실제로 그렇게 깨졌다).
     */
    function findRaid(f) {
      var R = DG.raid;
      var base = Math.floor(Date.now() / R.SLOT_MS) * R.SLOT_MS;
      for (var i = 0; i < 400; i++) {
        var ms = base + i * R.SLOT_MS + 60000;      // 칸이 열리고 1분 뒤
        var rd = R.at(f, ms);
        if (rd) { return { raid: rd, ms: ms }; }
      }
      return null;
    }

    t('적장은 드물게 들고, 마흔다섯 분이면 물러간다', function () {

      if (!f) { return false; }
      var found0 = findRaid(f);
      if (!found0) { return '400칸 안에 한 번도 안 든다' && false; }
      var start = Math.floor(found0.ms / R.SLOT_MS) * R.SLOT_MS;
      var inside = R.at(f, start + R.STAY_MS - 1000);
      var outside = R.at(f, start + R.STAY_MS + 1000);
      return inside && !outside &&
        ('든 칸에서 44분엔 있고 46분엔 없다 · ' + inside.tier.name);
    });

    t('에셋 — 손잡이를 내리면 표가 있어도 도형으로 간다', function () {
      AS.clear();
      var guan = D.find('sg_guanyu');

    t('에셋 — 클립 이름이 제각각이어도 자리를 찾는다', function () {

        m.run === 'Anim_Run_F' && m.attack === 'Attack_01' && m.hit === 'GetHit' &&
        m.dodge === 'Roll' && m.death === 'Death' &&
        ('7개 클립 → idle/walk/run/attack/hit/dodge/death 다 찼다');
    });

    t('에셋 — 한 클립이 두 자리를 겸하지 않는다', function () {
      /* `hit` 과 `attack` 은 서로 먹기 쉽다. 점수제라 정확히 맞는 쪽이 가져간다 */
      var m = AS.mapClips(['hit', 'attack']);
      return m.hit === 'hit' && m.attack === 'attack' &&
        AS.score('hit', 'hit') > AS.score('attack', 'hit') &&
        ('hit→hit(' + AS.score('hit', 'hit') + '점) · attack→attack');
    });

    t('에셋 — 없는 동작은 대타로 메운다', function () {
      var m = AS.mapClips(['Idle', 'Walk']);
      return m.run === 'Walk' && m.alias.run === 'walk' && m.sprint === 'Walk' &&
        m.hit === 'Idle' && m.alias.hit === 'idle' &&
        ('걷기밖에 없으면 뛰기도 걷기로 · 대타 ' + Object.keys(m.alias).length + '자리');
    });

    t('에셋 — 클립이 하나도 없어도 안 깨진다', function () {
      var m = AS.mapClips([]);
      return AS.SLOTS.every(function (s) { return m[s] === undefined; }) &&
        Object.keys(m.alias).length === 0 && '빈 목록 → 빈 자리표';
    });

    t('에셋 — 이름을 씻는 규칙', function () {
      return AS.normName('Armature|mixamo.com|Layer0') === 'layer0' &&
        AS.normName('Walk.001') === 'walk' && AS.normName('Anim_Run_F') === 'animrunf' &&
        AS.normName(null) === '' && '| 뒤를 취하고 .001 을 떼고 영숫자만 남긴다';
    });

    t('에셋 — 어떤 크기로 만들었든 키 1 로 눕힌다', function () {
      /* 이 판의 배우는 전부 키 1 로 만들어 두고 세우는 쪽에서 배율을 준다 */
      var big = AS.fit({ minX: -50, maxX: 50, minY: 0, maxY: 180, minZ: -50, maxZ: 50 });
      var tiny = AS.fit({ minX: -0.1, maxX: 0.1, minY: -0.4, maxY: 0.4, minZ: -0.1, maxZ: 0.1 });
      var h1 = 180 * big.scale, h2 = 0.8 * tiny.scale;
      return Math.abs(h1 - 1) < 1e-9 && Math.abs(h2 - 1) < 1e-9 &&
        Math.abs(big.dy) < 1e-9 && Math.abs(tiny.dy - 0.5) < 1e-9 &&
        ('180 단위 · 0.8 단위 → 둘 다 키 1 · 발이 y=0');
    });

    t('에셋 — 표를 뒤져도 세이브는 그대로다', function () {
      var before = JSON.stringify(C.save);
      AS.register('hero', 'x.glb');
      AS.chain('hero', D.find('sg_guanyu'));
      AS.mapClips(['Idle', 'Walk']);
      AS.clear();
      return JSON.stringify(C.save) === before && '세이브 한 칸도 안 바뀐다';
    });

    t('카메라 — 조우가 열리면 대상 쪽을 본다', function () {
      var pos = { x: 0, y: 0 };
      var free = R3.camAim(pos, 2, null);
      var aim = R3.camAim(pos, 2, { x: 60, y: 0 });
      return aim.look.x > free.look.x && Math.abs(aim.look.x - 30) < 0.001 &&
        ('평소 ' + Math.round(free.look.x) + ' → 조우 중 ' + Math.round(aim.look.x) + ' (둘 사이)');
    });

    t('카메라 — 시점을 눕힐수록 낮게 깔린다', function () {
      var pos = { x: 0, y: 0 };
      var a = R3.camAim(pos, 0, null), b = R3.camAim(pos, 1, null), c = R3.camAim(pos, 2, null);
      return a.pos.y > b.pos.y && b.pos.y > c.pos.y &&
        ('2D ' + Math.round(a.pos.y) + 'm · 2.5D ' + Math.round(b.pos.y) +
         'm · 3D ' + Math.round(c.pos.y) + 'm');
    });

    /* ── 손으로 그린 땅 (land) — 시험 삼아 만든 한 조각 ────────
     * 지도는 사람이 글자로 고치는 것이라 **고친 자리에서 곧바로 걸려야** 한다.
     * 줄 길이 · 모르는 글자 · 끊긴 길 · 구역 밖으로 나간 명소를 여기서 붙든다.
     * 전부 순수 함수라 three 없이도 돈다.
     */

    var LD = DG.land;

    t('땅 — 지도가 성하다 (줄 길이 · 글자 · 명소)', function () {
      var bad = LD.validate();
      var b = LD.bounds();
      return bad.length === 0 &&
        (LD.info().w + '×' + LD.info().h + '칸 · ' + LD.info().m +
         ' · 격자 ' + b.x0 + ',' + b.y0 + '..' + b.x1 + ',' + b.y1);
    });

    t('땅 — 길이 하나로 이어진다 (다리를 길로 친다)', function () {
      var n = LD.roadIslands();
      var tl = LD.tally();
      return n === 1 && tl.road + (tl['@bridge'] || 0) > 30 &&
        ('길 ' + (tl.road + (tl['@bridge'] || 0)) + '칸이 한 덩어리');
    });

    t('땅 — 아홉 가지 땅과 숨은 곳 셋이 다 있다', function () {
      var tl = LD.tally();
      var kinds = ['town', 'forest', 'mount', 'water', 'road', 'farm', 'grass'];
      var all = kinds.every(function (k) { return tl[k] > 0; });
      var hidden = LD.places().filter(function (p) { return p.hidden; });
      return all && tl['@bridge'] === 1 && tl['@cave'] === 1 && tl['@ruin'] > 0 &&
        tl['@shrine'] === 1 && hidden.length === 3 &&
        ('마을 ' + tl.town + ' · 논 ' + tl.farm + ' · 숲 ' + tl.forest + ' · 산 ' + tl.mount +
         ' · 강 ' + tl.water + ' · 숨은 곳 ' + hidden.map(function (p) { return p.name; }).join('·'));
    });

    t('땅 — 시작 자리가 마을 한가운데다', function () {
      /* 원점(0,0)에서 시작하니, 켜면 곧바로 그 땅 안에 서 있어야 한다 */
      var here = LD.at(0, 0);
      var v = LD.place('village');
      return here && here.kind === 'town' && v.x === 24 && v.y === 24 &&
        W.terrainAt(0, 0) === 'town' && ('격자 0,0 = ' + here.kind + ' · ' + v.name);
    });

    t('땅 — 남문에서 다리까지 길로만 이어진다', function () {
      /* 걸어서 이 땅을 가로지를 수 있어야 시험판 노릇을 한다 */
      var g = LD.place('gate_s'), br = LD.place('bridge');
      var ty, ok = true, kinds = [];
      for (ty = g.ty; ty <= br.ty; ty++) {
        var a = LD.at(br.tx, ty);
        kinds.push(a ? (a.mark || a.kind) : '밖');
        if (!a || (a.kind !== 'road' && a.mark !== 'bridge')) { ok = false; }
      }
      return ok && kinds[kinds.length - 1] === 'bridge' &&
        ('남문 → ' + kinds.join('→'));
    });

    t('땅 — 밖은 예전 땅 그대로다', function () {
      /* 이 땅이 세상을 다 덮으면 안 된다 — 한 조각일 뿐이다 */
      var b = LD.bounds();
      var out1 = LD.at(b.x1 + 1, 0), out2 = LD.at(0, b.y0 - 1);
      C.setTune('land.on', 0);
      var offInside = LD.at(0, 0);
      var offWorld = W.terrainAt(0, 0);
      C.setTune('land.on', null);                 // 남기지 않는다
      var onWorld = W.terrainAt(0, 0);
      return out1 === null && out2 === null && offInside === null &&
        offWorld !== 'town' && onWorld === 'town' &&
        ('땅 밖 null · 손잡이 끄면 옛 땅(' + offWorld + ') 으로 돌아간다');
    });

    t('땅 — 3D 가 논과 표식을 실제로 세운다', function () {
      var f = LD.place('farm'), br = LD.place('bridge'), cv = LD.place('cave');
      var farm = R3.propPlan('farm', f.tx, f.ty, true).map(function (p) { return p.t; });
      var bridge = R3.propPlan('water', br.tx, br.ty, true).map(function (p) { return p.t; });
      var cave = R3.propPlan('mount', cv.tx, cv.ty, true).map(function (p) { return p.t; });
      return farm.indexOf('field') >= 0 && bridge.indexOf('bridge') >= 0 &&
        cave.indexOf('cave') >= 0 &&
        ('논 ' + farm.join('/') + ' · 다리 ' + bridge.join('/') + ' · 굴 ' + cave.join('/'));
    });

    t('땅 — 지도가 깔려 있어도 강물은 깐다', function () {
      /* 이 땅의 강은 **지도에 없는 물**이다. 지도가 있다고 빼면 강이 아예 안 보인다 */
      var br = LD.place('bridge');
      var inside = R3.propPlan('water', br.tx, br.ty, true).map(function (p) { return p.t; });
      var outside = R3.propPlan('water', 400, 400, true).map(function (p) { return p.t; });
      return inside.indexOf('water') >= 0 && outside.indexOf('water') < 0 &&
        ('땅 안 ' + inside.join('/') + ' · 땅 밖 ' + outside.join('/'));
    });

    t('땅 — 땅을 바꿔도 판정은 그대로다', function () {
      /* terrainAt 은 **그리는 데만** 쓴다 — 스폰·거리·조우가 이 값을 보면 안 된다 */
      var before = JSON.stringify(C.save);
      var n0 = JSON.stringify(W.spawns.map(function (s) { return s.uid + ':' + Math.round(s.x) + ',' + Math.round(s.y); }));
      LD.at(0, 0); LD.terrainAt(3, 3); LD.markAt(0, -9); LD.info();
      R3.propPlan('farm', -6, 4, true);
      var n1 = JSON.stringify(W.spawns.map(function (s) { return s.uid + ':' + Math.round(s.x) + ',' + Math.round(s.y); }));
      return JSON.stringify(C.save) === before && n0 === n1 &&
        '세이브 · 스폰 한 칸도 안 바뀐다';
    });

    /* ── 주민 (npc) — 이 땅에 사는 열 사람 ──────────────────
     * 자리가 **시각의 순수 함수**라 값으로 다 본다. 시각과 천후는 인자로 못박는다 —
     * 저녁에 돌렸다고 답이 달라지면 진단이 아니다(이 저장소의 오랜 규칙).
     */

    var NP = DG.npc;
    function atT(h, m) { return new Date(2026, 7, 26, h, m || 0, 0, 0).getTime(); }

    t('주민 — 열 사람이 다 이 땅 안에 산다', function () {
      var b = LD.bounds(), i, out = [], names = [];
      for (i = 0; i < NP.PEOPLE.length; i++) {
        var p = NP.PEOPLE[i];
        names.push(p.p || p.name);
        var j;
        for (j = 0; j < p.spots.length; j++) {
          if (!LD.place(p.spots[j].at)) { out.push(p.id + '→' + p.spots[j].at); }
        }
        if (!LD.place(p.home)) { out.push(p.id + ' 집 ' + p.home); }
      }
      return NP.PEOPLE.length === 10 && out.length === 0 &&
        ('열 사람 · 일과가 가리키는 자리가 다 이 땅 안 (격자 ' +
         b.x0 + ',' + b.y0 + '..' + b.x1 + ',' + b.y1 + ')');
    });

    t('주민 — 같은 시각을 물으면 늘 같은 자리다', function () {
      /* 걸음을 쌓아 올리지 않고 시각에서 곧바로 뽑는다 — 그래서 다시 물어도 같다 */
      var a = NP.posAt('npc_elder', atT(10), 'clear');
      var b = NP.posAt('npc_elder', atT(10), 'clear');
      var c = NP.posAt('npc_elder', atT(10, 1), 'clear');
      return a.x === b.x && a.y === b.y && (a.x !== c.x || a.y !== c.y || a.k === 1) &&
        ('10시 촌장 ' + Math.round(a.x) + ',' + Math.round(a.y) + ' — 두 번 물어 같다');
    });

    t('주민 — 일과를 따라 자리를 옮긴다', function () {
      var e7 = NP.posAt('npc_elder', atT(7), 'clear');
      var e12 = NP.posAt('npc_elder', atT(12), 'clear');
      var e18 = NP.posAt('npc_elder', atT(18), 'clear');
      var moved = Math.hypot(e12.x - e7.x, e12.y - e7.y);
      return e7.at === 'village' && e12.at === 'gate_n' && e18.at === 'village' &&
        moved > 40 &&
        ('7시 마을 → 12시 북문(' + Math.round(moved) + 'm 밖) → 18시 마을');
    });

    t('주민 — 자리를 옮기는 동안은 걷는다 (순간이동하지 않는다)', function () {
      var s = NP.segAt(NP.find('npc_soldier'), atT(10, 1));
      var a = NP.posAt('npc_soldier', atT(10, 1), 'clear');   // 막 떠났다
      var b = NP.posAt('npc_soldier', atT(14), 'clear');      // 도착해 있다
      var from = LD.place('gate_n'), to = LD.place('ridge');
      var dA = Math.hypot(a.x - from.x, a.y - from.y);
      var dB = Math.hypot(b.x - to.x, b.y - to.y);
      var span = Math.hypot(to.x - from.x, to.y - from.y);
      return a.walking === true && b.walking === false &&
        a.k > 0.15 && a.k < 0.7 && dA < span && dB < 20 && s.cur.at === 'ridge' &&
        ('북문→산등성이 ' + Math.round(span) + 'm · 10:01 에 ' +
         Math.round(a.k * 100) + '% 지점(' + Math.round(dA) + 'm) · 14시 도착(' +
         Math.round(dB) + 'm)');
    });

    t('주민 — 비가 오면 일과를 접고 집으로 간다', function () {
      /* PLAN 14절 "비가 오면 이동한다" */
      var dry = NP.posAt('npc_herb', atT(11), 'clear');
      var wet = NP.posAt('npc_herb', atT(11), 'rain');
      var home = LD.place('wood');
      return dry.at === 'ridge' && wet.at === 'wood' &&
        Math.hypot(wet.x - home.x, wet.y - home.y) < 20 &&
        ('맑으면 산등성이 · 비 오면 숲 어귀(집)');
    });

    t('주민 — 여행자는 밤에만 나타난다', function () {
      var day = NP.posAt('npc_stranger', atT(13), 'clear');
      var night = NP.posAt('npc_stranger', atT(23), 'clear');
      return day === null && night !== null && NP.isNight(atT(23)) &&
        NP.isNight(atT(13)) === false &&
        ('낮 13시 없음 · 밤 23시 ' + night.at + ' 에 있다');
    });

    t('주민 — 열 사람이 한 점에 겹치지 않는다', function () {
      /* 같은 자리에 서는 사람들이 한 점에 포개지면 마을이 아니라 인형 무더기다 */
      var i, j, pts = [], min = 1e9;
      for (i = 0; i < NP.PEOPLE.length; i++) {
        var q = NP.posAt(NP.PEOPLE[i], atT(9), 'clear');
        if (q) { pts.push(q); }
      }
      for (i = 0; i < pts.length; i++) {
        for (j = i + 1; j < pts.length; j++) {
          min = Math.min(min, Math.hypot(pts[i].x - pts[j].x, pts[i].y - pts[j].y));
        }
      }
      return pts.length === 9 && min > 2 &&
        ('9시에 아홉 사람 · 가장 가까운 둘이 ' + Math.round(min) + 'm');
    });

    t('주민 — LOD 가 거리로 갈린다', function () {
      /* PLAN 15절: 0~20 고품질 · 20~50 단순 · 50~100 저비용 · 100m~ 정지 */
      var tags = [5, 30, 80, 300].map(function (d) { return NP.lod(d).tag; });
      return tags.join('/') === 'high/simple/cheap/off' &&
        NP.lod(300).ms < 0 && NP.lod(5).ms === 0 &&
        ('5·30·80·300m → ' + tags.join(' · '));
    });

    t('주민 — 말이 역할·시각·천후를 따라 갈린다', function () {
      var d = NP.say('npc_bandit', atT(13), 'clear');
      var n = NP.say('npc_bandit', atT(23), 'clear');
      var r = NP.say('npc_bandit', atT(13), 'rain');
      var all = NP.PEOPLE.every(function (p) { return !!NP.say(p, atT(13), 'clear'); });
      return all && d !== n && n !== r && d !== r &&
        ('도적 두목 낮/밤/비 세 마디가 다 다르다 · 열 사람 다 할 말이 있다');
    });

    t('주민 — 땅을 끄면 사람도 사라진다', function () {
      /* 주민은 이 땅의 이름난 자리에 산다 — 땅이 없으면 설 자리가 없다 */
      var pos = { x: 24, y: 24 };
      var onN = NP.live(pos, atT(10)).length;
      NP.reset();
      C.setTune('land.on', 0);
      var offN = NP.live(pos, atT(10)).length;
      C.setTune('land.on', null);
      NP.reset();
      var backN = NP.live(pos, atT(10)).length;
      NP.reset();
      return onN > 0 && offN === 0 && backN === onN &&
        ('땅 켜짐 ' + onN + '명 · 꺼짐 ' + offN + '명');
    });

    t('주민 — 판정에 한 칸도 안 닿는다', function () {
      /* 주민은 스폰이 아니다 — 잡히지도, 세이브에 남지도 않는다 */
      var before = JSON.stringify(C.save);
      var sp0 = JSON.stringify(W.spawns.map(function (s) { return s.uid; }));
      NP.live({ x: 24, y: 24 }, atT(9));
      NP.posAt('npc_smith', atT(15), 'clear');
      NP.say('npc_elder', atT(9), 'clear');
      NP.reset();
      var sp1 = JSON.stringify(W.spawns.map(function (s) { return s.uid; }));
      return JSON.stringify(C.save) === before && sp0 === sp1 &&
        '세이브 · 스폰 목록 그대로';
    });

    /* ── 짐승 (animal) — 들·강의 다섯 종 ────────────────────
     * 주민과 다른 점 하나: **나를 보고 움직인다**. 그 반응도 순수 함수로 두었으므로
     * ("사슴 앞 20m 에 서면 어디로 물러나나") 값으로 다 볼 수 있다.
     */

    var AN = DG.animal;

    t('짐승 — 다섯 종이 무리로 산다', function () {
      var kinds = Object.keys(AN.KINDS);
      var acts = kinds.map(function (k) { return AN.KINDS[k].act || '-'; });
      var bad = AN.HERDS.filter(function (hd) {
        return !AN.KINDS[hd.kind] || !LD.place(hd.from) || !LD.place(hd.to);
      });
      return kinds.length === 5 && bad.length === 0 && AN.all().length >= 20 &&
        acts.indexOf('flee') >= 0 && acts.indexOf('chase') >= 0 && acts.indexOf('fly') >= 0 &&
        (kinds.length + '종 · 무리 ' + AN.HERDS.length + ' · 모두 ' + AN.all().length +

    /* ── 사건 (event) — 걷다가 만나는 열 가지 ────────────────
     * 앞의 셋(땅·주민·짐승)과 달리 **이것은 판정에 닿는다**. 그래서 보는 것이 둘이다:
     *   ① 값을 내는 함수는 세이브를 **안 만진다**(candidates·resolve)
     *   ② 세이브가 바뀌는 곳은 `apply` 하나뿐이고, 바뀐 만큼만 바뀐다
     */

    var EV = DG.event;
    function ctxOf(o) {
      return { tx: 0, ty: 0, kind: o.kind || null, mark: o.mark || null,
               night: !!o.night, weather: o.weather || 'clear', t: atT(o.h === undefined ? 13 : o.h) };
    }

    t('사건 — 열 가지에 적 셋이 걸려 있다', function () {
      /* PLAN 46절이 바라는 것은 **열 가지**다. 그 위에 PHASE 10 이
         **비에만 나는 것** 하나를 얹었다(21절 "특정 이벤트 발생") — 그래서 열하나다 */
      var foes = {}, i, ev, bad = [], wet = 0;
      for (i = 0; i < EV.EVENTS.length; i++) {
        ev = EV.EVENTS[i];
        if (ev.foe) { foes[ev.foe] = 1; }
        if (ev.wet) { wet++; }
        if (!ev.choices || ev.choices.length < 2) { bad.push(ev.id + ' 선택지 부족'); }
        if (!EV.FOES[ev.foe] && ev.foe) { bad.push(ev.id + ' 모르는 적 ' + ev.foe); }
      }
      return EV.EVENTS.length >= 10 && Object.keys(foes).length === 3 &&
        bad.length === 0 && wet === 1 &&
        ('사건 ' + EV.EVENTS.length + '(그중 비 전용 ' + wet + ') · 적 ' +
         Object.keys(foes).join('/') + ' · 모든 사건에 고를 것이 둘 이상');
    });

    t('사건 — 표식 위에서만 나는 것이 있다', function () {
      /* 비문은 사당에서, 지도 조각은 폐허에서 — 아무 데서나 나면 발견이 아니다 */
      function ids(c) { return EV.candidates(c).map(function (x) { return x.ev.id; }); }
      var atShrine = ids(ctxOf({ kind: 'forest', mark: 'shrine' }));
      var atRuin = ids(ctxOf({ kind: 'grass', mark: 'ruin' }));
      var plain = ids(ctxOf({ kind: 'forest' }));
      return atShrine.indexOf('stone_text') >= 0 && plain.indexOf('stone_text') < 0 &&
        atRuin.indexOf('map_scrap') >= 0 && plain.indexOf('map_scrap') < 0 &&
        ('사당 → 비문 · 폐허 → 지도 조각 · 그냥 숲에서는 둘 다 안 난다');
    });

    t('사건 — 밤낮이 갈린다', function () {

    t('날씨 — 비가 오면 강물이 분다 (PLAN 21절)', function () {

      var before = PF.tier().key;
      var i;
      for (i = 0; i < 40; i++) { PF.tick(1.0); }   // 1fps 짜리 프레임 마흔 번
      var after = PF.tier().key;
      PF.reset();
      return before === 'HIGH' && after === 'HIGH' && 'DG_NO_DRAW 면 tick 이 아무 일도 안 한다';
    });

    t('성능 — 판정에 한 칸도 안 닿는다', function () {
      var before = JSON.stringify(C.save);
      PF.set('LOW'); PF.mul('sky'); PF.stats(); PF.reset();
      return JSON.stringify(C.save) === before && '세이브 그대로';
    });

    /* ── 모바일 (PHASE 13) ──────────────────────────────────
     * 등급 셋은 PHASE 12 가 만들었다. 여기서 채운 것은 **켤 때 기기를 보고 시작
     * 등급을 고르는 것**(27절 "기기 성능을 자동 감지")과 **돌려 보기**(7·26절)다.
     */

    t('모바일 — 기기를 보고 시작 등급을 고른다', function () {
      var pc = PF.score({ cores: 12, mem: 16, w: 2560, h: 1440, dpr: 1, touch: false });
      var mid = PF.score({ cores: 6, mem: 4, w: 1920, h: 1080, dpr: 1, touch: false });
      var phone = PF.score({ cores: 4, mem: 4, w: 390, h: 844, dpr: 3, touch: true });
      var old = PF.score({ cores: 2, mem: 2, w: 360, h: 640, dpr: 3, touch: true });
      var t2 = [pc, mid, phone, old].map(PF.tierOfScore);
      return pc > mid && mid > phone && phone > old &&
        t2[0] === 0 && t2[3] === 2 &&
        ('PC ' + pc + '점→' + PF.TIERS[t2[0]].key + ' · 노트북 ' + mid + '→' +
         PF.TIERS[t2[1]].key + ' · 폰 ' + phone + '→' + PF.TIERS[t2[2]].key +
         ' · 낡은 폰 ' + old + '→' + PF.TIERS[t2[3]].key);
    });

    t('모바일 — 같은 사양이어도 터치 기기를 한 단 낮게 본다', function () {
      var o = { cores: 8, mem: 8, w: 1280, h: 720, dpr: 1 };
      var desk = PF.score({ cores: 8, mem: 8, w: 1280, h: 720, dpr: 1, touch: false });
      var touch = PF.score({ cores: 8, mem: 8, w: 1280, h: 720, dpr: 1, touch: true });
      return desk === touch + 1 && ('같은 사양 — 데스크톱 ' + desk + ' · 터치 ' + touch);
    });

    t('모바일 — 모르는 값은 깎지 않는다', function () {
      /* `deviceMemory` 는 크롬 계열만 알려 준다. 모른다고 낮게 보면
         사파리(아이폰)가 늘 LOW 로 시작한다 */
      var known = PF.score({ cores: 8, mem: 8, w: 390, h: 844, dpr: 3, touch: true });
      var unknown = PF.score({ cores: 8, mem: 0, w: 390, h: 844, dpr: 3, touch: true });
      return unknown >= known - 1 &&
        ('메모리를 아는 기기 ' + known + '점 · 모르는 기기 ' + unknown + '점');
    });

    t('모바일 — 그릴 픽셀이 많으면 깎는다', function () {
      var small = PF.score({ cores: 8, mem: 8, w: 1280, h: 720, dpr: 1, touch: false });
      var retina = PF.score({ cores: 8, mem: 8, w: 1440, h: 900, dpr: 2, touch: false });
      return small > retina && ('720p ' + small + '점 · 레티나 ' + retina + '점');
    });

    t('모바일 — 사람이 시작 등급을 못박을 수 있다', function () {
      PF.reset();
      C.setTune('perf.startTier', 'LOW');
      var forced = C.tuned('perf.startTier', '');
      C.setTune('perf.startTier', null);
      PF.reset();
      return forced === 'LOW' && C.tuned('perf.startTier', '') === '' &&
        'perf.startTier 로 기기 감지를 건너뛴다';
    });

    t('모바일 — 돌려 보면 카메라가 나를 축으로 돈다', function () {
      /* PLAN 7·26절. 돌려도 **내가 화면 한가운데** 남아야 한다 */
      var pos = { x: 0, y: 0 };
      var f = R3.camAim(pos, 2, null, null, 1, false, 0);
      var q = R3.camAim(pos, 2, null, null, 1, false, Math.PI / 2);
      var h = R3.camAim(pos, 2, null, null, 1, false, Math.PI);
      function d(a) { return Math.hypot(a.pos.x - pos.x, a.pos.z - pos.y); }
      return Math.abs(d(f) - d(q)) < 0.001 && Math.abs(d(f) - d(h)) < 0.001 &&
        Math.abs(q.pos.x) > 1 && Math.abs(f.pos.x) < 0.001 &&
        Math.abs(h.pos.z + f.pos.z) < 0.001 &&
        ('거리 ' + Math.round(d(f)) + 'm 그대로 · 0°/90°/180° 로 자리만 돈다');
    });

    t('모바일 — 무대에서는 안 돌아간다', function () {
      /* 조우 무대는 어느 시점에서 열었든 같은 그림이어야 한다(예전부터의 규칙) */
      var pos = { x: 0, y: 0 }, st = { x: 40, y: 0, h: 3.2 };
      var a = R3.camAim(pos, 2, null, st, 1, false, 0);
      var b2 = R3.camAim(pos, 2, null, st, 1, false, Math.PI / 2);
      return a.pos.x === b2.pos.x && a.pos.z === b2.pos.z && '무대는 돌려도 같다';
    });

    /* ── 후처리 (post3d) — 톤매핑·블룸·색보정 ────────────────
     * 그래픽 보강 16~18절. 화면 층이라 **눈으로 볼 수밖에 없는 것**이 많지만,
     * 처방을 내는 함수를 순수하게 갈라 두었으므로 여기서는 그 처방을 값으로 본다.
     * (셰이더가 실제로 무엇을 그렸는지는 `_demo.html#3d,night` 과 `#nopost` 를
     *  나란히 찍어 눈으로 본다 — 실제로 그렇게 해서 두 번 고쳤다)
     */

    var PS = DG.post3d;

    t('후처리 — 문턱 아래는 안 번지고 위는 번진다 (18절)', function () {
      /* "강한 빛에만 Bloom" 이 지켜지는지. 이 판에서 0.9 위로 가는 것은
         등롱 전구·후광·빛기둥·가산 혼합 검기뿐이다 */
      var dark = PS.soft(0.30, 0.9, 0.45);
      var lit = PS.soft(0.70, 0.9, 0.45);
      var bulb = PS.soft(1.20, 0.9, 0.45);
      var beam = PS.soft(2.50, 0.9, 0.45);
      return dark === 0 && lit > 0 && lit < 0.2 && bulb > lit && beam > bulb &&
        ('그늘 0.3→' + dark.toFixed(3) + ' · 햇빛 든 지붕 0.7→' + lit.toFixed(3) +
         ' · 전구 1.2→' + bulb.toFixed(3) + ' · 빛기둥 2.5→' + beam.toFixed(3));
    });

    t('후처리 — 문턱이 무릎으로 부드럽게 열린다', function () {
      /* 딱 잘라내면 밝기가 조금 흔들릴 때 화소가 문턱을 넘나들며 껌뻑인다 */
      var soft = PS.soft(0.75, 0.9, 0.45);
      var hard = PS.soft(0.75, 0.9, 0);
      return soft > 0 && hard === 0 &&
        ('무릎 0.45 → ' + soft.toFixed(4) + ' · 무릎 0 → 딱 끊긴다');
    });

    t('후처리 — 밤이 낮보다 더 번지고 색은 덜 만진다', function () {
      var day = PS.lookAt(0.9, 'clear');
      var night = PS.lookAt(-0.5, 'clear');
      /* **색보정은 속삭이는 세기다** — ACES 로 세게 걸었다가 밤 화면을
         망가뜨린 그 교훈. 채도·색온도가 크게 움직이면 여기서 걸린다 */
      return night.bloom > day.bloom * 1.4 && Math.abs(day.sat - 1) < 0.05 &&
        Math.abs(night.sat - 1) < 0.12 && Math.abs(night.temp) < 0.25 &&
        night.temp < 0 && day.exposure === 1 &&
        ('블룸 낮 ' + day.bloom.toFixed(2) + ' → 밤 ' + night.bloom.toFixed(2) +
         ' · 밤 채도 ' + night.sat.toFixed(2) + ' 색온도 ' + night.temp.toFixed(2));
    });

    t('후처리 — 노을은 따뜻하고 밤은 차갑다', function () {
      var gold = PS.lookAt(0.10, 'clear');
      var night = PS.lookAt(-0.6, 'clear');
      return gold.temp > 0 && night.temp < 0 && gold.sat > night.sat &&
        ('노을 색온도 +' + gold.temp.toFixed(2) + ' · 밤 ' + night.temp.toFixed(2));
    });

    t('후처리 — 안개 낀 날은 덜 번진다', function () {
      /* 안개는 이미 뿌옇다 — 번짐을 더하면 형체가 사라진다 */
      var clear = PS.lookAt(0.9, 'clear');
      var fog = PS.lookAt(0.9, 'fog');
      var rain = PS.lookAt(0.9, 'rain');
      return fog.bloom < clear.bloom && rain.bloom > clear.bloom &&
        ('맑음 ' + clear.bloom.toFixed(2) + ' · 안개 ' + fog.bloom.toFixed(2) +
         ' · 비 ' + rain.bloom.toFixed(2) + '(젖은 빛은 더 번진다)');
    });

    t('후처리 — LOW 등급에서는 통째로 안 건다 (28절)', function () {
      var hi = PS.plan({ tier: 'HIGH', alt: 0.9, w: 900, h: 700 });
      var md = PS.plan({ tier: 'MEDIUM', alt: 0.9, w: 900, h: 700 });
      var lo = PS.plan({ tier: 'LOW', alt: 0.9, w: 900, h: 700 });
      return hi.on === true && md.on === true && lo.on === false &&
        hi.bloom.mips.length > md.bloom.mips.length && lo.bloom.mips.length === 0 &&
        hi.msaa > md.msaa && md.msaa > 0 && lo.msaa === 0 &&
        md.scale < hi.scale &&
        ('층 ' + hi.bloom.mips.length + '/' + md.bloom.mips.length + '/0 · ' +
         '표본 ' + hi.msaa + '/' + md.msaa + '/0 · 배율 ' + hi.scale + '/' + md.scale);
    });

    t('후처리 — 등급표와 perf 가 같은 것을 말한다', function () {
      /* 두 곳에 적으면 어긋난다. `perf.postOk()` 가 곧 `TIER_POST[등급].post` 다 */
      PF.reset();
      var high = PF.postOk();
      PF.set('LOW');
      var low = PF.postOk();
      PF.reset();
      return high === true && low === false &&
        !!PS.TIER_POST.HIGH.post === high && !!PS.TIER_POST.LOW.post === low &&
        'HIGH 는 걸고 LOW 는 안 건다 — perf 와 post3d 가 한 말';
    });

    t('후처리 — 손잡이를 내리면 예전 화면 그대로다', function () {
      C.setTune('post3d.on', 0);
      var off = PS.plan({ tier: 'HIGH', alt: 0.9, w: 900, h: 700 });
      C.setTune('post3d.on', null);
      var on = PS.plan({ tier: 'HIGH', alt: 0.9, w: 900, h: 700 });
      return off.on === false && off.tone === 'canvas' && on.on === true &&
        'post3d.on=0 → 렌더 타깃을 안 거친다(톤매핑만 남는다)';
    });

    t('후처리 — 블룸만 따로 끌 수 있다', function () {
      C.setTune('post3d.bloom', 0);
      var nb = PS.plan({ tier: 'HIGH', alt: 0.9, w: 900, h: 700 });
      C.setTune('post3d.bloom', null);
      return nb.on === true && nb.bloom.on === false && nb.bloom.mips.length === 0 &&
        'post3d.bloom=0 → 색보정만 남는다';
    });

    t('후처리 — 층 크기는 절반씩 줄고 너무 작아지면 멈춘다', function () {
      var big = PS.mipSizes(1600, 1200, 4);
      var tiny = PS.mipSizes(40, 30, 6);
      return big.length === 4 && big[0].w === 800 && big[3].w === 100 &&
        tiny.length < 6 &&
        ('1600×1200 → ' + big.map(function (m) { return m.w + 'x' + m.h; }).join(' ') +
         ' · 40×30 은 ' + tiny.length + '층에서 멈춘다');
    });

    t('후처리 — 창이 아주 작아도 안 터진다', function () {
      var p = PS.plan({ tier: 'HIGH', alt: 0.9, w: 4, h: 3 });
      return p.w >= 1 && p.h >= 1 && p.bloom.mips.length === 0 &&
        ('4×3 → ' + p.w + 'x' + p.h + ' · 블룸 층 없음(끄는 편이 낫다)');
    });

    /* ── 소품 에셋 (prop3d) ─ 진짜 나무가 선다 ────────
     * GLB 를 받는 것은 값으로 못 본다. **어느 자리에 어느 파일이 서나**만 본다.
     */
    var PR = DG.prop3d;

    t('에셋 — 나무·바위·풀에 진짜 모델이 걸려 있다 (STEP 4)', function () {
      var u = PR.urls();
      var kinds = ['tree', 'pine', 'rock', 'grass'].filter(function (k) {
        return !!PR.pick(k, 0, 0, 'all');
      });
      return kinds.length === 4 && u.length >= 12 &&
        (kinds.join(' · ') + ' — 파일 ' + u.length + '개');
    });

    t('에셋 — 같은 자리에는 늘 같은 모양이 선다 (좌표 해시)', function () {
      var a = PR.pick('tree', 3, 5, 'all'), b2 = PR.pick('tree', 3, 5, 'all');
      var c2 = PR.pick('tree', 4, 5, 'all');
      /* 자리가 다르면 대개 다른 모양이다 — 몇 자리를 훑어 실제로 갈리는지 본다 */
      var seen = {}, i;
      for (i = 0; i < 30; i++) { seen[PR.pick('tree', i, 0, 'all')] = 1; }
      return a === b2 && Object.keys(seen).length > 1 &&
        ('같은 자리 두 번 물어 같다 · 서른 자리에 ' +
         Object.keys(seen).length + '가지가 섞인다');
    });

    t('에셋 — 철마다 다른 나무가 선다 (가을 단풍 · 겨울 눈)', function () {
      var s = PR.pick('tree', 0, 0, 'all');
      var au = PR.pick('tree', 0, 0, 'autumn');
      var wi = PR.pick('tree', 0, 0, 'winter');
      return au.indexOf('Autumn') > 0 && wi.indexOf('Snow') > 0 && s !== au && s !== wi &&
        ('여름 ' + s.split('/').pop() + ' · 가을 ' + au.split('/').pop() +
         ' · 겨울 ' + wi.split('/').pop());
    });

    t('에셋 — 철에 제 것이 없으면 기본으로 돌아간다', function () {
      /* 바위는 철을 안 탄다 — 가을에도 같은 바위다 */
      return PR.pick('rock', 2, 2, 'autumn') === PR.pick('rock', 2, 2, 'all') &&
        '바위는 철을 안 탄다';
    });

    /* ── 땅의 높낮이 (relief3d) ─ PLAN 14절 ──────────────
     * 값을 내는 함수만 본다(three 없이 돈다). **판정에는 한 줄도 안 닿는다** —
     * 스폰·거리를 견주는 항목들이 그대로 만점인 것이 그 증거다.
     */
    var RF = DG.relief3d;

    t('땅 — 종류마다 높이가 다르다 (산은 솟고 강은 파인다)', function () {
      var L = RF.LEVEL;
      return L.mount > L.forest && L.forest > L.grass && L.grass > L.road &&
        L.farm < 0 && L.water < L.farm &&
        ('산 ' + L.mount + ' > 숲 ' + L.forest + ' > 들 ' + L.grass +
         ' > 길 ' + L.road + ' > 논 ' + L.farm + ' > 물 ' + L.water);
    });

    t('땅 — 산은 이웃을 보고 정해진다 (외딴 칸은 언덕)', function () {
      /* 이 판의 산 격자는 해시로 흩어져 있어 한 칸씩 외따로 서는 일이 흔하다.
         그것을 다 16m 로 솟구치면 산맥이 아니라 **압정밭**이 된다 */
      var W = DG.world;
      var lone = null, deep = null, gx, gy;
      for (gx = -40; gx <= 40 && (!lone || !deep); gx++) {
        for (gy = -40; gy <= 40 && (!lone || !deep); gy++) {
          if (W.terrainAt(gx, gy) !== 'mount') { continue; }
          var n = 0, dx, dy;
          for (dy = -1; dy <= 1; dy++) {
            for (dx = -1; dx <= 1; dx++) {
              if (W.terrainAt(gx + dx, gy + dy) === 'mount') { n++; }
            }
          }
          if (n <= 2 && !lone) { lone = RF.levelAt(gx, gy); }
          if (n >= 5 && !deep) { deep = RF.levelAt(gx, gy); }
        }
      }
      if (lone === null || deep === null) { return '표본 부족 — 건너뜀'; }
      return deep > lone &&
        ('외딴 산 ' + lone.toFixed(1) + 'm < 이어진 산 ' + deep.toFixed(1) + 'm');
    });

    t('땅 — 사람이 만든 자리는 평평하다 (집이 기울면 안 된다)', function () {
      /* 마을·길·논밭에 잔무늬를 넣으면 집이 기울고 길이 물결친다.
         같은 종류 격자를 여럿 훑어 **높이가 한 값인지** 본다 */
      var W = DG.world;
      var seen = {}, gx, gy, bad = [];
      for (gx = -30; gx <= 30; gx++) {
        for (gy = -30; gy <= 30; gy++) {
          var k = W.terrainAt(gx, gy);
          if (k !== 'town' && k !== 'road' && k !== 'farm') { continue; }
          var v = RF.levelAt(gx, gy).toFixed(4);
          if (!seen[k]) { seen[k] = v; }
          else if (seen[k] !== v) { bad.push(k); }
        }
      }
      return bad.length === 0 && Object.keys(seen).length >= 2 &&
        (Object.keys(seen).sort().join(' · ') + ' — 종류마다 한 값');
    });

    t('땅 — 격자 경계에서 안 꺾인다 (종이접기 방지)', function () {
      /* 선형으로 이으면 칸 경계마다 꺾여 종이접기처럼 보인다.
         경계를 가로지르며 **기울기의 변화**가 급하지 않은지 본다 */
      var x0 = 0, z = 24, i, prev = null, worst = 0;
      for (i = 0; i <= 60; i++) {
        var x = x0 + i * 1.6;
        var d = RF.heightAt(x + 0.8, z) - RF.heightAt(x - 0.8, z);
        if (prev !== null) { worst = Math.max(worst, Math.abs(d - prev)); }
        prev = d;
      }
      /* 1.6m 를 걸을 때 기울기가 튀는 정도 — 꺾이면 여기서 확 뛴다 */
      return worst < 0.5 && ('기울기 변화 최대 ' + worst.toFixed(3));
    });

    t('땅 — 손잡이를 내리면 판이 평평해진다', function () {
      C.setTune('relief3d.on', 0);
      RF.reset();
      var flat = RF.heightAt(120, 240) === 0 && RF.heightAt(-500, 77) === 0;
      C.setTune('relief3d.on', null);
      RF.reset();
      return flat && RF.heightAt(120, 240) !== 0 &&
        'relief3d.on = 0 → 어디서나 0';
    });

    t('땅 — 세기를 손잡이로 조절한다', function () {
      RF.reset();
      var one = RF.heightAt(96, 96);
      C.setTune('relief3d.amp', 2);
      var two = RF.heightAt(96, 96);
      C.setTune('relief3d.amp', null);
      RF.reset();
      return Math.abs(two - one * 2) < 1e-9 &&
        ('amp 2 → ' + one.toFixed(2) + 'm 가 ' + two.toFixed(2) + 'm 로');
    });

    t('아이콘 — UI 그림이 표에 다 있다 (없으면 이모지로 남는다)', function () {
      /* 이모지는 **폰트가 그리는 것**이라 기기마다 다르게 보인다 —
         같은 화면이 아이폰·안드로이드·윈도우에서 셋으로 갈린다. UI 크롬만
         실제 아이콘(Lucide, ISC)으로 바꿨다 */
      var I = DG.icon;

      var A = DG.asset3d;
      function hue(hex) {
        var r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255,
            bl = parseInt(hex.slice(5, 7), 16) / 255;
        var mx = Math.max(r, g, bl), mn = Math.min(r, g, bl), d = mx - mn, hh = 0;
        if (d === 0) { return 0; }

        else { hh = (r - g) / d + 4; }
        return hh / 6;
      }
      function gap(a, b2) { var d = Math.abs(hue(a) - hue(b2)); return Math.min(d, 1 - d); }

        for (ry = 0; ry < 6; ry++) {
          var ft = { key: 'F' + rx + ',' + ry, rx: rx, ry: ry };
          seen[F.tierOf(ft).tier] = 1;
          fac[F.factionNameOf(ft)] = 1;
        }
      }
      var one = { key: 'F2,3', rx: 2, ry: 3 };
      return Object.keys(seen).length === 3 && Object.keys(fac).length >= 2 &&
        F.tierOf(one).tier === F.tierOf(one).tier &&
        F.factionNameOf(one) === F.factionNameOf(one) &&
        ('서른여섯 곳에 등급 셋 · 세력 ' + Object.keys(fac).length + '가지');
    });

    /* ── 물 (water3d) ─ 수면이 실제로 움직인다 ─────────
     * 셰이더는 값으로 못 본다. **때·천후가 물결과 윤슬을 어떻게 바꾸나**만 본다.
     */
    var WA = DG.water3d;

    t('물 — 등급이 LOW 면 통째로 잠든다 (옛 판 한 장으로) (12절)', function () {
      var hi = WA.plan({ tier: 'HIGH', alt: 0.8, weather: 'clear' });
      var lo = WA.plan({ tier: 'LOW', alt: 0.8, weather: 'clear' });
      return hi.on === true && hi.wave > 0 && lo.on === false && lo.wave === 0 &&
        ('HIGH 결 ' + hi.wave + ' → LOW 결 ' + lo.wave);
    });

    t('물 — 비가 오면 잘게 일고 덜 비친다', function () {
      var c = WA.plan({ tier: 'HIGH', alt: 0.8, weather: 'clear' });
      var r = WA.plan({ tier: 'HIGH', alt: 0.8, weather: 'rain' });
      return r.wave > c.wave && r.ripple === 1 && c.ripple === 0 &&
        r.glint < c.glint && r.sky < c.sky &&
        ('맑음 결 ' + c.wave + ' → 비 ' + r.wave + ' · 잔결 1 · 하늘섞임 ' +
         c.sky + '→' + r.sky);
    });

    t('물 — 눈 오는 날은 가라앉고 바람 부는 날은 인다', function () {
      var c = WA.plan({ tier: 'HIGH', alt: 0.8, weather: 'clear' });
      var s = WA.plan({ tier: 'HIGH', alt: 0.8, weather: 'snow' });
      var w = WA.plan({ tier: 'HIGH', alt: 0.8, weather: 'wind' });
      return s.wave < c.wave && w.wave > c.wave &&
        ('눈 ' + s.wave + ' < 맑음 ' + c.wave + ' < 바람 ' + w.wave);
    });

    t('물 — 밤에는 윤슬이 잦아든다', function () {
      var day = WA.plan({ tier: 'HIGH', alt: 0.9, weather: 'clear' });
      var night = WA.plan({ tier: 'HIGH', alt: -0.6, weather: 'clear' });
      return night.glint < day.glint * 0.4 && night.wave < day.wave &&
        ('낮 윤슬 ' + day.glint + ' → 밤 ' + night.glint);
    });

    t('물 — 노을이 한낮보다 반짝이되 불길이 되지는 않는다', function () {
      /* 처음에 노을 보정을 크게 잡았다가 강이 타는 것처럼 보였다 —
         한낮보다는 세되 **곱절을 넘지 않는다** 를 여기 못박아 둔다 */
      var noon = WA.plan({ tier: 'HIGH', alt: 0.95, weather: 'clear' });
      var dusk = WA.plan({ tier: 'HIGH', alt: 0.16, weather: 'clear' });
      return dusk.glint > noon.glint && dusk.glint < noon.glint * 2 &&
        ('한낮 ' + noon.glint + ' → 노을 ' + dusk.glint + ' (곱절 미만)');
    });

    t('물 — 손잡이를 내리면 재질을 안 준다', function () {
      C.setTune('water3d.on', 0);
      var off = WA.plan({ tier: 'HIGH' }).on === false && WA.material(null, 0) === null;
      C.setTune('water3d.on', null);
      return off && WA.plan({ tier: 'HIGH' }).on === true &&
        'water3d.on=0 → 옛 Lambert 판으로 돌아간다';
    });

    /* ── 그늘 (ssao3d) ─ 맞닿은 자리가 어두워진다 ────────
     * 17절 여섯 가지 중 마지막. 여기서도 **처방**만 본다.
     */
    var AO = DG.ssao3d;

    t('그늘 — 등급마다 표본 수가 갈리고 LOW 는 안 잰다 (17절 6번)', function () {
      var hi = AO.plan({ tier: 'HIGH', w: 900, h: 700 });
      var md = AO.plan({ tier: 'MEDIUM', w: 900, h: 700 });
      var lo = AO.plan({ tier: 'LOW', w: 900, h: 700 });
      return hi.on && md.on && !lo.on && hi.samples > md.samples && lo.samples === 0 &&
        ('HIGH ' + hi.samples + '표본 · MEDIUM ' + md.samples + ' · LOW 안 잼');
    });

    t('그늘 — 절반 크기로 재고 흐린다 (값싼 쪽)', function () {
      var p = AO.plan({ tier: 'HIGH', w: 900, h: 700 });
      return p.w === 450 && p.h === 350 && p.scale === 0.5 &&
        ('900x700 → ' + p.w + 'x' + p.h);
    });

    t('그늘 — 창이 아주 작으면 아예 안 잰다', function () {
      var p = AO.plan({ tier: 'HIGH', w: 20, h: 16 });
      return p.on === false && p.w === 0 &&
        '20x16 → 흐리기가 화면을 넘어가므로 끈다';
    });

    t('그늘 — 손잡이로 표본 수를 못박을 수 있다', function () {
      C.setTune('ssao3d.samples', 6);
      var p = AO.plan({ tier: 'HIGH', w: 900, h: 700 });
      C.setTune('ssao3d.samples', null);
      return p.samples === 6 && AO.plan({ tier: 'HIGH', w: 900, h: 700 }).samples === 12 &&
        '6 으로 못박았다 놓으면 12 로 돌아온다';
    });

    t('그늘 — 손잡이를 내리면 통째로 잠든다', function () {
      C.setTune('ssao3d.on', 0);
      var off = AO.plan({ tier: 'HIGH', w: 900, h: 700 }).on === false;
      C.setTune('ssao3d.on', null);
      return off && AO.plan({ tier: 'HIGH', w: 900, h: 700 }).on === true &&
        'ssao3d.on=0 → 깊이 텍스처도 안 붙는다';
    });

    t('후처리 — 그늘이 켜지면 처방이 그것을 싣고 온다', function () {
      var hi = PS.plan({ tier: 'HIGH', alt: 0.9, w: 900, h: 700 });
      var lo = PS.plan({ tier: 'LOW', alt: 0.9, w: 900, h: 700 });
      return hi.ao && hi.ao.on === true && lo.ao && lo.ao.on === false &&
        ('HIGH 그늘 ' + hi.ao.samples + '표본 ' + hi.ao.w + 'x' + hi.ao.h + ' · LOW 없음');
    });

    /* ── 미니맵 (minimap) ─ 위에서 본 그림 한 장 ──────
     * 그리는 부분은 캔버스라 값으로 못 본다. 대신 **자리를 정하는 함수**
     * (`project`·`cells`·`blips`)만 따로 본다 — 그것들은 캔버스 없이도 돌게 둔다.
     */
    var MM = DG.minimap;
    var mmPos = { x: C.save.player.pos.x, y: C.save.player.pos.y };   // 끝나면 되돌린다
    var MMT = 1756300000000;                                          // 시각을 못박는다

    t('미니맵 — 범위 안은 그 자리, 밖은 테두리에 붙는다 (47절)', function () {
      var o = { x: 0, y: 0 };
      var inside = MM.project(o, 90, 0, 180);          // 반지름의 절반
      var far = MM.project(o, 900, 0, 180);            // 다섯 배 밖
      var me = MM.project(o, 0, 0, 180);
      return inside.edge === false && Math.abs(inside.dx - 0.5) < 1e-9 &&
        far.edge === true && Math.abs(far.dx - 1) < 1e-9 && Math.round(far.d * 180) === 900 &&
        me.dx === 0 && me.dy === 0 &&
        ('90m → 0.5 · 900m → 테두리(1.0) · 가운데는 나');
    });

    t('미니맵 — 북이 위에 온다 (y 가 세상과 같은 방향)', function () {
      var o = { x: 0, y: 0 };
      var south = MM.project(o, 0, 90, 180);           // 세상의 y+ 는 남쪽
      return south.dy > 0 && MM.project(o, 0, -90, 180).dy < 0 &&
        'y+ 는 아래(남) · y- 는 위(북)';
    });

    t('미니맵 — 바탕 칸이 판을 빈 데 없이 덮는다', function () {
      var o = { x: 0, y: 0 }, cs = MM.cells(o, 180), i, minx = 9, maxx = -9;
      for (i = 0; i < cs.length; i++) {
        if (cs[i].dx < minx) { minx = cs[i].dx; }
        if (cs[i].dx + cs[i].w > maxx) { maxx = cs[i].dx + cs[i].w; }
      }
      /* 칸이 판(-1~1)을 밖까지 덮어야 가장자리가 검게 남지 않는다 */
      return cs.length > 0 && minx <= -1 && maxx >= 1 &&
        (cs.length + '칸 · ' + minx.toFixed(2) + ' ~ ' + maxx.toFixed(2));
    });

    t('미니맵 — 칸의 지형은 world 와 같은 답이다', function () {
      var o = { x: 0, y: 0 }, cs = MM.cells(o, 180), bad = 0, i;
      for (i = 0; i < cs.length; i++) {
        if (cs[i].kind !== W.terrainAt(cs[i].tx, cs[i].ty)) { bad++; }
      }
      return bad === 0 && (cs.length + '칸 모두 world.terrainAt 와 일치');
    });

    t('미니맵 — 멀리 놓으면 더 넓게, 칸은 작게 보인다', function () {
      var o = { x: 0, y: 0 };
      var near = MM.cells(o, 180), far = MM.cells(o, 360);
      return far.length > near.length && far[0].w < near[0].w &&
        ('180m ' + near.length + '칸 → 360m ' + far.length + '칸 (한 칸 폭 ' +
         near[0].w.toFixed(2) + ' → ' + far[0].w.toFixed(2) + ')');
    });

    t('미니맵 — 걸어가서 만날 것은 범위 밖이면 지우고, 들러갈 자리는 남긴다', function () {
      var o = { x: 0, y: 0 }, bs = MM.blips(o, 180, MMT), i;
      var walkOff = 0, keepOff = 0;
      for (i = 0; i < bs.length; i++) {
        if (!bs[i].edge) { continue; }
        if (bs[i].t === 'spawn' || bs[i].t === 'special' || bs[i].t === 'npc') { walkOff++; }
        else { keepOff++; }
      }
      /* 역참은 구역마다 서니 반드시 범위 밖에도 있다 — 방향만 알려 준다 */
      return walkOff === 0 && keepOff > 0 &&
        ('테두리에 붙은 것 ' + keepOff + '개 · 조우대상·주민은 0개');
    });

    t('미니맵 — 조우 대상이 점으로 뜬다', function () {
      W.update(0.016);
      var o = { x: C.save.player.pos.x, y: C.save.player.pos.y };
      var bs = MM.blips(o, 4000, MMT);
      var pins = bs.filter(function (x) { return x.t === 'spawn' || x.t === 'special'; });
      return W.spawns.length > 0 && pins.length === W.spawns.length &&
        ('스폰 ' + W.spawns.length + '개 → 점 ' + pins.length + '개');
    });

    t('미니맵 — 주민 열 사람은 100m 밖에서도 보인다 (live 가 아니라 posAt)', function () {
      var o = { x: 0, y: 0 };
      var bs = MM.blips(o, 4000, MMT).filter(function (x) { return x.t === 'npc'; });
      return bs.length === DG.npc.PEOPLE.length &&
        (bs.length + '명 · npc.live 는 100m 밖을 재우므로 쓰지 않는다');
    });

    t('미니맵 — 숨은 자리는 가 보기 전까지 안 뜬다 (48절)', function () {
      var o = { x: 0, y: 0 }, X = DG.codex;
      X.clear();
      function caves() {
        return MM.blips(o, 4000, MMT).filter(function (x) {
          return x.t === 'place' && x.name === '이름 없는 굴';
        }).length;
      }
      var before = caves();
      X.discover('place', 'cave', { name: '이름 없는 굴' });
      var after = caves();
      X.clear();
      return before === 0 && after === 1 && '도장 찍기 전 0 → 찍은 뒤 1';
    });

    t('미니맵 — 열려 있는 자리는 처음부터 뜬다', function () {
      var o = { x: 0, y: 0 };
      DG.codex.clear();
      var open = MM.blips(o, 4000, MMT).filter(function (x) { return x.t === 'place'; });
      var shown = DG.land.places().filter(function (p) { return !p.hidden; });
      return open.length === shown.length &&
        (shown.map(function (p) { return p.name; }).join(' · '));
    });

    t('미니맵 — 판정에 한 줄도 닿지 않는다', function () {
      var o = { x: C.save.player.pos.x, y: C.save.player.pos.y };
      var before = JSON.stringify(C.save) + '|' + W.spawns.length;
      MM.blips(o, 360, MMT);
      MM.cells(o, 360);
      MM.draw();
      var after = JSON.stringify(C.save) + '|' + W.spawns.length;
      return before === after && '세이브도 스폰도 그대로';
    });

    t('미니맵 — 손잡이를 내리면 통째로 잠든다', function () {
      C.setTune('minimap.on', 0);
      var off = MM.on() === false && MM.draw() === 0 && MM.tick(1) === false;
      C.setTune('minimap.on', null);
      return off && MM.on() === true && 'minimap.on=0 → 그리지도 않는다';
    });

    t('미니맵 — 제 박자로 다시 그린다 (매 프레임이 아니다)', function () {
      MM.tick(1);                                  // 밀린 것을 한 번 비운다
      var skipped = MM.tick(0.01) === false;       // 너무 이르다
      var drew = MM.tick(1) === true;              // 박자가 찼다
      return skipped && drew && '0.16초마다 한 번';
    });

    t('미니맵 — 접고 펌을 세이브가 기억한다', function () {
      MM.reset();
      MM.set({ step: 1 });
      var far = MM.range();
      MM.set({ folded: true });
      var hid = MM.folded === true && MM.draw() === 0;
      MM.set({ folded: false, step: 0 });
      return far === MM.RANGES[1] && hid && MM.range() === MM.RANGES[0] &&
        (MM.RANGES[0] + 'm ↔ ' + MM.RANGES[1] + 'm · 접으면 그리기도 멈춘다');
    });

    C.save.player.pos.x = mmPos.x; C.save.player.pos.y = mmPos.y;

    /* ── 말 걸기 (talk) — 주민·짐승을 눌러 본다 ─────────────
     * 이 축은 **조우 판정에 손을 댄다**. 그래서 여기서 가장 중요한 것은
     * "기존에 잡히던 것이 그대로 잡히는가" 다.
     */

    var TK = DG.talk;

    t('말 걸기 — 스폰 판정이 한 치도 안 밀렸다', function () {
      /* 이 축은 조우 판정에 손을 댄 유일한 자리다. 눌러서 잡히던 것이 그대로
         잡히는지부터 본다 — `talk` 는 `onClick` 의 **`!best` 안쪽**에 있으므로,
         스폰이 잡히는 한 불리지도 않는다 */
      var pos = C.save.player.pos;
      var sp = W.spawns[0];
      var ox = sp.x, oy = sp.y;
      sp.x = pos.x + 6; sp.y = pos.y + 6;
      var n = W.nearest();
      sp.x = ox; sp.y = oy;
      return !!n && n.spawn.uid === sp.uid && n.inRange === true &&
        ('코앞의 스폰을 그대로 집는다 (uid ' + n.spawn.uid + ' · ' +
         Math.round(n.dist) + 'm · 사거리 안)');
    });

    t('말 걸기 — 누른 자리에서 가장 가까운 쪽을 고른다', function () {
      NP.forceTime(atT(10)); NP.reset(); AN.forceTime(atT(10)); AN.reset();
      var v = LD.place('village');
      C.save.player.pos.x = v.x; C.save.player.pos.y = v.y;
      var ns = NP.live(C.save.player.pos, atT(10));
      var got = null;
      if (ns.length) { got = TK.pick(ns[0].x, ns[0].y, 20); }
      NP.forceTime(null); NP.reset(); AN.forceTime(null); AN.reset();
      C.save.player.pos.x = 0; C.save.player.pos.y = 0;
      return ns.length > 0 && got && got.kind === 'npc' &&
        ('마을 한가운데에서 주민 ' + ns.length + '명 중 하나를 집었다');
    });

    t('말 걸기 — 손잡이를 내리면 예전처럼 빈 땅이 된다', function () {
      C.setTune('talk.on', 0);
      var off = TK.pick(0, 0, 40);
      C.setTune('talk.on', null);
      return off === null && 'talk.on=0 이면 아무것도 안 집는다 → 그 자리로 걸어간다';
    });

    t('말 걸기 — 멀면 창을 안 열고 그쪽으로 걸어간다', function () {
      var r = TK.NPC_R();
      var far = { kind: 'npc', it: { dist: r + 50, x: 999, y: 999, p: NP.PEOPLE[0] } };
      var res = TK.tap(far);
      return res === 'walk' && r > 0 &&
        ('주민은 ' + r + 'm 안에서만 열린다 · 밖이면 걸어간다');
    });

    t('말 걸기 — 자리 이름의 조사가 안 어긋난다', function () {
      /* 자리가 열한 가지고 받침이 제각각이다 — 손으로 적으면 하나만 늘려도 어긋난다
         (사가국지에서 '사가국지이·사가국지을' 로 어긋났던 그 건) */
      var bad = LD.places().filter(function (p) {
        var c = p.name.charCodeAt(p.name.length - 1);
        if (!(c >= 0xac00 && c <= 0xd7a3)) { return false; }
        var jong = (c - 0xac00) % 28;
        var want = (jong === 0 || jong === 8) ? '로' : '으로';
        return DG.talk.josaRo(p.name) !== want;
      });
      return bad.length === 0 &&
        ('열한 자리 — ' + LD.places().slice(0, 3).map(function (p) {
          return p.name + DG.talk.josaRo(p.name);
        }).join(' · ') + ' …');
    });

    t('말 걸기 — 짐승은 조금 더 멀리서도 열린다', function () {
      /* 다가가면 도망가는 것이 있어서다 — 코앞까지 가야 열리면 영영 못 본다 */
      return TK.BEAST_R() > TK.NPC_R() &&
        ('주민 ' + TK.NPC_R() + 'm · 짐승 ' + TK.BEAST_R() + 'm');
    });

    t('말 걸기 — 잡히지도 설득되지도 않는다', function () {
      /* 카드에 미니게임이 없다. 세이브가 바뀌는 것은 발견 도장과 그 소액
         보상뿐이다(PLAN 49절, 2026-08-31 갱신 — 전엔 도장만 찍고 아무 것도
         안 줬다). 공적은 여전히 그대로다 — 발견은 등용·포획만큼은 안 친다 */
      CX.clear();
      var p = C.save.player;
      var g0 = p.gold, f0 = p.feat;
      var dex0 = JSON.stringify(C.save.dex || {});
      var sp0 = W.spawns.length;
      TK.tap({ kind: 'beast', it: { dist: 5, alarm: 0, kind: AN.KINDS.deer } });
      TK.close();
      var stamped = CX.has('beast', 'deer');
      CX.clear();
      return p.gold === g0 + 4 && p.feat === f0 &&
        JSON.stringify(C.save.dex || {}) === dex0 && W.spawns.length === sp0 &&
        stamped === true &&
        '공적·도감·스폰 그대로 · 발견 도장 + 소액 보상(재화 +4)만 찍힌다';
    });

    t('지면 — 이 땅의 모든 갈래에 칠할 색이 있다', function () {
      /* 색이 빠진 갈래가 있으면 그 칸만 들색으로 칠해져 조용히 어긋난다 */
      var kinds = {}, bad = [];
      LD.places();                                   // 땅을 깨운다
      var b2 = LD.bounds(), gx, gy;
      for (gy = b2.y0; gy <= b2.y1; gy++) {
        for (gx = b2.x0; gx <= b2.x1; gx++) {
          var a = LD.at(gx, gy);
          if (a) { kinds[a.kind] = 1; }
        }
      }
      var ks = Object.keys(kinds).sort();

      return gone && '앞에 세운 대상을 처리';
    });

    t('자동 — 승급 조건을 채운 인물을 올린다', function () {
      var id = 'sg_guanyu';
      var before = HR.info(id).rank;
      C.save.dex.heroes[id].count = 99;
      C.save.player.gold += 999999;
      C.save.heroes[id].lv = HR.MAX_LV;
      var did = DG.auto._autoRankUp();
      var after = HR.info(id).rank;
      return (did ? after > before : true) && ('승급 ' + before + ' → ' + after);
    });

    /* ── 가입해서 저장 ─────────────────────────────────── */

    t('세이브는 프로필 아래로 들어간다', function () {
      var A = DG.account;
      return C.SAVE_BASE === 'deungyong-go/save' &&
        C.SAVE_KEY.indexOf(C.SAVE_BASE + '/') === 0 &&
        A._store === C.SAVE_BASE + '/accounts' &&
        ('기준 ' + C.SAVE_BASE + ' · 지금 ' + C.SAVE_KEY);
    });

    t('가입 — 이름을 넣으면 프로필이 만들어지고 그 키로 갈아탄다', function () {
      var A = DG.account;
      localStorage.removeItem(A._store);
      var acc = A.create('진단이', false);
      var key = A.keyOf(acc.id);
      C.setSaveKey(key);
      C.save.player.gold = 4242;
      C.persist();
      var raw = localStorage.getItem(key);
      localStorage.removeItem(key);
      /* 프로필 id 는 시각 기반이라 실행마다 다르다 — 결과 문구에는 넣지 않는다
         (넣으면 진단 출력이 매번 달라져 "무엇이 바뀌었나" 를 눈으로 못 쫓는다) */
      return acc.name === '진단이' && A.current().id === acc.id &&
        key.indexOf(C.SAVE_BASE + '/') === 0 &&
        raw && JSON.parse(raw).player.gold === 4242 &&
        (acc.name + ' · 키는 ' + C.SAVE_BASE + '/<프로필> 아래');
    });

    t('가입 — 프로필마다 진행이 갈린다', function () {
      var A = DG.account;
      localStorage.removeItem(A._store);
      var a = A.create('갑', false), b = A.create('을', false);
      C.setSaveKey(A.keyOf(a.id));
      C.save.player.gold = 100; C.persist();
      C.setSaveKey(A.keyOf(b.id));
      C.save.player.gold = 999; C.persist();
      var ga = JSON.parse(localStorage.getItem(A.keyOf(a.id))).player.gold;
      var gb = JSON.parse(localStorage.getItem(A.keyOf(b.id))).player.gold;
      localStorage.removeItem(A.keyOf(a.id));
      localStorage.removeItem(A.keyOf(b.id));
      return ga === 100 && gb === 999 && A.list().length === 2 &&
        ('갑 ' + ga + ' · 을 ' + gb + ' (서로 안 섞인다)');
    });

    t('가입 — 옛 세이브를 첫 프로필로 이어받는다', function () {
      var A = DG.account;
      localStorage.removeItem(A._store);
      localStorage.setItem(A._legacy, JSON.stringify({ v: 1, player: { level: 7, gold: 777 } }));
      var acc = A.create('이어받기', true);
      var moved = JSON.parse(localStorage.getItem(A.keyOf(acc.id)));
      localStorage.removeItem(A._legacy);
      localStorage.removeItem(A.keyOf(acc.id));
      return A.hasLegacy() === false && moved && moved.player.gold === 777 &&
        ('Lv.' + moved.player.level + ' · 금 ' + moved.player.gold + ' 이 옮겨졌다');
    });

    t('가입 — 프로필을 지우면 그 세이브도 사라진다', function () {
      var A = DG.account;
      localStorage.removeItem(A._store);
      var a = A.create('지울사람', false);
      C.setSaveKey(A.keyOf(a.id));
      C.persist();
      var had = !!localStorage.getItem(A.keyOf(a.id));
      A.remove(a.id);
      var gone = !localStorage.getItem(A.keyOf(a.id));
      return had && gone && A.list().length === 0 && '프로필·세이브 함께 삭제';
    });

    t('가입 — 진단에서는 가입 화면을 띄우지 않는다', function () {
      /* DG_NO_ACCOUNT 가 켜져 있으면 고정 키로 바로 시작한다 (안 그러면 게임이 안 켜진다) */
      return window.DG_NO_ACCOUNT === true && !document.getElementById('acc-host') &&
        '진단 우회 동작';
    });

    t('진단의 무작위는 씨앗으로 고정된다', function () {
      /* 같은 씨앗이면 같은 수열 — 이 항목이 깨지면 위 항목들의 수치도 흔들린다 */
      return window.DG_SEED === 20260824 &&
        Math.random() >= 0 && Math.random() < 1 &&
        ('씨앗 ' + window.DG_SEED);
    });

    t('런타임 에러 없음', function () {
      return errors.length === 0 || ('에러 ' + errors.length + '건: ' + errors.join(' | ')) === '';
    });

    var failCount = out.filter(function (s) { return s.indexOf('FAIL') >= 0; }).length;
    document.getElementById('report').innerHTML =
      '<h3>사가고 자가진단 — ' + (out.length - failCount) + '/' + out.length + ' 통과</h3>' +
      out.join('<br>') +
      (errors.length ? '<br><br><b class="fail">런타임 에러</b><br>' + errors.join('<br>') : '');
    document.title = 'RESULT ' + (out.length - failCount) + '/' + out.length;
    localStorage.removeItem(C.SAVE_KEY);   // 진단 흔적 제거
  }, 400);
})();
</script>
</body>
</html>
