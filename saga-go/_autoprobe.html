<!DOCTYPE html>
<html lang="ko">
<head><meta charset="utf-8"><title>autoprobe</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<canvas id="map-ground"></canvas><canvas id="map"></canvas><div id="vignette"></div>
<div id="top">
  <div class="glass profile" id="profile"></div>
  <div class="tools">
    <button class="icon-btn" id="btn-auto">a</button>
    <button class="icon-btn" id="btn-geo">g</button>
    <button class="icon-btn" id="btn-help">h</button>
    <button class="icon-btn" id="btn-reset">r</button>
  </div>
  <div class="glass wallet" id="wallet"></div>
</div>
<div id="autobar"></div><div id="near"></div>
<nav id="dock">
  <button data-sheet="study"><span>s</span><small>s</small></button>
  <button data-sheet="dungeon"><span>g</span><small>g</small></button>
</nav>
<div id="scrim"></div>
<aside id="sheet"><div class="sheet-head"><div class="grip"></div><h3 id="sheet-title"></h3>
  <button class="icon-btn sm" id="sheet-close">x</button></div><div id="sheet-body"></div></aside>
<div id="encounter"></div><div id="detail"></div><div id="toast"></div>
<pre id="out" style="position:fixed;left:0;top:0;right:0;bottom:0;z-index:99;overflow:auto;
  background:#0b0d12;color:#cfe8d0;font:12px/1.65 Consolas,monospace;padding:12px;
  white-space:pre-wrap;margin:0"></pre>

<script>
window.onerror = function (m, f, l) {
  var o = document.getElementById('out');
  if (o) { o.textContent += '\n\nERR ' + m + ' @' + (f || '').split('/').pop() + ':' + l; }
  document.title = 'ERR ' + m;
};
</script>
<script src="js/data.js"></script>
<script src="js/data-enemy.js"></script><script src="js/data-item.js"></script>
<script src="js/data-dungeon.js"></script><script src="js/data-quiz.js"></script>
<script src="js/sprite.js"></script><script src="js/core.js"></script>
<script src="js/quiz.js"></script><script src="js/item.js"></script>
<script src="js/hero.js"></script><script src="js/world.js"></script>
<script src="js/encounter.js"></script><script src="js/dungeon.js"></script>
<script src="js/dungeon-view.js"></script><script src="js/net.js"></script>
<script src="js/ai.js"></script><script src="js/auto.js"></script>
<script src="js/ui.js"></script><script src="js/game.js"></script>
<script>
/* 자동 순행을 실제로 돌려 보는 판.
 *
 *   (기본)        살아 있는 루프(rAF)에서 자동이 무엇을 하고 있는지 화면에 쓴다.
 *                 단 **헤드리스에서는 rAF 가 거의 돌지 않아** 이 모드로는 판정이 안 된다.
 *   ?sim=600      게임 루프를 **직접** 굴린다(setTimeout 기반이라 헤드리스에서도 돈다).
 *                 600초 분량을 돌린 뒤 전/후 상태와 로그를 보고서로 찍는다.
 *   &dungeon=1    던전 순회를 켜고 돌린다 (지도 대신 던전을 돈다)
 *   &fresh=1      세이브를 지우고 맨 처음 상태에서 시작한다 (기본: 그렇게 한다)
 *   &party=3      시작 동행 수 (던전에 들어가려면 1명 이상 필요)
 *   &step=0.1     한 틱의 dt
 */
setTimeout(function () {
  var C = DG.core, out = [];
  var q = new URLSearchParams(location.search);
  var sim = parseInt(q.get('sim') || '0', 10);
  var step = parseFloat(q.get('step') || '0.1');
  var wantDungeon = q.get('dungeon') === '1';
  var partyN = parseInt(q.get('party') || '0', 10);

  function say(s) { out.push(s); document.getElementById('out').textContent = out.join('\n'); }
  function fmtN(n) { return C.fmt(Math.round(n)); }
  function dexCount(k) { return Object.keys(C.save.dex[k]).length; }

  if (!sim) {
    /* 살아 있는 루프 관찰 모드 */
    C.save.items.scroll = 9; C.save.items.feed = 9; C.save.player.fame = 2000;
    DG.auto.setOn(true);
    var d0 = C.save.player.distance, frames = 0, t0 = performance.now();
    (function count() { frames++; requestAnimationFrame(count); })();
    setInterval(function () {
      var w = DG.world.walkingTo();
      document.getElementById('out').textContent =
        'live 관찰 모드 (?sim=600 을 붙이면 시뮬레이션 보고서)\n\n' +
        'active=' + DG.auto.active() +
        '\ndoing=' + DG.auto.status().doing +
        '\nwalkTarget=' + (w ? Math.round(w.x) + ',' + Math.round(w.y) : 'null') +
        '\ndistance +' + Math.round(C.save.player.distance - d0) + 'm' +
        '\nrafFrames=' + frames + ' elapsed=' + Math.round(performance.now() - t0) + 'ms' +
        '\nmode=' + DG.world.mode + ' spawns=' + DG.world.spawns.length;
    }, 400);
    return;
  }

  /* ── 시뮬레이션 ──────────────────────────────────────── */

  /* 맨 처음 상태에서 시작한다 (세이브가 있으면 결과가 사람마다 달라진다) */
  localStorage.removeItem(C.SAVE_KEY);
  C.reset();
  DG.sprite.setStyle(C.save.settings.style);

  /* 던전에 들어가려면 동행이 있어야 한다 — 요청한 만큼 미리 등용해 준다 */
  var seeded = [];
  if (partyN > 0) {
    for (var pi = 0; pi < partyN && pi < DG.data.heroes.length; pi++) {
      var h = DG.data.heroes[pi];
      C.save.dex.heroes[h.id] = { count: 1, firstAt: Date.now() };
      DG.hero.ensure(h.id);
      C.save.party.push(h.id);
      seeded.push(h.name);
    }
  }

  DG.auto.state().dungeon = wantDungeon;   // state() 가 없으면 만들어 준다
  DG.auto.setOn(true);

  var before = {
    lv: C.save.player.level, dist: C.save.player.distance,
    gold: C.save.player.gold, fame: C.save.player.fame, feat: C.save.player.featTotal,
    scroll: C.save.items.scroll, feed: C.save.items.feed,
    heroes: dexCount('heroes'), pets: dexCount('pets'),
    quiz: C.save.quiz.total, learned: Object.keys(C.save.quiz.learned).length,
    supply: C.save.player.supplyCount
  };

  say('역사GO 자동 순행 시뮬레이션');
  say('─'.repeat(58));
  say('설정   : ' + sim + '초 · dt ' + step + 's · ' +
    (wantDungeon ? '던전 순회 ON' : '지도 순행') +
    (seeded.length ? ' · 시작 동행 ' + seeded.join(', ') : ' · 동행 없음'));
  say('세부   : ' + JSON.stringify(DG.auto.state()));
  say('');

  /* game.js loop 과 같은 순서로 굴린다 */
  var ticks = Math.round(sim / step), i;
  var peakFloor = 0, deaths0 = 0, enterCount = 0, wasIn = false;
  for (i = 0; i < ticks; i++) {
    DG.auto.update(step);
    DG.world.update(step);
    DG.game.tickSupply();
    var inD = DG.dungeon.active();
    if (inD) {
      DG.dungeon.update(step);
      var st = DG.dungeon.status();
      if (st.active && st.floor > peakFloor) { peakFloor = st.floor; }
    }
    if (inD && !wasIn) { enterCount++; }
    wasIn = inD;
  }

  var after = {
    lv: C.save.player.level, dist: C.save.player.distance,
    gold: C.save.player.gold, fame: C.save.player.fame, feat: C.save.player.featTotal,
    scroll: C.save.items.scroll, feed: C.save.items.feed,
    heroes: dexCount('heroes'), pets: dexCount('pets'),
    quiz: C.save.quiz.total, learned: Object.keys(C.save.quiz.learned).length,
    supply: C.save.player.supplyCount
  };

  function row(label, a, b, unit) {
    var d = b - a;
    say('  ' + (label + '            ').slice(0, 12) +
        (fmtN(a) + '        ').slice(0, 8) + ' → ' +
        (fmtN(b) + '        ').slice(0, 8) +
        (d ? '  (' + (d > 0 ? '+' : '') + fmtN(d) + (unit || '') + ')' : ''));
  }

  say('■ 결과');
  row('레벨', before.lv, after.lv);
  row('이동', before.dist, after.dist, 'm');
  row('보급횟수', before.supply, after.supply, '회');
  row('금', before.gold, after.gold);
  row('명성', before.fame, after.fame);
  row('누적공적', before.feat, after.feat);
  row('등용서', before.scroll, after.scroll);
  row('사료', before.feed, after.feed);
  row('도감인물', before.heroes, after.heroes, '명');
  row('도감펫', before.pets, after.pets, '종');
  row('문답', before.quiz, after.quiz, '문');
  say('');

  var ds = DG.dungeon.state();
  say('■ 던전   진입 ' + enterCount + '회 · 최고 도달 제' + (ds.best || 0) + '층 (이번 최고 ' +
    peakFloor + ') · 답파 ' + (ds.clears || 0) + ' · 패퇴 ' + (ds.deaths || 0) +
    ' · 사냥 ' + fmtN(ds.kills || 0) + '마리');
  if (DG.item) {
    say('■ 장비   가방 ' + DG.item.bag().length + '점' +
      (C.save.party.length ? ' · 동행 ' + C.save.party.length + '명 장착분 포함' : ''));
  }
  say('■ 마지막 판단: ' + DG.auto.status().doing);
  say('');

  say('■ 기록 (최근 24줄, 최신이 위)');
  var lg = C.save.log.slice(0, 24);
  for (i = 0; i < lg.length; i++) {
    var t = new Date(lg[i].t);
    say('  [' + lg[i].kind + '] ' + lg[i].text);
  }
  say('');
  say('총 로그 ' + C.save.log.length + '줄 (상한 120)');

  document.title = 'SIM done dist=' + Math.round(after.dist) +
    ' heroes=' + after.heroes + ' pets=' + after.pets + ' floor=' + peakFloor;
  localStorage.removeItem(C.SAVE_KEY);   // 시뮬레이션 흔적은 남기지 않는다
}, 400);
</script>
</body></html>
