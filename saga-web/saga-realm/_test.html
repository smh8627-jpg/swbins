<script>
window.DG_NO_DRAW = true; window.DG_NO_ACCOUNT = true; window.DG_NO_TUNE = true;

/* 무작위 고정 — 진단이 굴릴 때마다 달라지면 판정이 흔들린다.
   게임 스크립트보다 **먼저** 갈아 둬야 부트에서 쓰는 난수까지 잡힌다.
   (실제 플레이는 그대로다 — 이 파일 안에서만 바꾼다)
   mulberry32: 짧고 분포가 고르며 같은 씨앗이면 같은 수열이 나온다. */
(function (seed) {
  var s = seed >>> 0;
  Math.random = function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  window.DG_SEED = seed;
})(20260824);
</script>

<script>
(function () {
  var out = [], errors = [];
  window.addEventListener('error', function (e) { errors.push(e.message); });

  function t(name, fn) {
    try {
      var r = fn();
      out.push((r ? '<span class="pass">PASS</span> ' : '<span class="fail">FAIL</span> ') +
        name + (typeof r === 'string' ? ' — ' + r : ''));
      return !!r;
    } catch (e) {
      out.push('<span class="fail">FAIL</span> ' + name + ' — 예외: ' + e.message);
      return false;
    }
  }

  setTimeout(function () {
    var C = DG.core, R = DG.rtk, CD = DG.cityData, FD = DG.forceData,
        off = DG.off, W = DG.war, D = DG.diplo, AI = DG.rtkAI, Q = DG.quiz, QD = DG.quizData;

    /**
     * 판을 깨끗하게 다시 세운다.
     * **항목은 자기가 쓸 상태를 스스로 만든다** — 앞 항목이 남긴 성·충성·맹약이
     * 다음 항목으로 흘러 들어가면 통과와 실패가 순서에 달리게 된다.
     */
    function fresh(meId, scen) {
      /* 무장 성장(`save.heroes`)은 setup 이 건드리지 않는다 — 세이브 공용 칸이라
         일부러 그렇게 두었다. 진단에서는 **함께 비운다**. 안 비우면 앞 항목이
         올려 놓은 레벨이 뒤 항목의 능력치로 흘러 들어가 수치가 순서에 달린다 */
      C.save.heroes = {};
      R.setup(meId || 'cao', scen);
      return R.state();
    }

    /** 그 성의 장수를 모두 성하게(명령 안 쓴 상태로) 만든다 */
    function freeUp(cityId) {
      var list = off.atCity(cityId, R.city(cityId).force);
      for (var i = 0; i < list.length; i++) {
        var r = off.rec(list[i].id); r.done = false; r.hurt = 0;
      }
      return list;
    }

    /**
     * 재야(在野)는 이름 해시로 `CD.CITIES.length` 를 나눠 결정적으로 흩는다
     * (`rtk.scatterFree`) — 성을 늘릴 때마다(지역 확장) 나눗셈이 바뀌어 어느
     * 성에 숨은 사람이 걸리는지도 통째로 바뀐다. 대개는 내 세력(cao)의 몇
     * 안 되는 시작 성 어딘가에 우연히 걸리지만, **2026-09-10 균열(아홉째)
     * 확장에서 실제로 셋 다 빗나가 세 항목이 한꺼번에 깨졌다** — 성 수가
     * 93 이 되면서 하필 cao 의 세 시작 성(진류·복양·허창) 모두에 숨은 재야가
     * 하나도 안 떨어졌다. 자연스러운 산포 운에 기대는 대신, 아무 데나 숨어
     * 있는 재야 하나를 내 세력 성으로 직접 옮겨 확실하게 만든다 — 시험하려는
     * 것("수색 전엔 등용 못 한다", "학식·세작이 재야를 드러낸다")은 그대로다,
     * 산포 자체의 운을 시험하는 게 아니다. */
    function ensureHiddenAtMine() {
      var mine = R.citiesOf('cao'), i;
      for (i = 0; i < mine.length; i++) {
        if (off.freeAt(mine[i], false).length) { return mine[i]; }
      }
      for (i = 0; i < CD.CITIES.length; i++) {
        var hidden = off.freeAt(CD.CITIES[i].id, false)[0];
        if (hidden) {
          off.placeAt(hidden.id, mine[0], null);
          off.rec(hidden.id).found = false;
          return mine[0];
        }
      }
      return null;
    }

    /**
     * 낙양 앞에 진(陣)을 하나 세운다.
     * **배수를 올려 가며 진영이 설 때까지** 해 본다 — 한 배수에 못을 박아 두면
     * 앞 항목이 난수를 얼마나 썼느냐에 따라 함락이 되거나 퇴각이 되어 흔들린다.
     */
    function campSet() {
      var ms = [1, 1.2, 1.5, 1.8, 2.2], i;
      for (i = 0; i < ms.length; i++) {
        fresh('cao');
        var from = R.city('chenliu'), to = R.city('luoyang');
        from.troops = Math.round(to.troops * ms[i]); from.food = 999999;
        var lead = off.atCity('chenliu', 'cao').slice(0, 3).map(function (h) { return h.id; });
        var rep = W.march('chenliu', 'luoyang', lead, from.troops - 1);
        var cp = W.campsOf('cao')[0];
        if (cp) { return { rep: rep, cp: cp, lead: lead, mult: ms[i] }; }
      }
      return null;
    }

    function countFound() {
      var n = 0, m = R.state().officers, k;
      for (k in m) { if (!m[k].force && m[k].found) { n++; } }
      return n;
    }

    /* ── 골격 ────────────────────────────────────────── */

    t('옛 경영 모듈은 걷어냈다', function () {
      var gone = ['land', 'territory', 'build', 'buildData', 'incident', 'auto'];
      var left = gone.filter(function (k) { return !!DG[k]; });
      return left.length === 0 && '강역·특산·건설·사변·자동 없음 (성이 그 자리를 맡는다)';
    });

    t('삼국지 모듈이 다 실려 있다', function () {
      var here = ['cityData', 'forceData', 'off', 'rtk', 'war', 'diplo', 'rtkAI', 'quiz'];
      var miss = here.filter(function (k) { return !DG[k]; });
      return miss.length === 0 &&
        ('성 ' + CD.CITIES.length + ' · 세력 ' + FD.FORCES.length +
         ' · 명령 ' + R.ORDERS.length + ' · 계략 ' + D.PLOTS.length +
         ' · 문답 ' + QD.BANK.length);
    });

    t('지도에 외딴 성이 없다', function () {
      /* 한 곳이라도 길이 끊기면 그 성은 영영 못 뺏고 못 빼앗긴다 */
      var lonely = CD.CITIES.filter(function (c) { return !c.adj.length; });
      var far = CD.CITIES.filter(function (c) { return CD.hops('luoyang', c.id) < 0; });
      return lonely.length === 0 && far.length === 0 && CD._dropped.length === 0 &&
        ('서른 성이 다 이어져 있다 · 낙양→성도 ' + CD.hops('luoyang', 'chengdu') +
         '성 · 계→회계 ' + CD.hops('jixian', 'kuaiji') + '성');
    });

    t('길은 양쪽으로 이어진다', function () {
      /* 한쪽만 이어져 있으면 "칠 수는 있는데 되받아칠 수 없는" 성이 생긴다 */
      var bad = [];
      for (var i = 0; i < CD.CITIES.length; i++) {
        var a = CD.CITIES[i];
        for (var j = 0; j < a.adj.length; j++) {
          if (CD.find(a.adj[j]).adj.indexOf(a.id) < 0) { bad.push(a.id + '→' + a.adj[j]); }
        }
      }
      return bad.length === 0 && '한쪽만 난 길 없음';
    });

    t('무장 명부는 data.js 를 건드리지 않고 늘어난다', function () {
      /* data.js 는 다섯 판이 바이트까지 같은 복사본이다. 얹기만 한다 */
      var n = off.all().length;
      var three = off.all().filter(function (h) { return h.era === '삼국지'; }).length;
      /* 2026-09-10 — data.js 쪽 인물 수는 다른 세션(HEROES 가명화 후속)이 같은
         시각에 늘리고 있어(현재 삼국지22·한국사26·일본사20·세계사37 = 105)
         고정 매직넘버로 두면 그쪽이 또 늘 때마다 이 진단이 헛되이 깨진다.
         그래서 이 판이 보탠 무장(FD.OFFICERS + 확장 지역 8곳)만 id로 골라내
         "보탠 개수"를 세고, 나머지(=data.js 쪽)는 거꾸로 계산한다 — data.js
         를 안 건드리고 늘었다는 것만 확인하면 되는 테스트라 이걸로 충분하다 */
      var added = FD.OFFICERS.concat(
        FD.KOREA_OFFICERS, FD.JAPAN_OFFICERS, FD.JIAOZHOU_OFFICERS, FD.XIYU_OFFICERS,
        FD.NANZHONG_OFFICERS, FD.TIANZHU_OFFICERS, FD.MOBEI_OFFICERS, FD.LINYI_OFFICERS);
      var addedIds = {};
      added.forEach(function (o) { addedIds[o.id] = true; });
      var dataHeroBase = off.all().filter(function (h) { return !addedIds[h.id]; }).length;
      return n === dataHeroBase + added.length && three === 76 &&
        !!DG.data.find('rf_guojia') && !!DG.data.find('sg_caocao') &&
        ('인물(data.js) ' + dataHeroBase + ' + 이 판이 보탠 무장 ' + added.length + ' = ' + n +
         ' · 삼국지 ' + three + ' · 재야 후보 ' + (n - three));
    });

    t('세력 표의 무장이 모두 명부에 있다', function () {
      var miss = [];
      for (var i = 0; i < FD.FORCES.length; i++) {
        var ids = FD.roster(FD.FORCES[i].id);
        for (var j = 0; j < ids.length; j++) { if (!off.find(ids[j])) { miss.push(ids[j]); } }
      }
      return miss.length === 0 && '군주 13 · 부하 전원 확인';
    });

    /* ── 판 세우기 ───────────────────────────────────── */

    t('194년 판이 선다 — 서른 성에 주인이 다 있다(여덟 확장 지역 쉰여섯은 주인 없이 시작)', function () {
      var st = fresh('cao');
      var keys = Object.keys(st.cities);
      /* 한국·일본·교주·서역·남중·천축·막북·임읍 지역(garrison 필드가 있는 성)은
         처음부터 일부러 주인이 없다 — 정복 대상이다. 그 쉰여섯을 빼고서
         나머지가 다 주인 있는지만 잰다 */
      var noOwner = keys.filter(function (k) {
        return !st.cities[k].force && !CD.find(k).garrison;
      });
      var total = 0;
      for (var i = 0; i < FD.FORCES.length; i++) { total += FD.FORCES[i].cities.length; }
      return keys.length === CD.CITIES.length && noOwner.length === 0 && total === 30 &&
        (st.year + '년 ' + st.month + '월 · 내 세력 ' + R.forceName(st.me));
    });

    t('재야는 삼국지 사람이 아닌 인물들이다', function () {
      fresh('cao');
      var free = off.all().filter(function (h) { return h.stats && !off.rec(h.id).force; });
      var nonThree = free.filter(function (h) { return h.era !== '삼국지'; }).length;
      /* 여덟 확장 지역 수비 무장 72인도 force:null 이라 이 정의로는 재야에
         든다. data.js 쪽 비삼국지 인물 수는 다른 세션이 같이 늘리고 있어
         고정 매직넘버를 안 쓴다(위 "무장 명부는…" 테스트와 같은 이유) —
         "이 판이 보탠 비삼국지 무장 72인이 전부 재야에 잡히는지"만 확인한다.
         (2026-09-10 — 이 수치는 원래 남중까지도 반영이 안 돼 있었다(84),
         남중 이후 node·chrome이 없어 직접 못 돌려 본 채 남아 있던 것도
         이번에 같이 바로잡았다) */
      var addedNonThree = FD.KOREA_OFFICERS.concat(
        FD.JAPAN_OFFICERS, FD.JIAOZHOU_OFFICERS, FD.XIYU_OFFICERS,
        FD.NANZHONG_OFFICERS, FD.TIANZHU_OFFICERS, FD.MOBEI_OFFICERS, FD.LINYI_OFFICERS).length;
      var freeIds = {};
      free.forEach(function (h) { freeIds[h.id] = true; });
      var addedFreeOk = FD.KOREA_OFFICERS.concat(
        FD.JAPAN_OFFICERS, FD.JIAOZHOU_OFFICERS, FD.XIYU_OFFICERS,
        FD.NANZHONG_OFFICERS, FD.TIANZHU_OFFICERS, FD.MOBEI_OFFICERS, FD.LINYI_OFFICERS)
        .every(function (o) { return freeIds[o.id]; });
      return addedFreeOk && nonThree >= addedNonThree &&
        ('재야 ' + free.length + ' (여덟 확장 지역 ' + addedNonThree + '인 전원 포함, 비삼국지 계 ' +
         nonThree + ' + 삼국지 재야 ' + (free.length - nonThree) + ')');
    });

    t('재야는 늘 같은 성에 있다 (난수를 얼마나 썼든)', function () {
      /* 무작위로 흩으면 진단이 실행마다 다른 성을 짚는다 — 이름 해시로 흩는다 */
      fresh('cao');
      var a = off.rec('kr_yisunsin').city;
      for (var i = 0; i < 30; i++) { Math.random(); }
      fresh('bei');
      var b = off.rec('kr_yisunsin').city;
      return a === b && ('이순신은 두 번 다 ' + CD.find(a).name);
    });

    t('수색 전에는 재야가 보이지 않는다', function () {
      /* 특정 인물을 못 박으면 그 사람이 (이름 해시로) 떨어지는 성이 성이
         늘 때마다 바뀐다 — 하필 수비 무장이 있는 성(이미 found:true 인
         사람이 있어 seen이 0이 아닌 성)에 떨어지면 헛되이 깨진다. 그래서
         "묻힌 사람은 있는데 보이는 사람은 없는 성"을 직접 찾는다(위
         "수색해야 등용할 수 있다" 테스트와 같은 방식) */
      fresh('cao');
      var target = null, all = 0;
      for (var i = 0; i < CD.CITIES.length; i++) {
        var cid = CD.CITIES[i].id;
        var a = off.freeAt(cid, false).length;
        var s = off.freeAt(cid, true).length;
        if (a > 0 && s === 0) { target = cid; all = a; break; }
      }
      if (!target) { return false; }
      return ('그 성(' + target + ')에 ' + all + '명이 묻혀 있고 보이는 사람은 0');
    });

    /* ── 내정 ────────────────────────────────────────── */

    t('명령은 자질만큼 성과를 낸다', function () {
      fresh('cao');
      freeUp('xuchang');
      var here = off.atCity('xuchang', 'cao');
      /* 지력이 가장 높은 사람과 가장 낮은 사람 — 차이가 드러나는 구간에 세운다 */
      here.sort(function (a, b) { return off.stats(b.id).wisdom - off.stats(a.id).wisdom; });
      var smart = here[0], dull = here[here.length - 1];
      var c = R.city('xuchang');
      var v0 = c.agri;
      R.order('xuchang', smart.id, 'agri');
      var gainSmart = c.agri - v0;
      v0 = c.agri;
      R.order('xuchang', dull.id, 'agri');
      var gainDull = c.agri - v0;
      return gainSmart > gainDull &&
        (smart.name + '(지 ' + off.stats(smart.id).wisdom + ') +' + gainSmart + ' vs ' +
         dull.name + '(지 ' + off.stats(dull.id).wisdom + ') +' + gainDull);
    });

    t('한 사람은 한 달에 한 번만 명령한다', function () {
      fresh('cao');
      freeUp('xuchang');
      var who = R.readyAt('xuchang')[0];
      var a = R.order('xuchang', who.id, 'comm');
      var b = R.order('xuchang', who.id, 'comm');
      return a.ok && !b.ok && b.why.indexOf('이미') >= 0 && ('두 번째: ' + b.why);
    });

    t('명령에는 금이 든다 — 금고가 비면 못 한다', function () {
      fresh('cao');
      freeUp('xuchang');
      R.force('cao').gold = 10;
      var who = R.readyAt('xuchang')[0];
      var r = R.order('xuchang', who.id, 'wall');
      return !r.ok && r.why.indexOf('금') >= 0 && (r.why);
    });

    t('지형이 내정 상한을 가른다', function () {
      /* 산성(한중)은 논밭이 좁고, 강가(건업)는 저자가 크다 */
      var mount = R.capOf('hanzhong', 'agri');
      var plain = R.capOf('xuchang', 'agri');
      var river = R.capOf('jianye', 'comm');
      return mount < plain && river > plain &&
        ('한중(산) 농 ' + mount + ' < 허창(평야) ' + plain + ' · 건업(강) 상 ' + river);

         요건을 다 넘는다. 그런 사람은 "선 진형" 하나의 mul만 1로 죽여도
         formationOf() 가 다음으로 센 진형(예: 학익진 ×1.10)을 대신 골라
         버려 ratio가 origMul과 안 맞았다 — **세 진형을 전부** 꺼야 "진형이
         아예 안 선 값"이 나온다(하나만 못 박는 예전 방식은 여러 진형

      fresh('cao');

      var f = W.formationOf([strong.id]);

      var army = { troops: 10000, train: 60, tech: 300, morale: 1, officers: [strong.id], water: false };
      var withMul = W.armyPower(army);
      var origMuls = W.FORMATIONS.map(function (x) { return x.mul; });

      var withoutMul = W.armyPower(army);
      W.FORMATIONS.forEach(function (x, i) { x.mul = origMuls[i]; });   // 되돌린다

    t('rollAging — 군주는 안 죽는다, 늙은 부하는 죽을 수 있고 태수 자리도 비운다', function () {
      fresh('cao');
      var lordId = FD.force('cao').lord;
      var id = 'sg_xiahoudun';
      var cityId = off.rec(id).city;
      R.city(cityId).gov = id;
      R.state().year = off.birthYear(id) + 500;   // 사망 확률이 상한(연 60%)에 닿도록
      /* 이 나이에선 명부 전체가 걸려 rollAging() 한 번에 Math.random() 을
         수백 번 끌어 쓴다 — 진단 전체가 공유하는 고정 씨앗 순번이 이
         항목 때문에 밀리면 뒤따르는 다른 항목이 죄다 흔들린다. 여기서만
         잠깐 딴 발생기를 끼우고 끝나면 반드시 원래 것으로 되돌린다. */
      var savedRandom = Math.random, seed = 0xC0FFEE;
      Math.random = function () {
        seed = (seed + 0x6D2B79F5) >>> 0;
        var x = seed;
        x = Math.imul(x ^ (x >>> 15), x | 1);
        x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
        return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
      };
      var died = false, tries = 0;
      for (; tries < 500 && !died; tries++) {
        off.rollAging();
        died = off.isDead(id);
      }
      Math.random = savedRandom;
      return died && !off.isDead(lordId) && R.city(cityId).gov === null &&
        off.atCity(cityId, 'cao').every(function (h) { return h.id !== id; }) &&
        (id + ' 이(가) ' + tries + '번째 굴림에 별세 — 군주 ' + off.find(lordId).name + ' 는 그대로');

      /* 2026-09-10 — 이 진단 전체가 씨앗 하나(mulberry32, 20260824)를 처음부터

         크기가 바뀌면 Math.random() 이 몇 번 불렸는지가 달라져, 이 시험이
         실행되는 시점의 난수 스트림 위치도 함께 밀린다. 원정 한 번(약 6달)에
         "유물 발견"(6종 중 하나) 이 꼭 걸린다는 보장은 원래 없었다 — 밀린
         위치에서는 그 한 번 안에 안 걸릴 수 있다(실제로 이번에 그랬다).
         그래서 **원정을 여러 번 새로 보낸다**(최대 10회, 매번 새로 자유로운
         장수를 골라서) — 씨앗은 그대로 두고 시도 횟수만 넉넉히 늘렸다 */
      fresh('zan');
      var before = C.tuned('war.journeyEventChance', 0.16);
      C.setTune('war.journeyEventChance', 1);
      R.city('beiping').troops = 999999; R.city('beiping').food = 9999999;
      var got = null, baseline = null, tries = 0;
      while (!got && tries < 10) {
        tries++;
        var lead = off.atCity('beiping', 'zan').filter(function (h) { return !h.journey; })
          .slice(0, 2).map(function (h) { return h.id; });

        var guard = 0, j;

      var b = got ? baseline[got] : null;

        (s.might > b.might || s.wisdom > b.wisdom || s.command > b.command) &&
        ('장수 ' + off.find(got).name + ' 이(가) 보물 착용(원정 ' + tries + '회째) — 무 ' + b.might + '→' + s.might +

    });

      C.setSaveKey(A.keyOf(a.id));
      C.save.player.gold = 100; C.persist();
      C.setSaveKey(A.keyOf(b.id));
      C.save.player.gold = 999; C.persist();
      var ga = JSON.parse(localStorage.getItem(A.keyOf(a.id))).player.gold;
      var gb = JSON.parse(localStorage.getItem(A.keyOf(b.id))).player.gold;
      localStorage.removeItem(A.keyOf(a.id));
      localStorage.removeItem(A.keyOf(b.id));
      return ga === 100 && gb === 999 && A.list().length === 2 &&
        ('갑 ' + ga + ' · 을 ' + gb + ' (서로 안 섞인다)');
    });

    t('가입 — 옛 세이브를 첫 프로필로 이어받는다', function () {
      var A = DG.account;
      localStorage.removeItem(A._store);
      localStorage.setItem(A._legacy, JSON.stringify({ v: 1, player: { level: 7, gold: 777 } }));
      var acc = A.create('이어받기', true);
      var moved = JSON.parse(localStorage.getItem(A.keyOf(acc.id)));
      localStorage.removeItem(A._legacy);
      localStorage.removeItem(A.keyOf(acc.id));
      return A.hasLegacy() === false && moved && moved.player.gold === 777 &&
        ('Lv.' + moved.player.level + ' · 금 ' + moved.player.gold + ' 이 옮겨졌다');
    });

    t('가입 — 진단에서는 가입 화면을 띄우지 않는다', function () {
      return window.DG_NO_ACCOUNT === true && !document.getElementById('acc-host') &&
        '진단 우회 동작';
    });

    t('진단의 무작위는 씨앗으로 고정된다', function () {
      return window.DG_SEED === 20260824 &&
        Math.random() >= 0 && Math.random() < 1 && ('씨앗 ' + window.DG_SEED);
    });

    /* ── 소리(音) — WebAudio 로 그 자리에서 만든다 (2026-09-10) ────── */

    t('소리표에 전투·무장·세계·시간·원정·학당·외교/재해 갈래가 다 있다', function () {
      var S = DG.sfx;
      var need = ['battle_win', 'battle_routed', 'battle_dusk', 'duel',
                  'grow', 'promote', 'history', 'discover', 'fallen', 'victory', 'defeat',
                  'month', 'newyear', 'march', 'journey_good', 'journey_bad', 'camp_retreat',
                  'quiz_ok', 'quiz_miss',
                  'omen', 'friendly', 'defect', 'disaster_good', 'disaster_bad'];
      var miss = [], i;
      for (i = 0; i < need.length; i++) { if (!S.CUES[need[i]]) { miss.push(need[i]); } }
      var keys = Object.keys(S.CUES);
      return miss.length === 0 && ('소리 ' + keys.length + '가지 · 빠진 것 없음');
    });

    t('첫 눌림 전에는 소리가 안 난다 (브라우저 규칙)', function () {
      var S = DG.sfx;
      return S.ready() === false && S.play('battle_win') === false &&
        '깨우기 전에는 play() 가 false';
    });

    t('소리는 꺼져 있어도 요청을 남긴다 (판정 층과 소리 층이 갈렸다)', function () {
      var S = DG.sfx;
      S._clear();
      S.play('battle_win'); S.play('victory');
      var tail = S._tail(2);
      return tail.length === 2 && tail[0] === 'battle_win' && tail[1] === 'victory' &&
        '소리가 안 나도 기록은 남는다';
    });

    t('없는 소리를 불러도 안 죽는다', function () {
      var S = DG.sfx;
      S._clear();
      var r = S.play('그런소리없음');
      return r === false && S._tail(1)[0] === '그런소리없음' &&
        '모르는 키는 조용히 흘린다';
    });

    t('rtk:battle — 내 세력이 관여하지 않은 싸움은 조용하다 (war.js 는 안 건드렸다)', function () {
      var S = DG.sfx, st = fresh('cao');
      var others = Object.keys(st.forces).filter(function (f) { return f !== 'cao'; });
      S._clear();
      C.emit('rtk:battle', { force: others[0], defForce: others[1], won: true, duel: false });
      return S._tail(5).length === 0 && 'AI 끼리의 싸움은 안 울린다';
    });

    t('rtk:battle — 내가 친(공격) 싸움은 결과대로 울리고, 일기토는 따로 겹친다', function () {
      var S = DG.sfx, st = fresh('cao');
      var other = Object.keys(st.forces).filter(function (f) { return f !== 'cao'; })[0];
      S._clear();
      C.emit('rtk:battle', { force: 'cao', defForce: other, won: true, duel: true });
      var tail = S._tail(2);
      return tail[0] === 'duel' && tail[1] === 'battle_win' && (tail.join(' · '));
    });

    t('rtk:battle — 내가 맞은(수비) 싸움도 듣는다', function () {
      var S = DG.sfx, st = fresh('cao');
      var other = Object.keys(st.forces).filter(function (f) { return f !== 'cao'; })[0];
      S._clear();
      C.emit('rtk:battle', { force: other, defForce: 'cao', won: false, routed: true, duel: false });
      return S._tail(1)[0] === 'battle_routed' && '수비 쪽이어도 듣는다';
    });

    t('rtk:grew·rtk:promote — 남의 무장이 크는 것은 조용하고, 내 무장만 듣는다', function () {
      var S = DG.sfx, st = fresh('cao');
      var mineId = off.ofForce('cao')[0].id;
      var otherForce = Object.keys(st.forces).filter(function (f) { return f !== 'cao'; })[0];
      var otherId = off.ofForce(otherForce)[0].id;
      S._clear();
      C.emit('rtk:grew', { id: otherId, lv: 5, levels: 1 });
      var otherSilent = S._tail(5).length === 0;
      S._clear();
      C.emit('rtk:grew', { id: mineId, lv: 5, levels: 1 });
      var mineGrows = S._tail(1)[0] === 'grow';
      S._clear();
      C.emit('rtk:promote', { id: otherId, rank: 1 });
      var promOtherSilent = S._tail(5).length === 0;
      S._clear();
      C.emit('rtk:promote', { id: mineId, rank: 1 });
      var minePromotes = S._tail(1)[0] === 'promote';
      return otherSilent && mineGrows && promOtherSilent && minePromotes &&
        '내 세력 문턱이 grew·promote 둘 다에 걸려 있다';
    });

    t('rtk:end · rtk:month — 승패와 새해/평달을 가른다', function () {
      var S = DG.sfx;
      S._clear(); C.emit('rtk:end', 'win'); var v = S._tail(1)[0] === 'victory';
      S._clear(); C.emit('rtk:end', 'lose'); var d = S._tail(1)[0] === 'defeat';
      S._clear(); C.emit('rtk:month', { year: 200, month: 1 }); var ny = S._tail(1)[0] === 'newyear';
      S._clear(); C.emit('rtk:month', { year: 200, month: 5 }); var mo = S._tail(1)[0] === 'month';
      return v && d && ny && mo && '넷 다 맞다';
    });

    t('quiz:answered — 정답/오답을 가른다', function () {
      var S = DG.sfx;
      S._clear(); C.emit('quiz:answered', { id: 'x', ok: true }); var ok1 = S._tail(1)[0] === 'quiz_ok';
      S._clear(); C.emit('quiz:answered', { id: 'x', ok: false }); var ok2 = S._tail(1)[0] === 'quiz_miss';
      return ok1 && ok2 && '학당 정오답';
    });

    t('toast 머리 이모지로만 갈래를 가른다 (천기·동맹/합류·귀순·발견·재해) — 판정 파일은 안 건드렸다', function () {
      var S = DG.sfx;
      S._clear(); C.emit('toast', '🔮 길조 · 시험'); var om = S._tail(1)[0] === 'omen';
      S._clear(); C.emit('toast', '🤝 아무개 합류!'); var fr = S._tail(1)[0] === 'friendly';
      S._clear(); C.emit('toast', '💰 아무개 이(가) 넘어왔다'); var de = S._tail(1)[0] === 'defect';
      S._clear(); C.emit('toast', '🔍 아무개 을(를) 찾았다'); var di = S._tail(1)[0] === 'discover';
      S._clear(); C.emit('toast', '🌻 낙양 풍년'); var gg = S._tail(1)[0] === 'disaster_good';
      S._clear(); C.emit('toast', '🌊 낙양 수해'); var bb = S._tail(1)[0] === 'disaster_bad';
      return om && fr && de && di && gg && bb && '여섯 갈래 다 맞다';
    });

    t('승진("✨")·사관 오류("⚠️") 토스트는 따로 안 듣는다 (rtk:promote 로 이미 울렸다 — 중복 방지)', function () {
      var S = DG.sfx;
      S._clear();
      C.emit('toast', '✨ 아무개 승급 ★1');
      C.emit('toast', '⚠️ 오류');
      return S._tail(5).length === 0 && '두 갈래는 toast 표에 없다 (중복 방지)';
    });

    t('가명 정책 — BIOS·PETS·quote에 실제 역사 인물의 실명이 없다', function () {
      /* 2026-09-10 발견된 구멍(SAGA-HANDOFF 참고): name/hanja만 가명으로 바꾸고
         BIOS·PETS의 name/desc·HEROES의 quote에는 실명·실제 사건명이 그대로
         남아 있었다. 같은 구멍이 다시 안 생기게 알려진 실명 몇 개만이라도
         박아 둔다(전수 검사는 아니다 — 새 인물을 추가할 때 사람이 한 번 더
         눈으로 훑어야 한다). */
      var BLACK = ['유비', '관우', '조조', '사마의', '하후돈', '장료', '순욱', '손권', '주유',
        '육손', '태사자', '감녕', '여포', '초선', '방통', '화타', '맹획', '봉추',
        '이순신', '을지문덕', '강감찬', '김유신', '계백', '연개소문', '광개토대왕', '세종대왕',
        '장영실', '최무선', '대조영', '왕건', '정약용', '허준', '신사임당',
        '안중근', '이토 히로부미', '히로부미', '하얼빈', '뤼순', '유관순', '아우내', '서대문',
        '김구', '백범', '원효', '김정호', '곽재우', '논개', '이황', '황희', '정몽주', '선죽교',
        '히미코', '노부나가', '히데요시', '이에야스', '다케다 신겐', '우에스기 겐신',
        '마사무네', '유키무라', '미야모토 무사시', '핫토리 한조',
        '카이사르', '시저', '알렉산더', '한니발', '샤를마뉴', '잔다르크', '나폴레옹', '다빈치',
        '레오니다스', '엘리자베스', '넬슨', '마키아벨리', '뉴턴', '미켈란젤로',
        '칭기즈칸', '징기스칸', '쿠빌라이', '만사무사', '샤카', '클레오파트라',
        '함무라비', '아틸라', '적토마', '절영'];
      var Dx = DG.data, hit = [], i, j, text;
      for (i = 0; i < Dx.heroes.length; i++) {
        text = Dx.bio(Dx.heroes[i].id) + ' ' + Dx.heroes[i].quote;
        for (j = 0; j < BLACK.length; j++) {
          if (text.indexOf(BLACK[j]) >= 0) { hit.push(Dx.heroes[i].id + '←' + BLACK[j]); }
        }
      }
      for (i = 0; i < Dx.pets.length; i++) {
        text = Dx.pets[i].name + ' ' + Dx.pets[i].desc;
        for (j = 0; j < BLACK.length; j++) {
          if (text.indexOf(BLACK[j]) >= 0) { hit.push(Dx.pets[i].id + '←' + BLACK[j]); }
        }
      }
      return hit.length === 0 &&
        (Dx.heroes.length + '명 BIOS·quote + ' + Dx.pets.length + '개 PETS 검사, 걸린 실명 없음');
    });

    t('런타임 에러 없음', function () {
      return errors.length === 0 || ('에러 ' + errors.length + '건: ' + errors.join(' | ')) === '';
    });

    var failCount = out.filter(function (s) { return s.indexOf('FAIL') >= 0; }).length;
    document.getElementById('report').innerHTML =
      '<h3>사가국지(삼국지) 자가진단 — ' + (out.length - failCount) + '/' + out.length + ' 통과</h3>' +
      out.join('<br>') +
      (errors.length ? '<br><br><b class="fail">런타임 에러</b><br>' + errors.join('<br>') : '');
    document.title = 'RESULT ' + (out.length - failCount) + '/' + out.length;
    localStorage.removeItem(C.SAVE_KEY);
  }, 500);
})();
</script>
</body>
