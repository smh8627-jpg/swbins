<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>사가 엔진 게임</title>
<style>
  :root { --ink: #fff; --shade: rgba(10, 14, 24, 0.72); --gold: #ffd166; --bad: #ff6b6b; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14; touch-action: none;
    font-family: -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  #cv { display: block; width: 100vw; height: 100vh; outline: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: var(--ink); user-select: none; }
  #hud .vars { position: absolute; left: 14px; top: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
  #hud .hv { background: var(--shade); padding: 6px 12px; border-radius: 999px; font-size: 15px; }
  #hud .hv b { color: var(--gold); font-weight: 700; margin-right: 2px; }
  #hud .hearts { color: var(--bad); letter-spacing: 1px; }
  #hud .toast { position: absolute; left: 50%; top: 18%; transform: translate(-50%, -8px); background: var(--shade); padding: 10px 18px;
    border-radius: 10px; font-size: 18px; opacity: 0; transition: opacity .2s, transform .2s; }
  #hud .toast.show { opacity: 1; transform: translate(-50%, 0); }
  #hud .prompt { position: absolute; left: 50%; bottom: 22%; transform: translateX(-50%); background: var(--shade); padding: 6px 14px;
    border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .15s; }
  #hud .prompt.show { opacity: 1; }
  #hud .dialog { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); width: min(720px, calc(100vw - 32px));
    background: var(--shade); border: 2px solid rgba(255,255,255,.25); border-radius: 12px; padding: 14px 18px 26px; display: none; box-sizing: border-box; }
  #hud .dialog.show { display: block; }
  #hud .dialog .name { color: var(--gold); font-weight: 700; margin-bottom: 4px; }
  #hud .dialog .text { font-size: 18px; line-height: 1.5; white-space: pre-wrap; }
  #hud .dialog .more { position: absolute; right: 14px; bottom: 6px; font-size: 12px; opacity: .6; }
  #hud .over { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.45); pointer-events: auto; }
  #hud .over.show { display: flex; }
  #hud .over .box { background: var(--shade); padding: 26px 38px; border-radius: 16px; text-align: center; border: 2px solid var(--bad); }
  #hud .over.win .box { border-color: var(--gold); }
  #hud .over .title { font-size: 30px; font-weight: 800; }
  #hud .over .text { margin: 8px 0 16px; font-size: 17px; }
  #hud .over button, #hud .tbtn { font: inherit; }
  #hud .over button { padding: 8px 20px; border-radius: 8px; border: 0; background: var(--gold); color: #222; font-weight: 700; cursor: pointer; }
  #hud .scene-name { position: absolute; left: 50%; top: 40%; transform: translateX(-50%); font-size: 28px; font-weight: 800;
    text-shadow: 0 2px 8px #000; opacity: 0; }
  #hud .scene-name.show { animation: sn 2.2s ease-out; }
  @keyframes sn { 0% { opacity: 0; } 15% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; } }
  #hud .tpad { position: absolute; left: 24px; bottom: 24px; width: 130px; height: 130px; border-radius: 50%;
    background: rgba(255,255,255,.12); pointer-events: auto; touch-action: none; }
  #hud .tpad .knob { position: absolute; left: 40px; top: 40px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.4); }
  #hud .tbtn { position: absolute; bottom: 36px; width: 70px; height: 70px; border-radius: 50%; border: 0; color: #fff; font-weight: 700;
    background: rgba(255,255,255,.2); pointer-events: auto; touch-action: none; }
  #hud .view-tag { position: absolute; left: 50%; top: 58px; transform: translateX(-50%); background: var(--shade); padding: 5px 12px; border-radius: 8px; font-size: 13px; opacity: 0; }
  #hud .view-tag.show { animation: sn 2.4s ease-out; }
  #hud .cross { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 22px; opacity: 0; text-shadow: 0 0 3px #000; }
  #hud .cross.show { opacity: .8; }
  #hud .err { position: absolute; left: 16px; top: 16px; right: 16px; background: #401820; color: #fff; padding: 14px; border-radius: 10px; pointer-events: auto; }
</style>
</head>
<body>
<canvas id="cv" tabindex="0"></canvas>
<div id="hud"></div>
<script src="three.iife.js"></script>
<script src="sim.js"></script>
<script src="combat.js"></script>
<script src="systems.js"></script>
<script src="basics.js"></script>
<script src="view.js"></script>
<script src="play-combat.js"></script>
<script src="play-systems.js"></script>
<script src="play-basics.js"></script>
<!--SAGA-PROJECT-->
<script src="play.js"></script>
</body>
</html>
