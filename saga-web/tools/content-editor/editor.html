<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>saga-web 콘텐츠 에디터</title>
<style>
  :root {
    --bg: #1e1f22; --panel: #26272b; --panel2: #2d2f34; --line: #3a3c42;
    --text: #e6e6e6; --sub: #9a9ea6; --accent: #5b8cff; --accent2: #3f6bd8;
    --ok: #5ec26a; --bad: #e0605a; --warn: #e0a53a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); font: 13px/1.5 -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  #topbar {
    display: flex; align-items: center; gap: 12px; padding: 8px 14px;
    background: var(--panel2); border-bottom: 1px solid var(--line); flex: none;
  }
  #topbar h1 { font-size: 14px; margin: 0; font-weight: 600; color: #cfd6ff; }
  #syncBadge { padding: 3px 10px; border-radius: 10px; font-size: 12px; cursor: default; }
  #syncBadge.ok { background: rgba(94,194,106,.15); color: var(--ok); border: 1px solid rgba(94,194,106,.4); }
  #syncBadge.bad { background: rgba(224,96,90,.15); color: var(--bad); border: 1px solid rgba(224,96,90,.4); }
  #topbar .spacer { flex: 1; }
  .tabbtn.active { border-color: var(--accent); background: var(--panel2); color: #cfd6ff; }
  #gameSelect {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 5px;
    padding: 6px 8px; font-size: 12px;
  }
  .modelrow {
    padding: 4px 8px 4px 20px; cursor: pointer; border-radius: 4px; display: flex; gap: 6px;
    align-items: baseline; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .modelrow:hover { background: var(--panel2); }
  .modelrow.selected { background: var(--accent2); color: #fff; }
  .modelrow .tag {
    font-size: 9.5px; padding: 1px 5px; border-radius: 8px; background: var(--panel2); color: var(--sub);
  }
  .modelrow.selected .tag { background: rgba(255,255,255,.2); color: #fff; }
  .modelrow .tag.editable { color: var(--ok); }
  .modelrow .tag.complex { color: var(--warn); }
  #t_text { width: 100%; min-height: 360px; font: 12px/1.5 Consolas, "D2Coding", monospace; tab-size: 2; }
  .tnote { color: var(--sub); font-size: 11.5px; margin: 4px 0 10px; }
  .tnote.warn { color: var(--warn); }
  #previewFrame {
    width: 100%; height: 320px; border: 1px solid var(--line); border-radius: 8px; background: #22262c;
  }
  .preview-hint { color: var(--sub); font-size: 11px; margin: 6px 0 14px; }
  button {
    background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 5px;
    padding: 6px 12px; cursor: pointer; font-size: 12px;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent2); border-color: var(--accent2); color: #fff; }
  button.primary:hover { background: var(--accent); }
  button.danger { border-color: var(--bad); color: var(--bad); }
  button.danger:hover { background: rgba(224,96,90,.15); }
  button:disabled { opacity: .4; cursor: default; }
  #main { flex: 1; display: flex; min-height: 0; }
  #tree {
    width: 300px; flex: none; background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
  }
  #treeSearch { margin: 8px; }
  #treeSearch input {
    width: 100%; background: var(--panel2); border: 1px solid var(--line); border-radius: 5px;
    color: var(--text); padding: 6px 8px; font-size: 12px;
  }
  #treeScroll { flex: 1; overflow-y: auto; padding: 0 4px 8px; }
  .root-node { margin-bottom: 4px; }
  .root-label {
    display: flex; align-items: center; gap: 6px; padding: 6px 8px; font-weight: 600; cursor: pointer;
    color: #cfd6ff; user-select: none;
  }
  .root-label .addbtn { margin-left: auto; font-size: 11px; padding: 2px 8px; }
  .group-label {
    padding: 4px 8px 4px 20px; color: var(--sub); font-size: 11.5px; cursor: pointer; user-select: none;
  }
  .leaf {
    padding: 4px 8px 4px 32px; cursor: pointer; border-radius: 4px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; display: flex; gap: 6px; align-items: baseline;
  }
  .leaf:hover { background: var(--panel2); }
  .leaf.selected { background: var(--accent2); color: #fff; }
  .leaf .lid { color: var(--sub); font-size: 10.5px; }
  .leaf.selected .lid { color: #d8e0ff; }
  #inspector { flex: 1; overflow-y: auto; padding: 18px 22px; }
  #inspector.empty { display: flex; align-items: center; justify-content: center; color: var(--sub); }
  .insp-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .insp-head .emoji { font-size: 26px; }
  .insp-head .title { font-size: 16px; font-weight: 600; }
  .insp-head .idtag { color: var(--sub); font-size: 12px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; margin-bottom: 4px; color: var(--sub); font-size: 11.5px; }
  .field input[type=text], .field input[type=number], .field select, .field textarea {
    width: 100%; background: var(--panel2); border: 1px solid var(--line); border-radius: 5px;
    color: var(--text); padding: 7px 9px; font-size: 13px; font-family: inherit;
  }
  .field textarea { resize: vertical; min-height: 52px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .hint { color: var(--sub); font-size: 11px; margin-top: 3px; }
  .warnbox {
    background: rgba(224,165,58,.1); border: 1px solid rgba(224,165,58,.35); color: var(--warn);
    padding: 8px 10px; border-radius: 6px; font-size: 11.5px; margin-bottom: 14px;
  }
  #insp-actions { display: flex; gap: 8px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
  #resultLog {
    flex: none; max-height: 140px; overflow-y: auto; background: var(--panel2);
    border-top: 1px solid var(--line); padding: 8px 14px; font-size: 11.5px; font-family: Consolas, monospace;
  }
  #resultLog .line { padding: 2px 0; }
  #resultLog .ok { color: var(--ok); }
  #resultLog .bad { color: var(--bad); }
  .dirtydot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); display: inline-block; margin-left: 6px; }
</style>
</head>
<body>
  <div id="topbar">
    <h1>saga-web 콘텐츠 에디터</h1>
    <button id="modeContent" class="tabbtn">콘텐츠(인물·펫)</button>
    <button id="modeModels" class="tabbtn">3D 자산</button>
    <button id="modeTables" class="tabbtn">판별 표(data-*.js)</button>
    <select id="gameSelect" hidden></select>
    <input type="file" id="uploadInput" accept=".fbx,.obj,.mtl,.glb,.gltf,.webp,.png,.jpg,.jpeg" multiple hidden>
    <button id="btnUpload" hidden title="OBJ 는 MTL·텍스처를 함께 골라 올리면 GLB 하나로 합쳐 넣는다">업로드(FBX·OBJ·GLB·이미지)</button>
    <span id="syncBadge">확인 중…</span>
    <div class="spacer"></div>
    <button id="btnRefresh">새로고침</button>
    <span id="playMount" style="display:flex;gap:4px"></span>
  </div>
  <div id="main">
    <div id="tree">
      <div id="treeSearch"><input type="text" id="searchInput" placeholder="이름·id·파일명으로 찾기"></div>
      <div id="treeScroll"></div>
    </div>
    <div id="inspector" class="empty">왼쪽에서 인물이나 펫을 고르세요.</div>
  </div>
  <div id="resultLog"></div>

<script>
'use strict';
const API = '';
let content = null;   // { heroes, pets, bios, eras, petGroups }
let selected = null;  // { kind: 'hero'|'pet', id, isNew }
let dirty = false;
let mode = 'content'; // 'content' | 'models' | 'tables'
let tablesList = null;     // [{game,file,name,count}]
let tableCache = {};       // 'game|file|name' → {entries, exempt}
let tableSel = null;       // {game,file,name,index}
const GAMES = ['saga-go', 'saga-dungeon', 'saga-forest', 'saga-story', 'saga-realm'];
let modelsGame = 'saga-dungeon';
let modelsData = null;   // { entries, files }
let modelsSelected = null; // { type: 'entry'|'file', key|path }

const el = (sel) => document.querySelector(sel);
const treeScroll = el('#treeScroll');
const inspector = el('#inspector');
const resultLog = el('#resultLog');

function log(text, ok) {
  const div = document.createElement('div');
  div.className = 'line ' + (ok ? 'ok' : 'bad');
  div.textContent = (ok ? '✓ ' : '✗ ') + text;
  resultLog.prepend(div);
  // 파일을 고친 기록이면 열려 있는 "▶ 실행" 창을 새로 띄운다(고친 것을 곧바로 본다)
  if (ok && window.SagaPlay && /저장|반영|업로드|바꿈|추가|삭제/.test(text)) SagaPlay.reloadIfOpen();
}

function logResults(action, results) {
  const ok = Object.values(results).every((r) => r.ok);
  const fails = Object.entries(results).filter(([, r]) => !r.ok);
  if (ok) {
    log(action + ' — 다섯 판 모두 반영됨', true);
  } else {
    log(action + ' — 일부 실패: ' + fails.map(([g, r]) => g + '(' + r.reason + ')').join(', '), false);
  }
}

async function loadStatus() {
  const r = await fetch(API + '/api/status');
  const s = await r.json();
  const badge = el('#syncBadge');
  if (s.synced) {
    badge.textContent = '다섯 판 동기화됨';
    badge.className = 'ok';
  } else {
    const bad = s.games.filter((g) => !g.exists || g.contentHash !== s.games[0].contentHash);
    badge.textContent = '불일치: ' + bad.map((g) => g.game).join(', ');
    badge.className = 'bad';
  }
}

async function loadContent() {
  const r = await fetch(API + '/api/content');
  content = await r.json();
  renderTree();
}

function matchesSearch(item, q) {
  if (!q) return true;
  q = q.toLowerCase();
  return (item.name && item.name.toLowerCase().includes(q)) || (item.id && item.id.toLowerCase().includes(q));
}

function renderTree() {
  if (mode === 'tables') return renderTablesTree();
  if (mode === 'models') return renderModelsTree();
  return renderContentTree();
}

function renderInspector() {
  if (mode === 'tables') return renderTablesInspector();
  if (mode === 'models') return renderModelsInspector();
  return renderContentInspector();
}

function renderContentTree() {
  const q = el('#searchInput').value.trim();
  treeScroll.innerHTML = '';

  treeScroll.appendChild(buildRoot('인물 (HEROES)', content.eras, content.heroes, 'hero', q));
  treeScroll.appendChild(buildRoot('펫 (PETS)', content.petGroups, content.pets, 'pet', q));
}

function buildRoot(label, groups, items, kind, q) {
  const root = document.createElement('div');
  root.className = 'root-node';
  const head = document.createElement('div');
  head.className = 'root-label';
  head.innerHTML = '<span>▾ ' + label + ' (' + items.length + ')</span>';
  const add = document.createElement('button');
  add.className = 'addbtn';
  add.textContent = '+ 새로 추가';
  add.onclick = (e) => { e.stopPropagation(); openNewEntry(kind); };
  head.appendChild(add);
  root.appendChild(head);

  const body = document.createElement('div');
  head.onclick = () => { body.style.display = body.style.display === 'none' ? '' : 'none'; };

  const allGroups = groups.slice();
  items.forEach((it) => {
    const g = kind === 'hero' ? it.era : it._group;
    if (g && allGroups.indexOf(g) === -1) allGroups.push(g);
  });

  allGroups.forEach((g) => {
    const groupItems = items.filter((it) => (kind === 'hero' ? it.era : it._group) === g).filter((it) => matchesSearch(it, q));
    if (!groupItems.length && q) return;
    const gLabel = document.createElement('div');
    gLabel.className = 'group-label';
    gLabel.textContent = '▾ ' + g + ' (' + groupItems.length + ')';
    const gBody = document.createElement('div');
    gLabel.onclick = () => { gBody.style.display = gBody.style.display === 'none' ? '' : 'none'; };
    body.appendChild(gLabel);
    groupItems.forEach((it) => gBody.appendChild(buildLeaf(it, kind)));
    body.appendChild(gBody);
  });
  root.appendChild(body);
  return root;
}

function buildLeaf(item, kind) {
  const leaf = document.createElement('div');
  leaf.className = 'leaf';
  if (selected && selected.kind === kind && selected.id === item.id) leaf.classList.add('selected');
  leaf.innerHTML = '<span>' + (item.emoji || '') + ' ' + escapeHtml(item.name) + '</span><span class="lid">' + item.id + '</span>';
  leaf.onclick = () => selectEntry(kind, item.id);
  return leaf;
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function selectEntry(kind, id) {
  if (dirty && !confirm('저장하지 않은 변경사항이 있습니다. 버리고 이동할까요?')) return;
  selected = { kind, id, isNew: false };
  dirty = false;
  renderTree();
  renderInspector();
}

function openNewEntry(kind) {
  if (dirty && !confirm('저장하지 않은 변경사항이 있습니다. 버리고 새로 만들까요?')) return;
  selected = { kind, id: null, isNew: true };
  dirty = false;
  renderInspector();
}

const TRAITS = [['might', '무(武)'], ['wisdom', '지(智)'], ['virtue', '덕(德)']];
const KINDS = [['beast', '동물'], ['divine', '신수']];
const STATS = [['might', '무력'], ['wisdom', '지력'], ['command', '통솔']];

function field(labelText, inputHtml, hint) {
  return '<div class="field"><label>' + labelText + '</label>' + inputHtml + (hint ? '<div class="hint">' + hint + '</div>' : '') + '</div>';
}

function renderContentInspector() {
  if (!selected) {
    inspector.className = 'empty';
    inspector.innerHTML = '왼쪽에서 인물이나 펫을 고르세요.';
    return;
  }
  inspector.className = '';
  const isHero = selected.kind === 'hero';
  const data = selected.isNew ? {} : (isHero ? content.heroes : content.pets).find((x) => x.id === selected.id) || {};
  const bio = isHero ? (content.bios[selected.id] || '') : null;

  let html = '';
  html += '<div class="insp-head"><span class="emoji">' + (data.emoji || '❔') + '</span>';
  html += '<span class="title">' + (selected.isNew ? '새 ' + (isHero ? '인물' : '펫') + ' 만들기' : escapeHtml(data.name)) + '</span>';
  if (!selected.isNew) html += '<span class="idtag">' + data.id + '</span>';
  html += '</div>';

  html += '<div class="warnbox">이름·한자는 실존 인물 실명을 그대로 쓰지 않습니다 — 가명만 씁니다. id 는 세이브·연성에 물려 있어 한번 정하면 바꾸지 않습니다.</div>';

  html += field('id' + (selected.isNew ? ' (한번 정하면 못 바꿉니다)' : ''),
    '<input type="text" id="f_id" value="' + escapeHtml(data.id || '') + '" ' + (selected.isNew ? '' : 'disabled') + '>');

  html += field('표시 이름', '<input type="text" id="f_name" value="' + escapeHtml(data.name || '') + '">');

  if (isHero) {
    html += '<div class="row2">';
    html += field('시대(era)', '<input type="text" id="f_era" list="eraList" value="' + escapeHtml(data.era || '') + '">');
    html += field('세력(faction)', '<input type="text" id="f_faction" value="' + escapeHtml(data.faction || '') + '">');
    html += '</div>';
    html += '<datalist id="eraList">' + content.eras.map((e) => '<option value="' + escapeHtml(e) + '">').join('') + '</datalist>';

    html += '<div class="row2">';
    html += field('희귀도(rarity 1~5)', '<input type="number" id="f_rarity" min="1" max="5" value="' + (data.rarity || 3) + '">');
    html += field('기질(trait)', '<select id="f_trait">' + TRAITS.map(([k, l]) => '<option value="' + k + '"' + (data.trait === k ? ' selected' : '') + '>' + l + '</option>').join('') + '</select>');
    html += '</div>';

    html += '<div class="row3">';
    STATS.forEach(([k, l]) => {
      html += field(l + ' (' + k + ')', '<input type="number" id="f_stat_' + k + '" min="0" max="100" value="' + ((data.stats && data.stats[k]) || 50) + '">');
    });
    html += '</div>';

    html += '<div class="row2">';
    html += field('emoji', '<input type="text" id="f_emoji" value="' + escapeHtml(data.emoji || '') + '">');
    html += field('한자/원어(hanja)', '<input type="text" id="f_hanja" value="' + escapeHtml(data.hanja || '') + '">');
    html += '</div>';

    html += field('등용 대사(quote)', '<textarea id="f_quote">' + escapeHtml(data.quote || '') + '</textarea>');
    html += field('열전(BIOS, 없어도 됨) — 실명·실제 사건 서술 대신 오마주로 씁니다', '<textarea id="f_bio">' + escapeHtml(bio || '') + '</textarea>');
  } else {
    html += '<div class="row2">';
    html += field('종류(kind)', '<select id="f_kind">' + KINDS.map(([k, l]) => '<option value="' + k + '"' + (data.kind === k ? ' selected' : '') + '>' + l + '</option>').join('') + '</select>');
    html += field('그룹(트리 분류용)', '<input type="text" id="f_group" list="petGroupList" value="' + escapeHtml(data._group || '') + '">');
    html += '</div>';
    html += '<datalist id="petGroupList">' + content.petGroups.map((g) => '<option value="' + escapeHtml(g) + '">').join('') + '</datalist>';

    html += '<div class="row3">';
    html += field('희귀도(rarity 1~5)', '<input type="number" id="f_rarity" min="1" max="5" value="' + (data.rarity || 3) + '">');
    html += field('emoji', '<input type="text" id="f_emoji" value="' + escapeHtml(data.emoji || '') + '">');
    html += field('포획확률(catchBase 0~1)', '<input type="number" id="f_catch" step="0.01" min="0" max="1" value="' + (data.catchBase != null ? data.catchBase : 0.5) + '">');
    html += '</div>';

    html += '<div class="row2">';
    html += field('보너스 스탯(bonus.stat)', '<select id="f_bstat">' + STATS.concat([['virtue', '덕']]).map(([k, l]) => '<option value="' + k + '"' + ((data.bonus && data.bonus.stat) === k ? ' selected' : '') + '>' + l + '</option>').join('') + '</select>');
    html += field('보너스 값(bonus.value)', '<input type="number" id="f_bvalue" value="' + ((data.bonus && data.bonus.value) || 3) + '">');
    html += '</div>';

    html += field('설명(desc)', '<textarea id="f_desc">' + escapeHtml(data.desc || '') + '</textarea>');
  }

  html += '<div id="insp-actions">';
  html += '<button class="primary" id="btnSave">' + (selected.isNew ? '추가' : '저장') + '</button>';
  if (!selected.isNew) html += '<button class="danger" id="btnDelete">삭제</button>';
  html += '<button id="btnCancel">' + (selected.isNew ? '취소' : '되돌리기') + '</button>';
  html += '</div>';

  inspector.innerHTML = html;
  inspector.querySelectorAll('input, textarea, select').forEach((elm) => elm.addEventListener('input', () => { dirty = true; }));
  el('#btnSave').onclick = () => saveEntry(isHero);
  el('#btnCancel').onclick = () => { dirty = false; renderInspector(); };
  if (!selected.isNew) el('#btnDelete').onclick = () => deleteEntry(isHero);
}

function collectFields(isHero) {
  const id = el('#f_id').value.trim();
  if (!id) { alert('id 를 입력하세요.'); return null; }
  const name = el('#f_name').value.trim();
  if (!name) { alert('표시 이름을 입력하세요.'); return null; }
  if (isHero) {
    return {
      id, name,
      era: el('#f_era').value.trim(),
      faction: el('#f_faction').value.trim(),
      rarity: Number(el('#f_rarity').value),
      trait: el('#f_trait').value,
      stats: { might: Number(el('#f_stat_might').value), wisdom: Number(el('#f_stat_wisdom').value), command: Number(el('#f_stat_command').value) },
      emoji: el('#f_emoji').value.trim(),
      hanja: el('#f_hanja').value.trim(),
      quote: el('#f_quote').value.trim(),
    };
  }
  return {
    id, name,
    kind: el('#f_kind').value,
    rarity: Number(el('#f_rarity').value),
    emoji: el('#f_emoji').value.trim(),
    catchBase: Number(el('#f_catch').value),
    bonus: { stat: el('#f_bstat').value, value: Number(el('#f_bvalue').value) },
    desc: el('#f_desc').value.trim(),
    _group: el('#f_group').value.trim(),
  };
}

async function saveEntry(isHero) {
  const fields = collectFields(isHero);
  if (!fields) return;
  const bioText = isHero ? el('#f_bio').value.trim() : null;
  const endpoint = isHero ? '/api/hero/save' : '/api/pet/save';
  const r = await fetch(API + endpoint, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ isNew: selected.isNew, fields }),
  });
  const out = await r.json();
  if (out.error) { alert(out.error); return; }
  logResults((selected.isNew ? '추가' : '저장') + ': ' + fields.name + ' (' + fields.id + ')', out.results);

  if (isHero) {
    const r2 = await fetch(API + '/api/bio/save', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: fields.id, text: bioText }),
    });
    const out2 = await r2.json();
    if (!out2.error) logResults('열전 저장: ' + fields.id, out2.results);
  }

  selected = { kind: isHero ? 'hero' : 'pet', id: fields.id, isNew: false };
  dirty = false;
  await loadContent();
  await loadStatus();
  renderInspector();
}

async function deleteEntry(isHero) {
  if (!confirm('"' + selected.id + '" 를 다섯 판에서 모두 삭제할까요? 되돌리려면 git 으로 복원해야 합니다.')) return;
  const r = await fetch(API + '/api/delete', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ kind: isHero ? 'hero' : 'pet', id: selected.id }),
  });
  const out = await r.json();
  if (out.error) { alert(out.error); return; }
  logResults('삭제: ' + selected.id, out.results);
  selected = null;
  dirty = false;
  await loadContent();
  await loadStatus();
  renderInspector();
}

/* ── 3D 자산(asset3d.js DEFAULTS) — 판마다 내용이 다르고 공유하지 않는다 ── */

function groupOfKey(key) {
  const m = key.match(/^([a-zA-Z]+)[_:]/);
  return m ? m[1] : key;
}

async function loadModels() {
  const r = await fetch(API + '/api/models/' + modelsGame);
  modelsData = await r.json();
  if (modelsData.error) { alert(modelsData.error); modelsData = { entries: [], files: [] }; }
  renderTree();
}

function renderModelsTree() {
  const q = el('#searchInput').value.trim().toLowerCase();
  treeScroll.innerHTML = '';
  if (!modelsData) return;

  const root1 = document.createElement('div');
  root1.className = 'root-node';
  const groups = {};
  modelsData.entries.forEach((e) => {
    const g = groupOfKey(e.key);
    (groups[g] = groups[g] || []).push(e);
  });
  const head1 = document.createElement('div');
  head1.className = 'root-label';
  head1.innerHTML = '<span>▾ DEFAULTS 항목 (' + modelsData.entries.length + ')</span>';
  const body1 = document.createElement('div');
  head1.onclick = () => { body1.style.display = body1.style.display === 'none' ? '' : 'none'; };
  root1.appendChild(head1);
  Object.keys(groups).sort().forEach((g) => {
    const items = groups[g].filter((e) => !q || e.key.toLowerCase().includes(q) || (e.path || '').toLowerCase().includes(q));
    if (!items.length) return;
    const gLabel = document.createElement('div');
    gLabel.className = 'group-label';
    gLabel.textContent = '▾ ' + g + ' (' + items.length + ')';
    const gBody = document.createElement('div');
    gLabel.onclick = () => { gBody.style.display = gBody.style.display === 'none' ? '' : 'none'; };
    body1.appendChild(gLabel);
    items.forEach((e) => {
      const row = document.createElement('div');
      row.className = 'modelrow';
      if (modelsSelected && modelsSelected.type === 'entry' && modelsSelected.key === e.key) row.classList.add('selected');
      const tag = e.kind === 'complex' ? '<span class="tag complex">복잡</span>' : '<span class="tag editable">편집가능</span>';
      row.innerHTML = '<span>' + e.key + '</span>' + tag;
      row.onclick = () => { modelsSelected = { type: 'entry', key: e.key }; renderModelsTree(); renderModelsInspector(); };
      gBody.appendChild(row);
    });
    body1.appendChild(gBody);
  });
  root1.appendChild(body1);
  treeScroll.appendChild(root1);

  const root2 = document.createElement('div');
  root2.className = 'root-node';
  const head2 = document.createElement('div');
  head2.className = 'root-label';
  head2.innerHTML = '<span>▾ 파일 찾아보기 (' + modelsData.files.length + ')</span>';
  const body2 = document.createElement('div');
  head2.onclick = () => { body2.style.display = body2.style.display === 'none' ? '' : 'none'; };
  root2.appendChild(head2);
  modelsData.files.filter((f) => !q || f.path.toLowerCase().includes(q)).forEach((f) => {
    const row = document.createElement('div');
    row.className = 'modelrow';
    if (modelsSelected && modelsSelected.type === 'file' && modelsSelected.path === f.path) row.classList.add('selected');
    row.innerHTML = '<span>' + f.path.split('/').pop() + '</span><span class="tag">' + (f.type === 'image' ? '이미지' : '모델') + '</span>';
    row.title = f.path;
    row.onclick = () => { modelsSelected = { type: 'file', path: f.path, fileType: f.type }; renderModelsTree(); renderModelsInspector(); };
    body2.appendChild(row);
  });
  root2.appendChild(body2);
  treeScroll.appendChild(root2);
}

function isImagePath(p) {
  return /\.(webp|png|jpe?g)$/i.test(p || '');
}

function previewHtmlFor(game, file) {
  if (!file) return '<div id="previewFrame" style="display:flex;align-items:center;justify-content:center;color:var(--sub)">미리볼 파일 없음</div>';
  if (isImagePath(file)) {
    return '<img id="previewFrame" style="object-fit:contain" src="/static/' + encodeURIComponent(game) + '/' + file.split('/').map(encodeURIComponent).join('/') + '">';
  }
  return '<iframe id="previewFrame" src="/preview3d.html?game=' + encodeURIComponent(game) + '&file=' + encodeURIComponent(file) + '"></iframe>';
}

function renderModelsInspector() {
  if (!modelsSelected) {
    inspector.className = 'empty';
    inspector.innerHTML = '왼쪽에서 DEFAULTS 항목이나 자산 파일을 고르세요.';
    return;
  }
  inspector.className = '';
  let html = '';
  let previewFile = null;

  if (modelsSelected.type === 'entry') {
    const e = modelsData.entries.find((x) => x.key === modelsSelected.key);
    html += '<div class="insp-head"><span class="title">' + e.key + '</span></div>';
    if (e.kind === 'complex') {
      html += '<div class="warnbox">이 항목은 배열 후보군이거나 다른 변수를 참조하는 복잡한 표현식이라 여기서는 못 바꿉니다 — 원본: <code>' + escapeHtml(e.raw) + '</code></div>';
    } else {
      previewFile = e.path;
      const modelFiles = modelsData.files.filter((f) => f.type === 'model');
      html += field('현재 파일', '<input type="text" id="m_current" value="' + escapeHtml(e.path) + '" disabled>');
      html += field('바꿀 파일', '<select id="m_newfile">' + modelFiles.map((f) => '<option value="' + escapeHtml(f.path) + '"' + (f.path === e.path ? ' selected' : '') + '>' + escapeHtml(f.path) + '</option>').join('') + '</select>');
      html += '<div id="insp-actions"><button class="primary" id="btnModelSave">저장</button></div>';
    }
  } else {
    previewFile = modelsSelected.path;
    html += '<div class="insp-head"><span class="title">' + previewFile.split('/').pop() + '</span></div>';
    const refs = modelsData.entries.filter((e) => e.path === previewFile);
    html += '<div class="hint">' + previewFile + '</div>';
    html += refs.length
      ? '<div class="preview-hint">현재 이 DEFAULTS 키가 이 파일을 씀: ' + refs.map((r) => r.key).join(', ') + '</div>'
      : '<div class="preview-hint">현재 이 파일을 쓰는 DEFAULTS 항목 없음(미리보기 전용)</div>';
  }

  html += previewHtmlFor(modelsGame, previewFile);

  inspector.innerHTML = html;
  if (el('#btnModelSave')) {
    el('#btnModelSave').onclick = async () => {
      const newPath = el('#m_newfile').value;
      const r = await fetch(API + '/api/models/' + modelsGame + '/save', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key: modelsSelected.key, newPath }),
      });
      const out = await r.json();
      if (out.error) { alert(out.error); return; }
      log('저장: ' + modelsGame + ' / ' + modelsSelected.key + ' → ' + newPath, true);
      await loadModels();
      renderModelsInspector();
    };
  }
}

async function uploadFile(file) {
  const buf = await file.arrayBuffer();
  const r = await fetch(API + '/api/upload/' + modelsGame + '?name=' + encodeURIComponent(file.name), {
    method: 'POST', body: buf,
  });
  await afterUpload(await r.json());
}

/* OBJ 는 MTL·텍스처와 함께 한 번에 보내 GLB 하나로 바꾼다(서버 obj2glb.js, 텍스처는 GLB 안에 들어감). */
async function uploadObjBundle(files) {
  const payload = { files: [] };
  for (const f of files) {
    const bytes = new Uint8Array(await f.arrayBuffer());
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    payload.files.push({ name: f.name, data: btoa(bin) });
  }
  const r = await fetch(API + '/api/upload-obj/' + modelsGame, { method: 'POST', body: JSON.stringify(payload) });
  await afterUpload(await r.json());
}

async function afterUpload(out) {
  if (out.error) { alert(out.error); return; }
  let msg = '업로드: ' + modelsGame + ' / ' + out.path;
  if (out.stats) msg += ' (꼭짓점 ' + out.stats.vertices + '·삼각형 ' + out.stats.triangles + '·재질 ' + out.stats.materials + '·텍스처 ' + out.stats.textures + ')';
  log(msg, true);
  (out.warnings || []).forEach((w) => log('  경고: ' + w, false));
  await loadModels();
  modelsSelected = { type: 'file', path: out.path, fileType: out.type };
  renderModelsTree();
  renderModelsInspector();
}

/* ── 판별 표 ─────────────────────────────────────────────
   각 판 js/data-*.js 의 `var NAME = [ {…} ]` 배열을 항목 하나씩 원문 그대로 고친다.
   서버가 구문·동시 수정·실명을 확인하고 그 구간만 바꿔 쓴다(그 판 한 벌, sw.js VERSION 자동 올림). */
async function loadTables() {
  const r = await fetch(API + '/api/tables');
  tablesList = (await r.json()).tables || [];
}

async function loadTable(game, file, name, force) {
  const k = game + '|' + file + '|' + name;
  if (!tableCache[k] || force) {
    const r = await fetch(API + '/api/table?game=' + encodeURIComponent(game) + '&file=' + encodeURIComponent(file) + '&name=' + encodeURIComponent(name));
    tableCache[k] = await r.json();
  }
  return tableCache[k];
}

function renderTablesTree() {
  treeScroll.innerHTML = '';
  if (!tablesList) { treeScroll.textContent = '불러오는 중…'; loadTables().then(renderTablesTree); return; }
  const q = el('#searchInput').value.trim().toLowerCase();
  GAMES.forEach((game) => {
    const mine = tablesList.filter((t) => t.game === game);
    if (!mine.length) return;
    const root = document.createElement('div');
    root.className = 'root-node';
    const head = document.createElement('div');
    head.className = 'root-label';
    head.innerHTML = '<span>▾ ' + game + ' (' + mine.length + '표)</span>';
    const body = document.createElement('div');
    head.onclick = () => { body.style.display = body.style.display === 'none' ? '' : 'none'; };
    root.appendChild(head);
    mine.forEach((t) => {
      const k = game + '|' + t.file + '|' + t.name;
      const cached = tableCache[k];
      const entries = cached && cached.entries ? cached.entries.filter((e) => !q || (e.text || '').toLowerCase().includes(q)) : null;
      if (q && cached && !entries.length) return;
      const g = document.createElement('div');
      g.className = 'group-label';
      g.textContent = (cached ? '▾ ' : '▸ ') + t.file.replace(/\.js$/, '') + ' · ' + t.name + ' (' + t.count + ')';
      const gb = document.createElement('div');
      g.onclick = async () => { await loadTable(game, t.file, t.name); renderTablesTree(); };
      body.appendChild(g);
      (entries || []).forEach((e) => {
        const leaf = document.createElement('div');
        leaf.className = 'leaf';
        if (tableSel && tableSel.game === game && tableSel.file === t.file && tableSel.name === t.name && tableSel.index === e.index) leaf.classList.add('selected');
        leaf.innerHTML = '<span>' + escapeHtml(e.label || e.id || ('#' + e.index)) + '</span><span class="lid">' + escapeHtml(e.id || ('#' + e.index)) + '</span>';
        leaf.onclick = () => {
          if (dirty && !confirm('저장하지 않은 변경사항이 있습니다. 버리고 이동할까요?')) return;
          tableSel = { game, file: t.file, name: t.name, index: e.index };
          dirty = false; renderTablesTree(); renderTablesInspector();
        };
        gb.appendChild(leaf);
      });
      body.appendChild(gb);
    });
    root.appendChild(body);
    treeScroll.appendChild(root);
  });
}

function renderTablesInspector() {
  if (!tableSel) {
    inspector.className = 'empty';
    inspector.textContent = '왼쪽에서 판 → 표를 펼쳐 항목을 고르세요. 그 판 한 벌만 고칩니다(data.js 다섯 벌 도감은 "콘텐츠" 탭).';
    return;
  }
  const t = tableCache[tableSel.game + '|' + tableSel.file + '|' + tableSel.name];
  const e = t && t.entries[tableSel.index];
  if (!e) { inspector.className = 'empty'; inspector.textContent = '항목을 못 찾음 — 새로고침'; return; }
  inspector.className = '';
  let html = '<h2>' + escapeHtml(tableSel.game + ' / ' + tableSel.file + ' / ' + tableSel.name + '[' + e.index + ']') + '</h2>';
  html += '<div class="tnote">원문 그대로 고칩니다. 키·id 는 세이브·진단이 물고 있을 수 있어 바꾸지 않는 편이 안전합니다. ' +
    '저장하면 서버가 ① 그새 바뀌지 않았는지 ② 항목·파일 구문 ③ 실명을 확인한 뒤 이 구간만 바꿔 쓰고, 이 판 sw.js VERSION 을 올립니다.</div>';
  if (t.exempt) html += '<div class="tnote warn">이 파일은 실명 가드 예외(역사 퀴즈)입니다.</div>';
  html += '<textarea id="t_text" spellcheck="false">' + escapeHtml(e.text) + '</textarea>';
  html += '<div id="insp-actions"><button class="primary" id="btnTSave">저장</button><button id="btnTRevert">되돌리기</button></div>';
  inspector.innerHTML = html;
  el('#t_text').oninput = () => { dirty = true; };
  el('#btnTRevert').onclick = () => { dirty = false; renderTablesInspector(); };
  el('#btnTSave').onclick = async () => {
    const body = { ...tableSel, oldText: e.text, newText: el('#t_text').value };
    const r = await fetch(API + '/api/table/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const out = await r.json();
    const label = tableSel.game + '/' + tableSel.file + ' ' + tableSel.name + '[' + e.index + ']';
    if (out.error) { log(label + ' — ' + out.error, false); alert(out.error); return; }
    log(label + ' 저장' + (out.sw && out.sw.version ? ' · sw.js ' + out.sw.version + (out.sw.already ? '(이미 올림)' : '') : ''), true);
    dirty = false;
    await loadTable(tableSel.game, tableSel.file, tableSel.name, true);
    renderTablesTree(); renderTablesInspector();
  };
}

function setMode(next) {
  mode = next;
  el('#modeContent').classList.toggle('active', mode === 'content');
  el('#modeModels').classList.toggle('active', mode === 'models');
  el('#modeTables').classList.toggle('active', mode === 'tables');
  el('#gameSelect').hidden = mode !== 'models';
  el('#btnUpload').hidden = mode !== 'models';
  el('#syncBadge').hidden = mode !== 'content';
  el('#searchInput').placeholder = mode === 'models' ? '키·파일명으로 찾기' : mode === 'tables' ? '펼친 표 안에서 글자로 찾기' : '이름·id로 찾기';
  if (mode === 'models' && !modelsData) loadModels();
  renderTree();
  renderInspector();
}

el('#modeContent').onclick = () => setMode('content');
el('#modeModels').onclick = () => setMode('models');
el('#modeTables').onclick = () => setMode('tables');
el('#gameSelect').innerHTML = GAMES.map((g) => '<option value="' + g + '"' + (g === modelsGame ? ' selected' : '') + '>' + g + '</option>').join('');
el('#gameSelect').onchange = async (e) => {
  modelsGame = e.target.value;
  modelsSelected = null;
  modelsData = null;
  await loadModels();
  renderInspector();
};

el('#btnUpload').onclick = () => el('#uploadInput').click();
el('#uploadInput').onchange = async (e) => {
  const files = Array.from(e.target.files);
  e.target.value = '';
  const ext = (f) => (f.name.match(/\.[^.]+$/) || [''])[0].toLowerCase();
  const objs = files.filter((f) => ext(f) === '.obj');
  if (objs.length > 1) { alert('OBJ 는 한 번에 하나씩 올린다(MTL·텍스처는 함께 골라도 됨)'); return; }
  if (objs.length === 1) {
    // OBJ 묶음: OBJ·MTL·이미지 전부 한 번에. 묶음 밖 파일(GLB·FBX)은 따로 올린다
    const bundle = files.filter((f) => ['.obj', '.mtl', '.png', '.jpg', '.jpeg', '.webp'].includes(ext(f)));
    await uploadObjBundle(bundle);
    for (const f of files) if (!bundle.includes(f)) await uploadFile(f);
    return;
  }
  if (files.some((f) => ext(f) === '.mtl')) { alert('MTL 은 OBJ 와 함께 골라 올린다'); return; }
  for (const f of files) await uploadFile(f);
};

el('#btnRefresh').onclick = async () => {
  if (mode === 'tables') { tablesList = null; tableCache = {}; tableSel = null; dirty = false; renderTree(); renderInspector(); return; }
  if (mode === 'models') { await loadModels(); renderInspector(); return; }
  await loadContent(); await loadStatus(); renderInspector();
};
el('#searchInput').addEventListener('input', renderTree);

(async function init() {
  setMode('content');
  await loadContent();
  await loadStatus();
})();
</script>
