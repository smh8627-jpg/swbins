<!doctype html>
<html><head><meta charset="utf-8"><title>3D 미리보기</title>
<style>
  html, body { margin: 0; height: 100%; background: #22262c; overflow: hidden; }
  #msg { position: absolute; top: 8px; left: 10px; color: #9ac; font: 12px Consolas, monospace; }
  #msg.err { color: #e77; }
</style>
</head>
<body>
<div id="msg">불러오는 중…</div>
<script>
'use strict';
var qs = new URLSearchParams(location.search);
var game = qs.get('game');
var file = qs.get('file');
var msg = document.getElementById('msg');
if (!game || !file) {
  msg.textContent = 'game·file 파라미터가 없습니다.';
  msg.className = 'err';
} else {
  var s = document.createElement('script');
  s.src = '/static/' + game + '/js/vendor/three.iife.js';
  s.onload = start;
  s.onerror = function () { msg.textContent = 'three.js 로드 실패'; msg.className = 'err'; };
  document.head.appendChild(s);
}

function start() {
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  document.body.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x22262c);
  var camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.05, 200);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x33363c, 2.2));
  var dir = new THREE.DirectionalLight(0xffffff, 2);
  dir.position.set(3, 5, 4);
  scene.add(dir);
  var grid = new THREE.GridHelper(10, 20, 0x444a55, 0x33383f);
  scene.add(grid);

  // 간단한 마우스 궤도 조작(회전 + 휠 줌) — OrbitControls 가 vendor 번들에
  // 없어서 손으로 만든다. target 을 중심으로 구면 좌표로 카메라를 돈다.
  var target = new THREE.Vector3(0, 0.8, 0);
  var radius = 3, theta = Math.PI / 4, phi = Math.PI / 2.6;
  var dragging = false, lastX = 0, lastY = 0;
  function applyCam() {
    camera.position.set(
      target.x + radius * Math.sin(phi) * Math.sin(theta),
      target.y + radius * Math.cos(phi),
      target.z + radius * Math.sin(phi) * Math.cos(theta)
    );
    camera.lookAt(target);
  }
  renderer.domElement.addEventListener('mousedown', function (e) { dragging = true; lastX = e.clientX; lastY = e.clientY; });
  window.addEventListener('mouseup', function () { dragging = false; });
  window.addEventListener('mousemove', function (e) {
    if (!dragging) return;
    theta -= (e.clientX - lastX) * 0.008;
    phi = Math.max(0.15, Math.min(Math.PI - 0.15, phi - (e.clientY - lastY) * 0.008));
    lastX = e.clientX; lastY = e.clientY;
    applyCam();
  });
  renderer.domElement.addEventListener('wheel', function (e) {
    radius = Math.max(0.3, Math.min(30, radius * (1 + e.deltaY * 0.001)));
    applyCam();
    e.preventDefault();
  }, { passive: false });
  applyCam();

  var loader = new THREE.GLTFLoader();
  if (THREE.MeshoptDecoder) loader.setMeshoptDecoder(THREE.MeshoptDecoder);
  var mixer = null;
  var url = '/static/' + game + '/' + file;
  loader.load(url, function (gltf) {
    scene.add(gltf.scene);
    var box = new THREE.Box3().setFromObject(gltf.scene);
    var size = box.getSize(new THREE.Vector3());
    var center = box.getCenter(new THREE.Vector3());
    var maxDim = Math.max(size.x, size.y, size.z) || 1;
    target.copy(center);
    radius = maxDim * 1.8;
    applyCam();
    msg.textContent = file + ' — ' + (gltf.animations || []).length + '개 애니메이션';
    if (gltf.animations && gltf.animations.length) {
      mixer = new THREE.AnimationMixer(gltf.scene);
      mixer.clipAction(gltf.animations[0]).play();
    }
  }, undefined, function (err) {
    msg.textContent = '로드 실패: ' + (err && err.message || err);
    msg.className = 'err';
  });

  var clock = new THREE.Clock();
  (function tick() {
    var dt = clock.getDelta();
    if (mixer) mixer.update(dt);
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  })();

  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}
</script>
</body></html>
