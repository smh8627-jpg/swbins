<!-- three 를 **씨앗보다 먼저** 싣는다.
     three 는 켜지면서 UUID 를 만드느라 `Math.random()` 을 **76번** 부른다
     (직접 세어 봤다). 씨앗을 갈아 둔 뒤에 실으면 그 76번이 수열을 밀어
     게임과 무관한 항목이 깨진다 — 실제로 원소 피해 항목 하나가 그렇게 넘어졌다.
     본판(`index.html`)은 순서를 안 바꿨다. 거기서는 씨앗을 안 갈기 때문이다. -->
<script src="js/vendor/three.iife.js"></script>

<script>
window.DG_NO_DRAW = true; window.DG_NO_ACCOUNT = true; window.DG_NO_TUNE = true;

/* 무작위 고정 — 진단이 굴릴 때마다 달라지면 판정이 흔들린다.
   게임 스크립트보다 **먼저** 갈아 둬야 부트에서 쓰는 난수까지 잡힌다.
   (실제 플레이는 그대로다 — 이 파일 안에서만 바꾼다)
   mulberry32: 짧고 분포가 고르며 같은 씨앗이면 같은 수열이 나온다. */
(function (seed) {
  var s = seed >>> 0;
  Math.random = function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  window.DG_SEED = seed;
})(20260824);
</script>

<script>
/* 자가진단 — 헤드리스에서도 돈다 (rAF 가 아니라 setTimeout 을 쓴다).
     chrome --headless=new --virtual-time-budget=25000 --dump-dom http://127.0.0.1:8792/_test.html
*/
(function () {
  var out = [], errors = [];
  window.addEventListener('error', function (e) { errors.push(e.message); });

  function t(name, fn) {
    try {
      var r = fn();
      out.push((r ? '<span class="pass">PASS</span> ' : '<span class="fail">FAIL</span> ') +
        name + (typeof r === 'string' ? ' — ' + r : ''));
      return !!r;
    } catch (e) {
      out.push('<span class="fail">FAIL</span> ' + name + ' — 예외: ' + e.message);
      return false;
    }
  }

  setTimeout(function () {
    var C = DG.core, D = DG.data, HR = DG.hero;
    var DN = DG.dungeon, IT = DG.item, AU = DG.auto, G = DG.game;
    localStorage.removeItem(C.SAVE_KEY);

    /* ── 진단용 밑작업 ──────────────────────────────────
     * 2026-08-26 에 **요구 수준(要求)** 이 들어왔다 — 원작처럼 좋은 물건은
     * 인물 레벨이 차야 입는다. 그런데 진단에는 갓 출사표로 붙은 **1레벨 인물**에게
     * 수준 20짜리를 입히는 항목이 많다. 실제 플레이에서는 깊이 내려가는 동안
     * 인물도 같이 크므로 저절로 맞는 자리다.
     * 그래서 여기서 **동행을 한 번 키워 둔다.** 요구 수준 자체는 아래 전용 항목이
     * 낮은 레벨로 따로 검사한다.
     */
    function levelParty(lv) {
      C.save.party.forEach(function (hid) {
        C.save.heroes[hid] = C.save.heroes[hid] || { lv: 1, exp: 0, rank: 0 };
        C.save.heroes[hid].lv = lv;
      });
    }

    /* ── 갈라져 나온 프로젝트로서의 조건 ─────────────── */

    t('지도 게임의 모듈은 실려 있지 않다', function () {
      var gone = ['world', 'encounter'];
      var leaked = gone.filter(function (k) { return !!DG[k]; });
      return leaked.length === 0 && '지도·조우 없음 (던전 전용)';
    });

    t('데이터는 그대로 물려받았다', function () {
      return D.heroes.length === 70 && D.pets.length === 41 &&
        ('인물 ' + D.heroes.length + ' · 펫 ' + D.pets.length);
    });

    /* ── 인물 합류 (지도가 없으니 이게 유일한 통로) ──── */

    t('출사표 — 처음 시작하면 동행 3명이 붙는다', function () {
      /* boot() 이 이미 돌았다 (fresh 세이브) */
      return C.save.party.length === G.START_PARTY &&
        (C.save.party.length + '명 · ' + C.save.party.join(', '));
    });

    t('밑작업 — 동행을 키워 둔다 (요구 수준 때문에)', function () {
      levelParty(40);
      return C.save.party.every(function (hid) { return HR.info(hid).lv === 40; }) &&
        ('동행 ' + C.save.party.length + '명 Lv.40');
    });

    t('합류 — 없는 인물은 도감에, 있는 인물은 중복으로', function () {
      var h = G.pickNewHero(5);
      var before = Object.keys(C.save.dex.heroes).length;
      G.joinHero(h, '진단');
      var mid = Object.keys(C.save.dex.heroes).length;
      G.joinHero(h, '진단');                       // 같은 인물 = 중복
      var after = Object.keys(C.save.dex.heroes).length;
      var dup = C.save.dex.heroes[h.id].count;
      return mid === before + 1 && after === mid && dup === 2 &&
        (h.name + ' · 도감 ' + after + '명 · 중복 ' + (dup - 1));
    });

    t('보스 보상 — 층이 깊을수록 좋은 인물이 온다', function () {
      var low = 0, high = 0, i;
      for (i = 0; i < 40; i++) {
        var a = G.pickNewHero(2), b = G.pickNewHero(5);
        if (a) { low = Math.max(low, a.rarity); }
        if (b) { high = Math.max(high, b.rarity); }
      }
      return low <= 2 && high >= low && ('얕은 층 최대 ★' + low + ' · 깊은 층 최대 ★' + high);
    });

    t('도감 완성 — 인물 전원을 채우면 한 번만 큰 보상', function () {
      var keepDex = C.save.dex.heroes, keepGold = C.save.player.gold, keepFeat = C.save.player.feat;
      C.save.dex.heroes = {};
      delete C.save.dex.heroesFull;
      D.heroes.forEach(function (h, i) {
        if (i < D.heroes.length - 1) { C.save.dex.heroes[h.id] = { count: 1, firstAt: 0 }; }
      });
      var last = D.heroes[D.heroes.length - 1];
      var goldBefore = C.save.player.gold, featBefore = C.save.player.feat;
      C.emit('dex:new', { cat: 'heroes', id: last.id });   // 마지막 한 명 — 아직 도감엔 없다
      C.save.dex.heroes[last.id] = { count: 1, firstAt: 0 };
      C.emit('dex:new', { cat: 'heroes', id: last.id });    // 등록된 뒤 다시 알림 — 이제 완성
      var gained1 = C.save.player.gold - goldBefore, featGained1 = C.save.player.feat - featBefore;
      C.emit('dex:new', { cat: 'heroes', id: last.id });    // 또 와도 두 번은 안 준다
      var gained2 = C.save.player.gold - goldBefore;
      var ok = gained1 === 3000 && featGained1 === 100 && gained2 === 3000 && C.save.dex.heroesFull === true;
      C.save.dex.heroes = keepDex; C.save.player.gold = keepGold; C.save.player.feat = keepFeat;
      delete C.save.dex.heroesFull;
      return ok && ('완성 보상 금 +' + gained1 + ' · 공적 +' + featGained1 + ', 재지급 없음');
    });

    /* ── 던전 ─────────────────────────────────────────── */

    t('부대가 없으면 못 들어간다', function () {
      var keep = C.save.party.slice();
      C.save.party = [];
      var ok = DN.enter({ floor: 1 });
      C.save.party = keep;
      return ok === false && !DN.active() && '거절됨';
    });

    t('진입 — 방·체력·전투력이 부대에서 나온다', function () {
      var ok = DN.enter({ floor: 1 });
      var st = DN.status();
      var pw = HR.partyPower();
      return ok && st.active && st.floor === 1 && st.roomTotal >= 4 &&
        st.hpMax > 0 && pw.total > 0 &&
        ('제1층 · 방 ' + st.roomTotal + ' · 체력 ' + st.hpMax + ' · 전투력 ' + pw.total);
    });

    t('스킬은 기력을 쓰고 쿨다운이 걸린다', function () {
      var raw = DN.raw();
      raw.mp = 100;
      var cast = DN.castSkill(0);
      var st = DN.status();
      return cast && !DN.castSkill(0) && st.mp < 100 && st.skills[0].cd > 0 &&
        ('기력 ' + st.mp + ' · 쿨 ' + st.skills[0].cd.toFixed(1) + 's');
    });

    t('은사는 상한을 넘지 않는다', function () {
      var raw = DN.raw(), b = DG.dungeonData.BOONS[0];
      raw.boons[b.key] = b.max;
      raw.choice = [b.key];
      return DN.pickBoon(b.key) === false && raw.boons[b.key] === b.max &&
        (b.name + ' 상한 ' + b.max);
    });

    t('탈출하면 노획물이 확정된다', function () {
      var raw = DN.raw();
      raw.loot.gold = 400;
      var g0 = C.save.player.gold;
      var r = DN.leave();
      return !DN.active() && r.gold === 400 && C.save.player.gold === g0 + 400 &&
        ('금 +' + r.gold);
    });

    /* ── 장비 ─────────────────────────────────────────── */

    t('장비 — 뽑고 담고 장착하면 능력치가 오른다', function () {
      var id = C.save.party[0];
      /* 감정(鑑定)은 아래에서 따로 검사한다 — 여기서는 **확인된** 물건을 쓴다.
         안 그러면 미확인이라 장착이 거절되고 이 항목이 엉뚱하게 깨진다. */
      var it = IT.roll(6, { unid: false });
      IT.add(it);
      var b = HR.stats(id);
      var ok = IT.equip(id, it.uid);
      var a = HR.stats(id);
      var up = (a.might + a.wisdom + a.command) - (b.might + b.wisdom + b.command);
      return ok && up >= 0 && (IT.name(it) + ' · 능력치 +' + up);
    });

    /* ── 세공(細工) — 원작의 소켓·젬·룬워드 ───────────── */

    t('구멍은 장비가 나올 때 정해진다 (좋을수록 잘 뚫린다)', function () {
      var IT = DG.item;
      var lowN = 0, hiN = 0, i;
      for (i = 0; i < 300; i++) {
        if (IT.roll(10, { tier: 0 }).sock.length) { lowN++; }
        if (IT.roll(10, { tier: 4 }).sock.length) { hiN++; }
      }
      var max = IT.roll(10, { tier: 4, slot: 'weapon', sock: 3 });
      return hiN > lowN && max.sock.length === 3 &&
        ('상품 ' + lowN + '/300 · 전설 ' + hiN + '/300 · 무기 최대 ' + IT.SOCK_MAX.weapon);
    });

    t('보석은 부위에 따라 다른 것을 준다', function () {
      var IT = DG.item, GD = DG.gemData;
      var w = IT.roll(10, { slot: 'weapon', tier: 4, sock: 1 });
      var a = IT.roll(10, { slot: 'armor', tier: 4, sock: 1 });
      IT.add(w); IT.add(a);
      IT.addMat('gem', 'agate', 0, 2);
      IT.socket(w.uid, 'gem', 'agate', 0);
      IT.socket(a.uid, 'gem', 'agate', 0);
      var we = IT.socketEffects(w)[0], ae = IT.socketEffects(a)[0];
      return we && ae && we.v !== ae.v &&
        ('무기 ' + IT.statKor(we.stat) + ' +' + we.v + ' · 갑주 ' + IT.statKor(ae.stat) + ' +' + ae.v);
    });

    t('등급이 높은 보석일수록 세다', function () {
      var IT = DG.item;
      var a = IT.roll(10, { slot: 'weapon', tier: 4, sock: 1 });
      var b = IT.roll(10, { slot: 'weapon', tier: 4, sock: 1 });
      IT.add(a); IT.add(b);
      IT.addMat('gem', 'jade', 0, 1);
      IT.addMat('gem', 'jade', 4, 1);
      IT.socket(a.uid, 'gem', 'jade', 0);
      IT.socket(b.uid, 'gem', 'jade', 4);
      var lo = IT.socketEffects(a)[0].v, hi = IT.socketEffects(b)[0].v;
      return hi > lo * 3 && ('조 +' + lo + ' → 완 +' + hi);
    });

    t('한 번 박은 것은 뺄 수 없고, 구멍이 차면 더 못 박는다', function () {
      var IT = DG.item;
      var g = IT.roll(10, { slot: 'charm', tier: 4, sock: 1 });
      IT.add(g);
      IT.addMat('gem', 'pearl', 1, 2);
      var a = IT.socket(g.uid, 'gem', 'pearl', 1);
      var b = IT.socket(g.uid, 'gem', 'pearl', 1);
      return a.ok && !b.ok && b.reason === 'nosocket' &&
        typeof IT.unsocket === 'undefined' && '뺄 방법이 없다 (원작과 같다)';
    });

    t('부문을 순서대로 박으면 부문어가 이루어진다', function () {
      var IT = DG.item, GD = DG.gemData;
      var g = IT.roll(20, { slot: 'armor', tier: 4, sock: 3, unid: false });
      IT.add(g);
      ['cheon', 'ji', 'in'].forEach(function (k) { IT.addMat('rune', k, 0, 1); });
      IT.socket(g.uid, 'rune', 'cheon');
      var mid = IT.wordOf(g);
      IT.socket(g.uid, 'rune', 'ji');
      IT.socket(g.uid, 'rune', 'in');
      var w = IT.wordOf(g);
      return !mid && w && w.key === 'cheonjiin' &&
        IT.name(g).indexOf('천지인') >= 0 &&
        ('《' + w.name + '》 · 이름 ' + IT.name(g));
    });

    t('순서가 틀리면 말이 되지 않는다', function () {
      var IT = DG.item;
      var g = IT.roll(20, { slot: 'armor', tier: 4, sock: 3 });
      IT.add(g);
      ['cheon', 'ji', 'in'].forEach(function (k) { IT.addMat('rune', k, 0, 1); });
      IT.socket(g.uid, 'rune', 'in');       // 人 → 地 → 天 (거꾸로)
      IT.socket(g.uid, 'rune', 'ji');
      IT.socket(g.uid, 'rune', 'cheon');
      return IT.wordOf(g) === null && '거꾸로 박으면 안 이루어진다';
    });

    t('부문어가 이루어지면 글자 대신 부문어의 효과가 붙는다', function () {
      var IT = DG.item;
      var g = IT.roll(20, { slot: 'weapon', tier: 4, sock: 2 });
      IT.add(g);
      IT.addMat('rune', 'mun', 0, 1);
      IT.addMat('rune', 'mu', 0, 1);
      IT.socket(g.uid, 'rune', 'mun');
      var before = IT.socketEffects(g).length;
      IT.socket(g.uid, 'rune', 'mu');
      var eff = IT.socketEffects(g);
      var word = IT.wordOf(g);
      var same = eff.length === word.eff.length;
      return before === 1 && word && word.key === 'munmu' && same &&
        ('글자 하나일 땐 ' + before + '줄 · 《문무》 가 되면 ' + eff.length + '줄');
    });

    t('박힌 것이 인물 능력치에 실제로 붙는다 (부적)', function () {
      /* 2026-08-26 부터 보석은 **부위마다 다른 것**을 준다(원작과 같다) —
         무기는 원소 피해, 갑주는 원소 저항, 능력치는 **부적**이다.
         그래서 이 항목은 부적에 박는다. 무기·갑주는 아래 원소 항목이 맡는다. */
      var IT = DG.item;
      var id = C.save.party[0] || Object.keys(C.save.dex.heroes)[0];
      if (!id) { return false; }
      var g = IT.roll(20, { slot: 'charm', tier: 4, sock: 1, unid: false });
      IT.add(g);
      IT.equip(id, g.uid);
      var before = HR.stats(id).might;
      IT.addMat('gem', 'agate', 4, 1);
      IT.socket(g.uid, 'gem', 'agate', 4);
      var after = HR.stats(id).might;
      return after > before && ('무력 ' + Math.round(before) + ' → ' + Math.round(after));
    });

    t('세공 재료는 던전에서 나온다', function () {
      var IT = DG.item;
      C.save.gear.mats = { gem: {}, rune: {}, jewel: [] };
      if (DN.active()) { DN.leave(); }
      DN.enter({ floor: 8 });
      /* 적을 잡아야 나온다 — 자동이 조작을 넣고, 던전은 여기서 직접 굴린다.
         (헤드리스에서는 rAF 가 거의 안 돌아 게임 루프에 기댈 수 없다) */
      AU.setOn(true);
      var guard = 0;
      while (IT.matList().length === 0 && guard++ < 3000) {
        AU.update(0.05);
        if (DN.active()) { DN.update(0.05); }
        else { DN.enter({ floor: 8 }); }
      }
      AU.setOn(false);
      var got = IT.matList();
      if (DN.active()) { DN.leave(); }
      var lab = got[0].kind === 'jewel'
        ? DG.gemData.jewelName(got[0].jewel) : got[0].def.name;

    /* ── 직업(職業)과 무예(武藝) — 원작의 클래스·스킬 트리 ──

    t('직업 — 무기 밑감 열 가지가 다섯 직업을 다 연다', function () {

    t('무예 — 직업마다 아홉(세 갈래 × 세 단계)', function () {

    t('무예 — 모양이 다 구현돼 있다 (표에만 있는 모양은 없다)', function () {

    t('무예 — 다섯 단이 끝이고 점수가 없으면 못 올린다', function () {

    t('무예 — 상시(常時)는 칸에 못 걸고, 대신 늘 붙는다', function () {

      /* 무장의 '단련' 은 부대 체력을 올리는 상시다 */
      var warrior = D.heroes.filter(function (h) {

    t('무예 — 상시가 던전 수치에 실제로 얹힌다 (boonVal 한 곳)', function () {

    /* ── 원소(元素) — 원작의 피해 속성 ────────────────────
     * 보석을 **어디에 박느냐**가 곧 결이다:

     */

    var ED = DG.elemData;

    function bareLead() {
      /* 선두를 맨몸으로 — 원소를 재는 항목은 다른 장비가 섞이면 못 잰다 */
      C.save.gear.equip = {};
      C.save.gear.bag = [];
      return C.save.party[0];
    }

    t('원소 — 보석은 부위마다 다른 것을 준다 (무기 피해 · 갑주 저항 · 부적 능력치)', function () {
      var G = DG.gemData, bad = [], i;
      for (i = 0; i < G.GEMS.length; i++) {
        var g = G.GEMS[i];
        if (g.weapon.kind !== 'eldmg') { bad.push(g.key + ' 무기'); }
        if (g.armor.kind !== 'elres') { bad.push(g.key + ' 갑주'); }
        if (['flat', 'pct', 'world'].indexOf(g.charm.kind) < 0) { bad.push(g.key + ' 부적'); }
        if (g.weapon.el !== g.armor.el) { bad.push(g.key + ' 결이 다름'); }
      }
      /* 다섯 보석이 다섯 결을 하나씩 맡는다 */
      var els = G.GEMS.map(function (x) { return x.weapon.el; });
      var uniq = els.filter(function (x, j) { return els.indexOf(x) === j; });
      return bad.length === 0 && uniq.length === G.GEMS.length &&
        uniq.length === ED.GEM_ELEMENTS.length &&
        ('보석 ' + G.GEMS.length + '종 = 결 ' + uniq.length + '가지');
    });

    t('원소 — 무기에 박으면 그 결의 피해가 걷힌다', function () {
      var keep = C.save.gear.bag, keepEq = C.save.gear.equip;
      var id = bareLead();
      var w = IT.roll(20, { slot: 'weapon', tier: 4, sock: 2, unid: false });
      C.save.gear.bag.push(w);
      IT.equip(id, w.uid);
      var none = Object.keys(IT.elemDamage(id)).length;
      IT.addMat('gem', 'agate', 4, 1);                 // 완(完) 마노 → 화(火)
      IT.socket(w.uid, 'gem', 'agate', 4);
      var d = IT.elemDamage(id);
      C.save.gear.bag = keep; C.save.gear.equip = keepEq;
      return none === 0 && d.fire > 0 && !d.cold &&
        ('화(火) 피해 +' + d.fire);
    });

    t('원소 — 갑주에 박으면 그 결의 저항이 걷힌다', function () {
      var keep = C.save.gear.bag, keepEq = C.save.gear.equip;
      var id = bareLead();
      var a = IT.roll(20, { slot: 'armor', tier: 4, sock: 2, unid: false });
      C.save.gear.bag.push(a);
      IT.equip(id, a.uid);
      IT.addMat('gem', 'agate', 2, 1);
      IT.socket(a.uid, 'gem', 'agate', 2);
      var r = IT.elemResist(id);
      C.save.gear.bag = keep; C.save.gear.equip = keepEq;

      function mean(w) {
        var tot = 0, sum = 0, i;

    /* ── 3D 던전 (dungeon3d) — 3D 전환 1단계 ─────────────────

    t('3D — 화면 층이 없어도 판정은 그대로 돈다', function () {

    t('3D — 카메라가 방을 담을 만큼 물러난다', function () {
      var W = DN.ROOM_W, H = DN.ROOM_H;

      return a.dist > span * 0.9 && a.pos.y > 0 && a.pos.z > a.look.z &&

    t('3D — 마을(close)에서는 같은 방 크기라도 훨씬 당겨 본다 (사가의숲 쿼터뷰만큼)', function () {
      /* 2026-09-02 — "사가블로도 쿼터뷰가 너무 멀다"는 요청. 던전 방(close 없음)은
         벽 밖이 어둠뿐이라 멀리서 담아야 하지만, 마을은 담이 없는 열린 땅이라

         가깝다. 던전 쪽 거리는 이 손잡이 이전과 완전히 같아야 한다(회귀 없음) */
      var W = DN.ROOM_W, H = DN.ROOM_H;

      var town = D3.camAim(W / 2, H / 2, W, H, 1, 0.62, true);
      var span = Math.sqrt(W * W + H * H);
      return dungeon.dist > span * 0.9 && town.dist < dungeon.dist * 0.5 && town.dist > 0 &&

    t('3D — 플레이어를 따라가되 절반만 끌린다', function () {
      /* 온전히 따라가면 벽에 붙었을 때 방 밖 검은 여백이 화면 절반을 차지한다 */
      var W = DN.ROOM_W, H = DN.ROOM_H;
      var mid = D3.camAim(W / 2, H / 2, W, H, 1, 0.62);
      var edge = D3.camAim(20, H / 2, W, H, 1, 0.62);
      var moved = mid.look.x - edge.look.x;
      return moved > 0 && moved < (W / 2 - 20) &&
        ('가운데 → 왼쪽 끝으로 가면 카메라는 ' + Math.round(moved) + '만 움직인다 (' +

    t('3D — 회전이 없다 (원작이 그렇다)', function () {

      var W = DN.ROOM_W, H = DN.ROOM_H;
      var a = D3.camAim(W / 2, H / 2, W, H, 1, 0.62);
      return Math.abs(a.pos.x - a.look.x) < 0.001 && a.pos.z > a.look.z &&

    t('3D — 3인칭은 인물 뒤에 서서 앞을 본다', function () {

      var a = D3.camAim3rd(200, 200, 0, 1, 1, 0.62);
      return a.pos.z < 200 && a.look.z > 200 && a.pos.y > 0 &&

    t('3D — 3인칭은 방 크기와 무관하다', function () {

      var corner = D3.camAim3rd(30, 30, 1, 0, 1, 0.62);

    t('3D — 3인칭은 정지해도 마지막 방향을 본다', function () {

    t('3D — AUTO 품질은 프레임 시간이 나쁠수록 등급을 낮춘다', function () {

    t('3D — 사람이 확대하면(userZoom↑) 3인칭이 물러난다', function () {

    /* ── 들판 (field3d) — 3D 전환 2단계 ─────────────────────
     * PLAN 4·5·6절. **전부 순수 함수**라 화면 없이 값으로 다 본다 —
     * 씨앗이 같으면 같은 세상인가 · 조각이 몇이나 되는가 · 방 안은 평평한가.
     */

    var F3 = DG.field3d;

    t('들판 — 같은 씨앗이면 같은 세상이다 (PLAN 5절)', function () {
      var a = F3.seedOf(14, 2, '산채'), b2 = F3.seedOf(14, 2, '산채');
      var c2 = F3.seedOf(15, 2, '산채'), d2 = F3.seedOf(14, 3, '산채');
      var l1 = F3.chunkAt(2, -1, a, 2, 1).map(function (p) { return p.t; }).join('/');
      var l2 = F3.chunkAt(2, -1, b2, 2, 1).map(function (p) { return p.t; }).join('/');
      return a === b2 && a !== c2 && a !== d2 && l1 === l2 && l1.length > 0 &&
        ('14층 2방 씨앗이 늘 같다 · 조각 하나 = ' + l1);
    });

    t('들판 — 방 안은 평평하고 밖은 기복이 진다 (PLAN 4절)', function () {
      /* 방 안까지 지형이 들어오면 **보이는 것과 걷는 것이 어긋난다** —
         판정은 평면에서 돌기 때문이다 */
      var W = DN.ROOM_W, H = DN.ROOM_H;
      var s = F3.seedOf(14, 0, 'x');
      var inside = [[10, 10], [W / 2, H / 2], [W - 10, H - 10]]
        .map(function (p) { return F3.heightAt(p[0], p[1], s, W, H); });
      var far = [];
      for (var i = 1; i <= 6; i++) { far.push(F3.heightAt(-i * 120, -i * 120, s, W, H)); }
      var flat = inside.every(function (v) { return v === 0; });
      var bumpy = far.some(function (v) { return Math.abs(v) > 20; });
      return flat && bumpy &&
        ('방 안 셋 다 높이 0 · 밖 여섯 중 가장 센 것 ' +
         Math.round(Math.max.apply(null, far.map(Math.abs))));
    });

    t('들판 — 방 가까이는 사람이 지난 자리다 (PLAN 5절 "플레이 가능한 결과만")', function () {
      /* 완전 랜덤이면 방 바로 옆이 절벽으로 막히기도 한다 — 가까이는 길·캠프·폐허다 */
      var s = F3.seedOf(20, 1, 'y'), i, near = {}, far = {};
      for (i = 0; i < 40; i++) {
        near[F3.kindOf(i, -1, s + i, 1)] = 1;
        far[F3.kindOf(i, -5, s + i, 4)] = 1;
      }
      var nk = Object.keys(near).sort();
      return nk.indexOf('cliff') < 0 && nk.indexOf('water') < 0 &&
        Object.keys(far).length > nk.length &&
        ('가까이 ' + nk.join('/') + ' · 멀리 ' + Object.keys(far).sort().join('/'));
    });

    t('들판 — 방보다 대여섯 배 넓다 (PLAN 6절)', function () {
      var W = DN.ROOM_W, H = DN.ROOM_H;
      var sv = F3.survey(F3.seedOf(14, 0, 'z'), 3, W, H);
      var room = Math.max(W, H);
      return sv.chunks === 49 && sv.span >= room * 2 &&
        (sv.span / room) >= 2 &&
        ('조각 ' + sv.chunks + '개 · ' + sv.span + ' 사방 (방은 ' + W + '×' + H + ')');
    });

    t('들판 — 열 가지가 다 난다', function () {
      var s = F3.seedOf(7, 0, 'w'), seen = {}, cx, cz;
      for (cz = -6; cz <= 6; cz++) {
        for (cx = -6; cx <= 6; cx++) { seen[F3.kindOf(cx, cz, s, 3)] = 1; }
      }
      var got = Object.keys(seen).sort();
      var want = F3.KINDS.slice().sort();
      return got.length === want.length && got.join('/') === want.join('/') &&
        ('열세 칸 사방에서 ' + got.join('/'));
    });

    t('들판 — 절벽·동굴·제단처럼 큰 것은 ring 2 에는 안 선다', function () {
      /* 2026-08-30, 실기기(PC) — "1층 시작하자마자 캐릭터를 가린다" 로
         잡힌 버그. 절벽(h 120~270 · s 최대 2.8)이 방에서 chunk 하나
         남짓(ring 2, 카메라 거리 700 안쪽)에도 날 수 있었다 — 카메라는
         회전이 없어(17행) 한 번 걸리면 그 방을 볼 때마다 막힌다.
         ring 2 는 작은 것(숲·바위·폐허·길·물)까지만, 큰 것은 ring 3부터. */
      var BIG = { cliff: 1, cave: 1, altar: 1, camp: 1 };
      var s = F3.seedOf(11, 2, 'z'), hit = 0, cx, cz;
      for (cz = -6; cz <= 6; cz++) {
        for (cx = -6; cx <= 6; cx++) {
          if (F3.ringOf(cx, cz, 560, 360) === 2 && BIG[F3.kindOf(cx, cz, s, 2)]) { hit++; }
        }
      }
      return hit === 0 && 'ring 2 에서 절벽·동굴·제단·야영지 0번';
    });

    t('들판 — 이웃한 조각이 같은 성격으로 뭉치지 않는다', function () {
      /* 격자 좌표용 해시를 쓰면 이웃한 입력이 이웃한 답을 준다 —
         그러면 온 세상이 숲 한 판이 된다(사가고에서 밟은 그 함정) */
      var s = F3.seedOf(3, 1, 'q'), same = 0, n = 0, cx, cz;
      for (cz = -5; cz <= 5; cz++) {
        for (cx = -5; cx < 5; cx++) {
          n++;
          if (F3.kindOf(cx, cz, s, 3) === F3.kindOf(cx + 1, cz, s, 3)) { same++; }
        }
      }
      return same / n < 0.35 &&
        ('가로로 이웃한 110쌍 중 같은 성격은 ' + same + '쌍 (' +
         Math.round(same / n * 100) + '%)');
    });

    t('들판 — 밀도를 내리면 세울 것이 준다', function () {
      var s = F3.seedOf(9, 0, 'r');
      var full = 0, half = 0, cx, cz;
      for (cz = -3; cz <= 3; cz++) {
        for (cx = -3; cx <= 3; cx++) {
          full += F3.chunkAt(cx, cz, s, 2, 1).length;
          half += F3.chunkAt(cx, cz, s, 2, 0.4).length;
        }
      }
      return half < full && half > 0 &&
        ('배수 1 → ' + full + '개 · 0.4 → ' + half + '개');
    });

    t('들판 — 값을 내도 세이브는 그대로다', function () {
      var before = JSON.stringify(C.save);
      var s = F3.seedOf(11, 2, 't');
      F3.chunkAt(1, 1, s, 2, 1); F3.heightAt(500, 500, s, 560, 360); F3.survey(s, 2);
      return JSON.stringify(C.save) === before && '세이브 한 칸도 안 바뀐다';
    });

    /* ── 층 테마 편향 (2026-09-05, PLAN 9절 Biome) ──────────────
     * `kindOf()`가 다섯째 인자로 테마 이름을 받아 오브젝트 비율을 바꾼다.
     * 여태는 색깔(data-dungeon.js)만 층마다 다르고 무엇이 서는지는 여섯 층이
     * 다 같은 확률이었다 — 지옥문 밖에도 고분만큼 숲이 흔했다. */

    t('들판 테마 — 테마를 안 주면 예전과 완전히 같다 (회귀 방지)', function () {
      /* weightedKind() 로 갈아 끼운 뒤에도 이 자가진단의 다른 들판 항목이
         전부 그대로 통과해야 한다는 것 자체가 이미 회귀 증거지만, 여기서
         명시적으로 한 번 더 박아 둔다 — 다음에 THEME_BIAS 표를 고치다
         기본값(가중치 없음)을 실수로 건드리면 이 항목 하나만 바로 깨진다 */
      var s = F3.seedOf(23, 0, 'nobias'), cx, cz, seen = {};
      for (cz = -6; cz <= 6; cz++) {
        for (cx = -6; cx <= 6; cx++) { seen[F3.kindOf(cx, cz, s, 3)] = 1; }
      }
      var got = Object.keys(seen).sort(), want = F3.KINDS.slice().sort();
      return got.length === want.length && got.join('/') === want.join('/') &&
        ('테마 없이도 열 가지 다 남 — ' + got.join('/'));
    });

    t('들판 테마 — 수궁은 물·늪이, 산채는 숲이 뚜렷이 는다', function () {
      var cx, cz, i, water1 = 0, water2 = 0, forest1 = 0, forest2 = 0, n = 0;
      var floors = [5, 12, 19, 26, 33, 40, 47];   // 씨앗 여럿 평균 — 표본 하나로 요행 안 걸리게
      floors.forEach(function (fl) {
        var sNone = F3.seedOf(fl, 0, '수궁(水宮)');   // seedOf 자체도 테마 문자열을 섞으므로
        var sSwamp = sNone, sForest = F3.seedOf(fl, 0, '산채(山寨)');
        for (cz = -6; cz <= 6; cz++) {
          for (cx = -6; cx <= 6; cx++) {
            n++;
            var k1 = F3.kindOf(cx, cz, sSwamp, 3, '수궁(水宮)');
            if (k1 === 'water' || k1 === 'swamp') { water1++; }
            var k1b = F3.kindOf(cx, cz, sSwamp, 3);   // 같은 자리·테마만 뺀 대조군
            if (k1b === 'water' || k1b === 'swamp') { water2++; }
            var k2 = F3.kindOf(cx, cz, sForest, 3, '산채(山寨)');
            if (k2 === 'forest') { forest1++; }
            var k2b = F3.kindOf(cx, cz, sForest, 3);
            if (k2b === 'forest') { forest2++; }
          }
        }
      });
      return water1 > water2 * 1.6 && forest1 > forest2 * 1.15 &&
        ('수궁 물/늪 ' + water1 + ' vs 무편향 ' + water2 + ' · 산채 숲 ' +
         forest1 + ' vs 무편향 ' + forest2 + ' (표본 ' + n + ')');
    });

    /* ── 잡초 층 (2026-09-04, clutterAt) — SAGA WEB.md 감사로 채운 자리 ──
     * chunkAt() 과 갈라 둔 순수 함수라 여기서도 값으로만 본다. */

    t('잡초 — 같은 씨앗이면 같은 잡초다', function () {
      var s = F3.seedOf(5, 1, '숲');
      var l1 = F3.clutterAt(1, 0, s, 2, 1).map(function (p) { return p.t; }).join('/');
      var l2 = F3.clutterAt(1, 0, s, 2, 1).map(function (p) { return p.t; }).join('/');
      return l1 === l2 && ('한 조각 = ' + (l1 || '(없음)'));
    });

    t('잡초 — 물·동굴에는 안 심는다', function () {
      var s = F3.seedOf(14, 0, 'w'), cx, cz, bad = 0, n = 0;
      for (cz = -8; cz <= 8; cz++) {
        for (cx = -8; cx <= 8; cx++) {
          var ring = F3.ringOf(cx, cz, 560, 360);
          var kind = F3.kindOf(cx, cz, s, ring);
          if (kind !== 'water' && kind !== 'cave') { continue; }
          n++;
          if (F3.clutterAt(cx, cz, s, ring, 1).length) { bad++; }
        }
      }
      return n > 0 && bad === 0 && ('물·동굴 조각 ' + n + '개 모두 잡초 0개');
    });

    t('잡초 — 덤불·버섯·통나무는 숲에서만 난다', function () {
      var s = F3.seedOf(6, 0, 'f'), cx, cz, offForest = 0;
      var WOOD = { bush: 1, mushroom: 1, log: 1 };
      for (cz = -8; cz <= 8; cz++) {
        for (cx = -8; cx <= 8; cx++) {
          var ring = F3.ringOf(cx, cz, 560, 360);
          var kind = F3.kindOf(cx, cz, s, ring);
          if (kind === 'forest') { continue; }
          F3.clutterAt(cx, cz, s, ring, 1).forEach(function (p) {
            if (WOOD[p.t]) { offForest++; }
          });
        }
      }
      return offForest === 0 && '숲이 아닌 조각에서 덤불·버섯·통나무 0개';
    });

    t('잡초 — 밀도를 내리면 잡초도 준다', function () {
      var s = F3.seedOf(8, 1, 'd'), full = 0, half = 0, cx, cz;
      for (cz = -3; cz <= 3; cz++) {
        for (cx = -3; cx <= 3; cx++) {
          var ring = F3.ringOf(cx, cz, 560, 360);
          full += F3.clutterAt(cx, cz, s, ring, 1).length;
          half += F3.clutterAt(cx, cz, s, ring, 0.4).length;
        }
      }
      return half <= full && full > 0 &&
        ('배수 1 → ' + full + '개 · 0.4 → ' + half + '개');
    });

    /* ── 판정을 방에서 필드로 잇는다 (4a67af2, PLAN 4·5·6절 나머지 절반) ──
     * 위 들판 테스트들은 field3d 가 값을 잘 내는지만 본다 — 그 값을 실제로
     * `boundPlayer` 가 읽어서 방 밖으로 걸어 나가게 해 주는지는 아무도
     * 안 붙들고 있었다(회귀진단 0건). field on/off 대비로 여기서 고정한다.
     */

    t('필드 on — 던전 방 안에서 옛 벽 경계를 넘어 걸어 나간다', function () {
      D3.set('dg3d.field', 1);
      DN.enter({ floor: 1, mode: 'easy' });
      var run = DN.raw();
      var oldHiX = DN.ROOM_W - DN.WALL - DN.P_R;   // 옛(필드 없던 시절) 오른쪽 클램프
      run.player.x = oldHiX - 5; run.player.y = DN.ROOM_H / 2;
      run.player.dash = null;
      DN.setInput(1, 0);
      var i, x;
      for (i = 0; i < 80; i++) { DN.update(0.05); }   // 4초 — 방 오른쪽 끝까지 충분
      x = DN.raw().player.x;
      DN.setInput(0, 0);
      DN.leave();
      D3.set('dg3d.field', null);
      return x > oldHiX + 10 &&
        ('옛 경계 ' + oldHiX + ' → 걸어서 ' + Math.round(x) + ' 까지');
    });

    t('필드 off — 옛 클램프 그대로 방 안에 갇힌다', function () {
      D3.set('dg3d.field', 0);
      DN.enter({ floor: 1, mode: 'easy' });
      var run = DN.raw();
      var oldHiX = DN.ROOM_W - DN.WALL - DN.P_R;
      run.player.x = oldHiX - 5; run.player.y = DN.ROOM_H / 2;
      run.player.dash = null;
      DN.setInput(1, 0);
      var i, x;
      for (i = 0; i < 80; i++) { DN.update(0.05); }
      x = DN.raw().player.x;
      DN.setInput(0, 0);
      DN.leave();
      D3.set('dg3d.field', null);
      return Math.abs(x - oldHiX) < 0.5 &&
        ('필드 꺼져 있으면 여전히 ' + oldHiX + ' 에 갇힌다 (실측 ' + x.toFixed(1) + ')');
    });

    /* ── 전투 연출 (fx3d) — 3D 전환 3단계 ────────────────────
     * PLAN 51·52·53절. 판정이 흘려 주는 fx 를 입체로 세우는 층이다.
     * 그림은 three 가 있어야 서지만 **처방은 값이라** 여기서 다 본다.
     */

    var FX = DG.fx3d;

    t('연출 — 화면 층이 없어도 판정은 그대로 돈다', function () {
      /* 진단은 three 를 안 켠다(DG_NO_DRAW). 그래도 처방은 나와야 한다 */
      return FX.ready() === false &&
        FX.plan({ t: 'hit', x: 0, y: 0, v: 12, life: 0.6 }) !== null &&
        '진단에서는 그림 층이 잠들어 있다';
    });

    t('연출 — 숫자가 2D 와 한 글자도 다르지 않다 (PLAN 52절)', function () {
      /* 2D 로 보다가 3D 로 켰을 때 숫자가 달라 보이면 같은 판이 아니다 */
      var crit = FX.textOf({ t: 'hit', v: 450, crit: true });
      var dot = FX.textOf({ t: 'elem', v: 7, dot: true });
      var pure = FX.textOf({ t: 'elem', v: 7 });
      return crit === '★450' && dot === '(7)' && pure === '7' &&
        (crit + ' · ' + dot + ' · ' + pure);
    });

    t('연출 — 저항에 깎인 타격은 잿빛이다', function () {
      var plain = FX.numHex({ t: 'hit', v: 10 });
      var crit = FX.numHex({ t: 'hit', v: 10, crit: true });
      var res = FX.numHex({ t: 'hit', v: 10, resist: true });
      var foe = FX.numHex({ t: 'hit', v: 10, foe: true });
      return plain === 0xffffff && crit !== plain && res !== plain && foe !== plain &&
        res !== crit &&
        ('여느 값 #' + plain.toString(16) + ' · 회심 #' + crit.toString(16) +
         ' · 저항 #' + res.toString(16) + ' · 내가 맞음 #' + foe.toString(16));
    });

    t('연출 — 글리프판에 없는 글자는 자리를 비운다', function () {
      /* 한글은 판에 없다 — 없는 글자에 0번 칸(숫자 0)이 뜨면 엉뚱한 값이 보인다 */
      var num = FX.glyphs('★12');
      var kor = FX.glyphs('감정서');
      var ok = true, i;
      for (i = 0; i < num.length; i++) { if (num[i] < 0) { ok = false; } }
      for (i = 0; i < kor.length; i++) { if (kor[i] >= 0) { ok = false; } }
      return ok && num.length === 3 && kor.length === 3 &&
        ('★12 → ' + num.join(',') + ' · 한글 셋은 다 ' + kor.join(','));
    });

    t('연출 — 사그라지며 흐려지고 떠오른다', function () {
      var fresh = FX.plan({ t: 'hit', x: 0, y: 0, v: 30, life: 0.58 });
      var old = FX.plan({ t: 'hit', x: 0, y: 0, v: 30, life: 0.06 });
      return fresh.alpha > old.alpha && old.rise > fresh.rise && old.k > fresh.k &&
        ('진하기 ' + fresh.alpha.toFixed(2) + ' → ' + old.alpha.toFixed(2) +
         ' · 높이 ' + Math.round(fresh.rise) + ' → ' + Math.round(old.rise));
    });

    t('연출 — 판정이 흘리는 아홉 가지를 다 받는다 (PLAN 51절)', function () {
      var kinds = {}, miss = [], i;
      var all = ['hit', 'elem', 'get', 'slash', 'pop', 'burst', 'whirl', 'ring', 'trail'];
      for (i = 0; i < all.length; i++) {
        var pl = FX.plan({ t: all[i], x: 0, y: 0, v: 1, r: 60, text: '금', life: 0.2 });
        if (!pl) { miss.push(all[i]); continue; }
        kinds[pl.kind] = 1;
      }
      /* 모르는 종류는 조용히 넘긴다 — 판정에 새 연출이 늘어도 안 깨진다 */
      return miss.length === 0 && FX.plan({ t: 'newthing', life: 1 }) === null &&
        ('아홉이 ' + Object.keys(kinds).sort().join('/') + ' 로 갈린다');
    });

    t('연출 — 숫자가 쏟아져도 노드를 더 만들지 않는다 (PLAN 52절 Object Pool)', function () {
      var made = 0;
      var p = FX.pool(function () { made++; return { id: made }; }, 8);
      var got = 0, i;
      for (i = 0; i < 300; i++) { if (p.take()) { got++; } }
      var over = p.stats();
      p.reset();
      var again = p.take();
      return made === 8 && got === 8 && over.dropped === 292 && again !== null &&
        ('300번 달라 해도 만든 것은 ' + made + '개 · 넘긴 것 ' + over.dropped + '번');
    });

    t('연출 — 화면 흔들림은 상한이 있고 곧 죽는다 (PLAN 51절)', function () {
      var boss = FX.shakeOf({ t: 'pop', boss: true });
      var mob = FX.shakeOf({ t: 'pop' });
      var mine = FX.shakeOf({ t: 'hit', foe: true });
      var none = FX.shakeOf({ t: 'hit' });
      var after = FX.shakeStep(boss, 0.5);
      return boss > mob && mine > 0 && none === 0 && boss <= FX.SHAKE_MAX &&
        after === 0 &&
        ('보스 격파 ' + boss + ' · 잡졸 ' + mob + ' · 내가 맞음 ' + mine +
         ' · 반 초 뒤 ' + after);
    });

    t('연출 — 맞은 순간만 번쩍인다', function () {
      /* hurt 는 적이 0.2 · 사람이 0.28 에서 줄어든다 */
      return FX.flashOf(0.2, 0.2) === 1 && FX.flashOf(0.1, 0.2) === 0.5 &&
        FX.flashOf(0, 0.2) === 0 && FX.flashOf(0.28, 0.28) === 1 &&
        '갓 맞으면 1 · 다 지나면 0';
    });

    t('연출 — 원소 색은 판정이 준 색을 쓴다', function () {
      /* 색을 3D 가 새로 정하면 같은 무예가 2D 와 다른 결로 보인다 */
      var fire = FX.shotHex({ color: '#e06565' });
      var none = FX.shotHex({});
      return fire === 0xe06565 && none === 0x9fe8ff &&
        ('#' + fire.toString(16) + ' · 색이 없으면 #' + none.toString(16));
    });

    t('연출 — 맞으면 바탕이 붉게 물들되 다 붉어지지는 않는다', function () {
      var calm = FX.hurtTint(0x101018, 0, 0);
      var hit = FX.hurtTint(0x101018, 0.28, 0);
      var dying = FX.hurtTint(0x101018, 0.28, 1);
      return calm === 0x101018 && hit !== calm && dying !== hit &&
        (dying & 255) < 200 &&
        ('평시 #' + calm.toString(16) + ' → 피격 #' + hit.toString(16) +
         ' → 위태 #' + dying.toString(16));
    });

    t('연출 — 값을 내도 세이브는 그대로다', function () {
      var before = JSON.stringify(C.save);
      FX.plan({ t: 'burst', x: 1, y: 1, boss: true, life: 0.3, seed: 1 });
      FX.glyphs('123'); FX.shakeOf({ t: 'pop' }); FX.stats();
      return JSON.stringify(C.save) === before && '세이브 한 칸도 안 바뀐다';
    });

    /* ── 미니맵 (minimap.js, PLAN 27절) ────────────────────────
     * 그리기(canvas)는 안 켠다 — 값을 내는 함수(blips·norm)만 순수하게 본다.
     * DG_NO_DRAW 라 game.js 의 init()·tick() 은 안 불렸으므로 `node` 도 없다 —
     * 여기서 만지는 건 오로지 `dungeon.raw()` 를 읽는 값 함수뿐이다. */
    var MM = DG.minimap;

    t('미니맵 — 방 안 좌표를 0~1 로 편다 (방 벽 네 모서리)', function () {
      /* norm() 은 이제 마을이 켜져 있으면 마을 치수를 쓴다(PLAN 28-1절 뒤,
         마을 전체 지도 확장) — 이 검사는 던전 치수를 보는 것이니 마을이
         앞선 테스트에서 켜진 채로 남아 있으면 반드시 끈다. */
      if (DG.town && DG.town.active()) { DG.town.leave(); }
      var W = DN.ROOM_W, H = DN.ROOM_H, WALL = DN.WALL;
      var topLeft = MM.norm(WALL, WALL);
      var botRight = MM.norm(W - WALL, H - WALL);
      var mid = MM.norm(W / 2, H / 2);
      var ok = Math.abs(topLeft.nx) < 0.01 && Math.abs(topLeft.ny) < 0.01 &&
        Math.abs(botRight.nx - 1) < 0.01 && Math.abs(botRight.ny - 1) < 0.01 &&
        Math.abs(mid.nx - 0.5) < 0.01 && Math.abs(mid.ny - 0.5) < 0.01;
      return ok && ('모서리 (0,0)·(1,1) · 한가운데 (' + mid.nx.toFixed(2) + ',' + mid.ny.toFixed(2) + ')');
    });

    t('미니맵 — 전투방은 산 적만 점으로 찍힌다 (죽은 적은 빠진다)', function () {
      if (DN.active()) { DN.leave(); }
      DN.enter({ floor: 1, mode: 'easy' });
      var run = DN.raw();
      run.room.enemies = [
        { x: 300, y: 180, hp: 10, hpMax: 10, boss: false, elite: null },
        { x: 320, y: 190, hp: 0, hpMax: 10, boss: false, elite: null }   // 죽은 적
      ];
      var bs = MM.blips(run);
      var enemyDots = bs.filter(function (b) { return b.t === 'enemy'; });
      DN.leave();
      return enemyDots.length === 1 && ('산 적 1점만 (죽은 적 제외) · 전체 ' + bs.length + '점(문 포함)');
    });

    t('미니맵 — 정예·보스는 다른 색으로 갈린다', function () {
      if (DN.active()) { DN.leave(); }
      DN.enter({ floor: 1, mode: 'easy' });
      var run = DN.raw();
      run.room.enemies = [
        { x: 300, y: 180, hp: 10, hpMax: 10, boss: false, elite: null },
        { x: 310, y: 180, hp: 10, hpMax: 10, boss: false, elite: 'brute' },
        { x: 320, y: 180, hp: 10, hpMax: 10, boss: true, elite: null }
      ];
      var bs = MM.blips(run);
      var kinds = bs.map(function (b) { return b.t; }).filter(function (t2) {
        return t2 === 'enemy' || t2 === 'elite' || t2 === 'boss';
      });
      DN.leave();
      return kinds.indexOf('enemy') >= 0 && kinds.indexOf('elite') >= 0 && kinds.indexOf('boss') >= 0 &&
        ('종류 3개 다 나옴 · ' + kinds.join(','));
    });

    t('미니맵 — POI 는 다 쓰면(taken/used) 점이 사라진다', function () {
      if (DN.active()) { DN.leave(); }
      DN.enter({ floor: 1, mode: 'easy' });
      var run = DN.raw();
      run.room.cleared = true;
      DN.goRoom('trove');                        // 상자방
      run = DN.raw();
      var before = MM.blips(run).filter(function (b) { return b.t === 'poi'; }).length;
      run.room.chest.taken = true;
      var after = MM.blips(run).filter(function (b) { return b.t === 'poi'; }).length;
      DN.leave();
      return before === 1 && after === 0 && ('열기 전 ' + before + '점 → 연 뒤 ' + after + '점');
    });

    t('미니맵 — 문은 늘 오른쪽 벽 자리다', function () {
      if (DN.active()) { DN.leave(); }
      DN.enter({ floor: 1, mode: 'easy' });
      var run = DN.raw();
      var bs = MM.blips(run).filter(function (b) { return b.t === 'door'; });
      var rightX = MM.norm(DN.ROOM_W - DN.WALL, 0).nx;
      var ok = bs.length === run.room.doors.length && bs.every(function (b) { return Math.abs(b.nx - rightX) < 0.01; });
      DN.leave();
      return ok && (bs.length + '개 문, 전부 오른쪽 벽 자리');
    });

    t('장비 슬롯 — PLAN 30절로 8개(무기·갑주·투구·장갑·신발·반지·목걸이·부적)', function () {
      var D = DG.itemData;
      var need = ['weapon', 'armor', 'helm', 'glove', 'boot', 'ring', 'neck', 'charm'];
      var ok = D.SLOTS.length === need.length &&
        need.every(function (k) { return D.SLOTS.indexOf(k) >= 0 && D.slotKor(k) !== k; });
      return ok && (D.SLOTS.length + '개 · ' + D.SLOTS.map(D.slotKor).join(' '));
    });

    t('장비 — 새 부위(투구·반지 등)도 굴리고 입을 수 있다', function () {
      var IT = DG.item, id = C.save.party[0];
      var keep = C.save.gear.bag, keepEq = C.save.gear.equip;
      C.save.gear.bag = []; C.save.gear.equip = {};
      var slots = ['helm', 'glove', 'boot', 'ring', 'neck'], ok = true, i, worn = [];
      for (i = 0; i < slots.length; i++) {
        var g = IT.roll(1, { slot: slots[i], tier: 0, unid: false });
        C.save.gear.bag.push(g);
        if (!IT.equip(id, g.uid) || IT.equipped(id)[slots[i]] !== g) { ok = false; }
        worn.push(slots[i]);
      }
      C.save.gear.bag = keep; C.save.gear.equip = keepEq;
      return ok && ('입힘 ' + worn.join(' '));
    });

    t('장비 — 반지·목걸이·부적은 안 닳고, 투구·장갑·신발은 닳는다', function () {
      var IT = DG.item;
      var noDur = ['ring', 'neck', 'charm'].every(function (s) {
        return IT.durMaxOf(IT.roll(10, { slot: s, tier: 2 })) === 0;
      });
      var hasDur = ['helm', 'glove', 'boot'].every(function (s) {
        return IT.durMaxOf(IT.roll(10, { slot: s, tier: 2 })) > 0;
      });
      return noDur && hasDur && ('장신구 0 · 나머지 >0');
    });

    t('세공 — 투구·장갑·신발엔 갑주 결(저항), 반지·목걸이엔 부적 결(능력치)로 보석이 붙는다', function () {
      var IT = DG.item, GD = DG.gemData;
      var helm = IT.roll(10, { slot: 'helm', tier: 4, sock: 1, unid: false });
      var keep = C.save.gear.bag;
      C.save.gear.bag = [helm];
      IT.addMat('gem', 'agate', 0, 1);
      var r1 = IT.socket(helm.uid, 'gem', 'agate', 0);
      var eff1 = IT.socketEffects(helm);
      var ring = IT.roll(10, { slot: 'ring', tier: 4, sock: 1, unid: false });
      C.save.gear.bag = [ring];
      IT.addMat('gem', 'agate', 0, 1);
      var r2 = IT.socket(ring.uid, 'gem', 'agate', 0);
      var eff2 = IT.socketEffects(ring);
      C.save.gear.bag = keep;
      var okHelm = r1.ok && eff1.length === 1 && eff1[0].kind === 'elres';
      var okRing = r2.ok && eff2.length === 1 && eff2[0].kind === 'pct';
      return okHelm && okRing && ('투구 ' + (eff1[0] && eff1[0].kind) + ' · 반지 ' + (eff2[0] && eff2[0].kind));
    });

    t('퀘스트(PLAN 36절) — 표 — 메인 8 · 지역은 THEMES 수와 같다 · 이벤트 3', function () {
      var QD = DG.questData, DD = DG.dungeonData;
      var mainOk = QD.MAIN.length === 8 && QD.MAIN.every(function (m) {
        return m.req && m.req.t && m.reward && (m.reward.gold || m.reward.exp);
      });
      var regionOk = QD.REGION.length === DD.THEMES.length;
      var eventOk = QD.EVENT.length === 3;
      var poolOk = QD.RANDOM_POOL.every(function (p) { return typeof p.descOf === 'function'; });
      return mainOk && regionOk && eventOk && poolOk &&
        ('메인 ' + QD.MAIN.length + ' · 지역 ' + QD.REGION.length + ' · 이벤트 ' + QD.EVENT.length);
    });

    t('퀘스트 — 층에 닿으면 floor 형 메인이 그 자리에서 채워지고 보상이 나가 다음으로 넘어간다', function () {
      var Q = DG.quest, keep = C.save.quest;
      delete C.save.quest;
      var g0 = C.save.player.gold;
      Q._onFloor(3);                                    // 메인 1번 — 제3층까지
      var st = Q.status();
      var got = C.save.player.gold > g0 && st.mainIdx === 1;
      C.save.quest = keep;
      return got && ('금 +' + (C.save.player.gold - g0) + ' · 다음 메인 ' + (st.mainIdx + 1) + '번째');
    });

    t('퀘스트 — 지역은 최고 도달 층이 닿아야 열리고, 안 닿은 지역은 잠긴 채다', function () {
      var Q = DG.quest, DN = DG.dungeon, keep = C.save.quest, keepBest = DN.state().best;
      delete C.save.quest;
      DN.state().best = 8;                              // 폐성(6층부터)까지는 닿았다
      var st = Q.status();
      var opened = !st.regions[0].locked && !st.regions[1].locked;
      var stillLocked = st.regions[2].locked;            // 산채(11층부터)는 아직
      DN.state().best = keepBest;
      C.save.quest = keep;
      return opened && stillLocked && ('0·1 열림 · 2 잠김');
    });

    t('퀘스트 — kill 은 태그(정예·보스)를 가리고, 지역 몫도 같이 채운다', function () {
      var Q = DG.quest, DN = DG.dungeon, keep = C.save.quest, keepBest = DN.state().best;
      delete C.save.quest;
      DN.state().best = 8;
      Q._onFloor(3);                                    // m1 끝 → m2(정예 3마리)로 넘어간다
      var st0 = Q.status();
      var region0have = st0.regions[1].have;             // 폐성(idx 1)
      Q._onKill({ e: { elite: null, boss: false }, floor: 7 });   // 잡졸 — 메인(정예 3)엔 안 셈
      var st1 = Q.status();
      var mainUnchanged = st1.mainIdx === st0.mainIdx && st1.main.have === st0.main.have;
      var regionGrew = st1.regions[1].have === region0have + 1;
      Q._onKill({ e: { elite: 'brute', boss: false }, floor: 7 });  // 정예 — 메인이 는다
      var st2 = Q.status();
      var mainGrew = st2.main.have === st1.main.have + 1;
      DN.state().best = keepBest;
      C.save.quest = keep;
      return mainUnchanged && regionGrew && mainGrew && ('잡졸은 메인 무시 · 지역은 다 셈 · 정예는 메인도 셈');
    });

    t('퀘스트 — 방 발견(discover)과 구출(rescue)이 각각 다른 퀘스트를 채운다', function () {
      var Q = DG.quest, keep = C.save.quest;
      delete C.save.quest;
      /* 메인을 사당 발견(3번째)까지 밀어 둔다 */
      Q._onFloor(3);                                     // m1 끝
      Q._onKill({ e: { elite: 'brute', boss: false }, floor: 1 });
      Q._onKill({ e: { elite: 'brute', boss: false }, floor: 1 });
      Q._onKill({ e: { elite: 'brute', boss: false }, floor: 1 }); // m2(정예 3) 끝
      var before = Q.status();
      Q._onRoom({ kind: 'trove' });                       // m3 — 상자방
      var afterRoom = Q.status();
      var g0 = C.save.player.gold;
      Q._onRescue();                                      // 이벤트 1단(구출 1명)
      var afterRescue = Q.status();
      var roomAdvanced = before.mainIdx === 2 && afterRoom.mainIdx === 3;
      var rescueGranted = C.save.player.gold > g0 && afterRescue.eventDone === false;
      C.save.quest = keep;
      return roomAdvanced && rescueGranted && ('m3 완료 · 이벤트 1단 완료');
    });

    t('퀘스트 — 현상(무작위)은 늘 하나 떠 있고, 다시 뽑기가 딴 것으로 바꾼다', function () {
      var Q = DG.quest, keep = C.save.quest;
      delete C.save.quest;
      var st0 = Q.status();
      var has = !!st0.random && !!st0.random.name && st0.random.need > 0;
      Q.reroll();
      var st1 = Q.status();
      var stillOne = !!st1.random;
      C.save.quest = keep;
      return has && stillOne && ('현상 · ' + st0.random.name + ' → ' + st1.random.name);
    });

    /* 맨 끝에 둔다 — 세이브를 실제로 비우므로 뒤에 상태를 쓰는 항목이 있으면 안 된다.
       reset() 이 빈 채로 v:1 을 저장해 두면 다음 load() 가 "있는 세이브"로 읽어
       fresh 가 false 가 되고, 출사표(첫 인물 셋)가 다시 안 나가 동행·도감이
       영영 빈 채로 갇힌다(던전 입장도 부대가 있어야 하니 벗어날 길이 없다).
       사용자가 실제로 이 자리에 갇혀 신고했다(2026-08-30) */
    t('reset — 빈 세이브를 v:1 로 저장해 두지 않는다 (다음 load 가 fresh 로 보이게)', function () {
      C.reset();
      var raw = localStorage.getItem(C.SAVE_KEY);
      var loadsAsFresh = C.load() === false;
      return raw === null && loadsAsFresh && '지워짐 · 다음 load() === false (fresh)';
    });

    t('출사표 자가치유 조건 — 세이브가 있어도 동행·도감이 둘 다 비면 fresh 로 잡힌다', function () {
      /* 옛 reset() 이 남긴 "빈 채로 저장된 v:1" 세이브를 흉내낸다.
         game.js 의 start() 는 `!fresh && !party.length && !dex 개수` 일 때
         fresh 를 다시 true 로 되돌린다 — 그 조건이 여기서도 참이어야 한다
         (start() 자체를 다시 부르진 않는다 — ui·dungeonView 가 이중 초기화된다) */
      localStorage.setItem(C.SAVE_KEY, JSON.stringify({
        v: 1, createdAt: Date.now(), lastSeen: Date.now(),
        player: {}, dex: { heroes: {}, pets: {} }, party: [], settings: {}, log: []
      }));
      var fresh = !C.load();
      var wouldHeal = !fresh && !C.save.party.length && !Object.keys(C.save.dex.heroes).length;
      localStorage.removeItem(C.SAVE_KEY);
      return !fresh && wouldHeal && '있는 세이브인데 갇힌 모양 → 자가치유 조건 참';
    });

    /* 아래 둘은 일부러 맨 끝 가까이 둔다 — `DN.enter()`/`leave()` 를 여섯 번
       더 돌리면 그때마다 방·전리품을 새로 굴리며 공유 RNG 수열을 상당히
       소비한다. 앞쪽에 끼워 넣었더니 그 뒤에 오는 무관한 항목(부문어 순서)의
       수열이 밀려 실패했다 — 자리를 맨 끝으로 옮겨 그 뒤에 오는 항목이
       "진단의 무작위는 씨앗으로 고정된다"·"런타임 에러 없음" 둘뿐이 되게
       했다(둘 다 정확한 수열 값을 안 따진다). */
    t('지역 도감 — 층 테마 여섯 곳에 처음 닿으면 등록된다', function () {
      /* 이 자리(맨 끝)에 오면 위쪽 "reset" 항목이 이미 부대를 비워 둔 뒤다 —
         `enter()` 는 부대가 없으면 거절하므로 임시로 하나 채워 준다(다른
         항목들의 "keep → 임시로 갈아끼움 → 복원" 과 같은 손짓). */
      var keep = C.save.dex.regions, keepParty = C.save.party.slice();
      C.save.dex.regions = {};
      if (!C.save.party.length) { C.save.party = [D.heroes[0].id]; }
      var seq = DG.dungeonData.THEMES.map(function (th) { return th.from; });
      var counts = seq.map(function (floor) {
        if (DN.active()) { DN.leave(); }
        DN.enter({ floor: floor });
        return Object.keys(C.save.dex.regions).length;
      });
      if (DN.active()) { DN.leave(); }
      var monotone = counts.every(function (n, i) { return n === i + 1; });
      C.save.dex.regions = keep;
      C.save.party = keepParty;
      return monotone && ('여섯 지역 순서대로 ' + counts.join('→'));
    });

    t('도감 완성 — 지역 전부를 밟으면 한 번만 보상', function () {
      var keepDex = C.save.dex.regions, keepGold = C.save.player.gold, keepFeat = C.save.player.feat;
      var names = DG.dungeonData.THEMES.map(function (th) { return th.name; });
      C.save.dex.regions = {};
      delete C.save.dex.regionsFull;
      names.forEach(function (nm, i) { if (i < names.length - 1) { C.save.dex.regions[nm] = true; } });
      var last = names[names.length - 1];
      var goldBefore = C.save.player.gold, featBefore = C.save.player.feat;
      C.emit('dex:new', { cat: 'regions', id: last });    // 마지막 지역 — 아직 도감엔 없다
      C.save.dex.regions[last] = true;
      C.emit('dex:new', { cat: 'regions', id: last });     // 등록된 뒤 다시 알림 — 이제 완성
      var gained1 = C.save.player.gold - goldBefore, featGained1 = C.save.player.feat - featBefore;
      C.emit('dex:new', { cat: 'regions', id: last });     // 또 와도 두 번은 안 준다
      var gained2 = C.save.player.gold - goldBefore;
      var ok = gained1 === 800 && featGained1 === 30 && gained2 === 800 && C.save.dex.regionsFull === true;
      C.save.dex.regions = keepDex; C.save.player.gold = keepGold; C.save.player.feat = keepFeat;
      delete C.save.dex.regionsFull;
      return ok && ('완성 보상 금 +' + gained1 + ' · 공적 +' + featGained1 + ', 재지급 없음');
    });

    /* ── 오픈월드 설계안 Phase 1 — 통로 자리 잡기 (PLAN §28-2, 2026-09-05) ──
     * 아직 아무 판정에도 안 쓰인다(travel() 트리거는 그대로 exit_* 표식에
     * 있다) — 좌표 계산만 exitPoint 와 같은 축으로 어긋나지 않는지 본다.
     * 새 RNG 소비가 없는 순수 좌표 계산이라 자리는 아무 데나 둬도 되지만,
     * 관례대로 맨 끝 쪽에 붙인다. */
    t('통로 진입점(오픈월드 §28-2 Phase 1)이 들길 표식과 같은 축으로 어긋나지 않는다', function () {
      var T = DG.town;
      T._reset('moru');
      var raw = T.raw(), exitToGaldae = null;
      raw.room.marks.forEach(function (o) { if (o.key === 'exit_galdae') { exitToGaldae = o; } });
      if (!exitToGaldae) { return false; }
      var len = T.corridorLenOf('moru', 'galdae');
      var F = DG.field3d, CHUNK = F ? F.CHUNK : 200;
      /* safePoint 이전(Raw) 값으로 축을 정확히 잰다 — 장애물 회피가 축을
         조금 틀 수 있어 그 값으로는 등호 비교를 못 한다(exitPoint/
         exitPointRaw 를 가른 것과 같은 이유). */
      var rawPt = T.corridorPointRaw('E', len);
      var axisOk = rawPt.y === exitToGaldae.y &&
        Math.abs((rawPt.x - exitToGaldae.x) - len * CHUNK) < 0.01;
      /* 실제로 쓰일 값(safePoint 적용)도 회피 최대 이동량(약 280) 안에서
         같은 자리 근방인지 — 완전히 딴 데로 안 튀는지만 본다. */
      var safePt = T.corridorPoint('E', raw.theme, len);
      var closeOk = Math.hypot(safePt.x - rawPt.x, safePt.y - rawPt.y) < 300;
      return axisOk && closeOk &&
        ('통로 ' + len + '칸(' + (len * CHUNK) + ') · 들길에서 축 그대로 더 바깥');
    });

    t('진단의 무작위는 씨앗으로 고정된다', function () {
      /* 같은 씨앗이면 같은 수열 — 이 항목이 깨지면 위 항목들의 수치도 흔들린다 */
      return window.DG_SEED === 20260824 &&
        Math.random() >= 0 && Math.random() < 1 &&
        ('씨앗 ' + window.DG_SEED);
    });

    t('런타임 에러 없음', function () {
      return errors.length === 0 || ('에러 ' + errors.length + '건: ' + errors.join(' | ')) === '';
    });

    var failCount = out.filter(function (s) { return s.indexOf('FAIL') >= 0; }).length;
    document.getElementById('report').innerHTML =
      '<h3>사가블로 자가진단 — ' + (out.length - failCount) + '/' + out.length + ' 통과</h3>' +
      out.join('<br>') +
      (errors.length ? '<br><br><b class="fail">런타임 에러</b><br>' + errors.join('<br>') : '');
    document.title = 'RESULT ' + (out.length - failCount) + '/' + out.length;
    localStorage.removeItem(C.SAVE_KEY);
  }, 500);
})();
</script>
</body>
</html>
